<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12344D"/>
      <stop offset="0.5" stop-color="#0A1B2C"/>
      <stop offset="1" stop-color="#050E18"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7DD3FC" stroke-opacity="0.07" stroke-width="2"/>
    </pattern>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC861"/>
      <stop offset="1" stop-color="#FF6A4D"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.14" stop-color="#67E8F9"/>
      <stop offset="0.5" stop-color="#F0FDFF"/>
      <stop offset="0.86" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur8" x="-30%" y="-300%" width="160%" height="700%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="blur6" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="round"><rect width="512" height="512" rx="114"/></clipPath>
    <clipPath id="above"><rect x="0" y="0" width="512" height="268"/></clipPath>
    <clipPath id="below"><rect x="0" y="268" width="512" height="244"/></clipPath>
    <g id="tiles">
      <rect x="96" y="104" width="146" height="186" rx="18"/>
      <rect x="96" y="304" width="146" height="104" rx="18"/>
      <rect x="256" y="230" width="92" height="178" rx="18"/>
      <rect x="362" y="230" width="54" height="82" rx="14"/>
      <rect x="362" y="326" width="54" height="82" rx="14"/>
    </g>
  </defs>
  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <rect width="512" height="512" fill="url(#halo)"/>

    <!-- not yet scanned: faint outlines -->
    <g clip-path="url(#below)" fill="#2DD4BF" fill-opacity="0.05" stroke="#2DD4BF" stroke-opacity="0.38" stroke-width="7">
      <use href="#tiles"/>
    </g>

    <!-- scanned: the trail of light and bright tiles -->
    <rect x="0" y="88" width="512" height="180" fill="url(#trail)" clip-path="url(#above)"/>
    <g clip-path="url(#above)" fill="#22D3EE" fill-opacity="0.18" stroke="#67E8F9" stroke-width="7">
      <use href="#tiles"/>
    </g>
    <g clip-path="url(#above)" stroke="#CFFAFE" stroke-opacity="0.75" stroke-width="9" stroke-linecap="round">
      <path d="M124 144H200M124 172H176M124 200H212M124 228H164"/>
    </g>

    <!-- the hotspot -->
    <rect x="256" y="104" width="160" height="112" rx="18" fill="url(#hot)" opacity="0.55" filter="url(#blur6)"/>
    <rect x="256" y="104" width="160" height="112" rx="18" fill="url(#hot)"/>
    <path d="M276 134H352M276 160H326" stroke="#FFF4E0" stroke-opacity="0.85" stroke-width="9" stroke-linecap="round"/>
    <circle cx="390" cy="130" r="11" fill="#FFFFFF"/>
    <circle cx="390" cy="130" r="5" fill="#FF6A4D"/>

    <!-- viewfinder corners -->
    <g fill="none" stroke="#67E8F9" stroke-opacity="0.55" stroke-width="7" stroke-linecap="round">
      <path d="M62 112V88A18 18 0 0 1 80 70H104"/>
      <path d="M408 70H432A18 18 0 0 1 450 88V112"/>
      <path d="M450 400V424A18 18 0 0 1 432 442H408"/>
      <path d="M104 442H80A18 18 0 0 1 62 424V400"/>
    </g>

    <!-- scan beam -->
    <rect x="44" y="256" width="424" height="24" rx="12" fill="#22D3EE" opacity="0.85" filter="url(#blur8)"/>
    <rect x="52" y="263" width="408" height="10" rx="5" fill="url(#beam)"/>
  </g>
</svg>
