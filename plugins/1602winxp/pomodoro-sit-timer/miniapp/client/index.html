<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>番茄钟 · 久坐提醒</title>
    <style>
      :root,
      [data-theme='light'] {
        --mcode-bg: #ffffff;
        --mcode-bg-secondary: #f5f5f5;
        --mcode-surface: #ffffff;
        --mcode-surface-muted: #fafafa;
        --mcode-text: #171717;
        --mcode-text-muted: #666666;
        --mcode-text-subtle: #adadad;
        --mcode-border: #0a0a0a14;
        --mcode-border-strong: #0a0a0af2;
        --mcode-accent: #0094fc;
        --mcode-success: #04b54b;
        --mcode-warning: #f56811;
        --mcode-danger: #f73646;
        --mcode-primary-action-bg: #171717;
        --mcode-primary-action-text: #ffffff;
        --mcode-warning-soft: #f5681114;
      }

      [data-theme='dark'] {
        --mcode-bg: #171717;
        --mcode-bg-secondary: #1c1c1c;
        --mcode-surface: #262626;
        --mcode-surface-muted: #262626;
        --mcode-text: #ededed;
        --mcode-text-muted: #949494;
        --mcode-text-subtle: #666666;
        --mcode-border: #ffffff14;
        --mcode-border-strong: #fffffff2;
        --mcode-accent: #0077d9;
        --mcode-success: #009c3d;
        --mcode-warning: #e25507;
        --mcode-danger: #e31937;
        --mcode-primary-action-bg: #ffffff;
        --mcode-primary-action-text: #171717;
        --mcode-warning-soft: #e2550714;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--mcode-bg);
        color: var(--mcode-text);
        font-family:
          ui-sans-serif,
          -apple-system,
          system-ui,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        max-width: 880px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ---------------------------------------------------------------- header */

      .lang-switch {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 13px;
        line-height: 20px;
      }

      .lang-switch button {
        border: 0;
        background: transparent;
        font: inherit;
        padding: 2px 4px;
        border-radius: 6px;
        cursor: pointer;
        color: var(--mcode-text-muted);
        transition: color 150ms ease-out, background-color 150ms ease-out;
      }

      .lang-switch button:hover {
        background: var(--mcode-surface-muted);
      }

      /* Primary text token, so the selected language reads as near-white in the
         dark theme and stays legible in the light one. */
      .lang-switch button[aria-pressed='true'] {
        color: var(--mcode-text);
        font-weight: 600;
      }

      .lang-switch button:focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 1px;
      }

      .lang-switch .sep {
        color: var(--mcode-text-subtle);
        user-select: none;
      }

      /* Title and language switch share one row; description and the session
         counter share the next. Saves a whole row over stacking the switch above. */
      .page-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          'title lang'
          'sub   stat';
        column-gap: 16px;
        row-gap: 4px;
        align-items: start;
      }

      .page-head h1 {
        grid-area: title;
        margin: 0;
        font-size: 18px;
        line-height: 28px;
        font-weight: 600;
      }

      .page-head .sub {
        grid-area: sub;
        margin: 0;
        font-size: 13px;
        color: var(--mcode-text-muted);
        max-width: 52ch;
      }

      .page-head .lang-switch {
        grid-area: lang;
        justify-self: end;
        align-self: center;
      }

      .head-stat {
        grid-area: stat;
        text-align: right;
        line-height: 1.2;
      }

      .head-stat .num {
        display: block;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 28px;
        font-weight: 600;
      }

      .head-stat .label {
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      /* ----------------------------------------------------------------- alert */

      .alert {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px 20px;
        border: 1px solid var(--mcode-warning);
        background: var(--mcode-warning-soft);
        border-radius: 12px;
      }

      .alert[hidden] {
        display: none;
      }

      .alert svg {
        flex: none;
        width: 20px;
        height: 20px;
        color: var(--mcode-warning);
        margin-top: 2px;
      }

      .alert strong {
        display: block;
        font-size: 15px;
        font-weight: 600;
      }

      .alert p {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--mcode-text-muted);
      }

      /* ----------------------------------------------------------------- timer */

      .timer-card {
        background: var(--mcode-surface);
        border: 1px solid var(--mcode-border);
        border-radius: 12px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .timer {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 72px;
        line-height: 1.1;
        font-weight: 600;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .timer.is-reminded {
        color: var(--mcode-warning);
      }

      .timer.is-paused {
        color: var(--mcode-text-muted);
      }

      .timer.is-idle {
        color: var(--mcode-text-muted);
      }

      .timer-sub {
        font-size: 13px;
        color: var(--mcode-text-muted);
        min-height: 21px;
        text-align: center;
      }

      .progress {
        width: 100%;
        max-width: 420px;
        height: 6px;
        margin: 16px 0 20px;
        background: var(--mcode-surface-muted);
        border: 1px solid var(--mcode-border);
        border-radius: 999px;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: var(--mcode-accent);
        border-radius: 999px;
        transition: width 150ms ease-out, background-color 150ms ease-out;
      }

      .progress-fill.is-reminded {
        background: var(--mcode-warning);
      }

      /* --------------------------------------------------------------- buttons */

      .btn {
        height: 40px;
        padding: 0 20px;
        border-radius: 8px;
        border: 1px solid transparent;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition:
          background-color 150ms ease-out,
          border-color 150ms ease-out,
          opacity 150ms ease-out;
      }

      .btn:focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 2px;
      }

      .btn[disabled] {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .btn-primary {
        background: var(--mcode-primary-action-bg);
        color: var(--mcode-primary-action-text);
        min-width: 148px;
      }

      .btn-secondary {
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
        border-color: var(--mcode-border);
      }

      .btn-secondary:hover {
        border-color: var(--mcode-border-strong);
      }

      .btn-danger {
        background: transparent;
        color: var(--mcode-danger);
        border-color: var(--mcode-border);
      }

      .btn-danger:hover {
        border-color: var(--mcode-danger);
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      /* ----------------------------------------------------------------- cards */

      .timer-hint {
        margin: 12px 0 0;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .timer-hint[hidden] {
        display: none;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(272px, 1fr));
        gap: 16px;
      }

      .card {
        background: var(--mcode-surface);
        border: 1px solid var(--mcode-border);
        border-radius: 12px;
        padding: 20px;
        /* A grid item's automatic minimum size is its min-content width, and a
           card holding a long file name has a very wide min-content. That let the
           track grow past the panel, which pushed the track-name row out with it:
           the row stopped being the width the cap and the ellipsis were computed
           against, so the head was elided but the tail was still clipped by the
           panel edge. Releasing the floor lets the track be the panel width, and
           the row's own overflow and text-overflow then do their job. */
        min-width: 0;
      }

      .card h2 {
        margin: 0 0 4px;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
      }

      .card .hint {
        margin: 0 0 16px;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .field {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex-wrap: wrap;
      }

      .field-stack {
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1 1 220px;
        min-width: 0;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .sound-source {
        font-size: 13px;
        color: var(--mcode-text);
        margin: 0 0 12px;
        overflow-wrap: anywhere;
      }

      .sound-source .tag {
        display: inline-block;
        font-size: 12px;
        color: var(--mcode-text-muted);
        background: var(--mcode-surface-muted);
        border: 1px solid var(--mcode-border);
        border-radius: 999px;
        padding: 1px 10px;
        margin-left: 6px;
      }

      /* Path input and mode toggle share one row. The label gives up width so
         the toggle is never pushed off.

         The row has to grow into the form's width. It is a flex item of .field,
         and without flex-grow it is only as wide as its own content -- which used
         to include the current track name. Once the track moved out onto its own
         line, the row shrank to its minimum and the path box lost 30px for
         reasons that have nothing to do with the path. */
      .sound-path-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        flex: 1 1 auto;
        min-width: 0;
      }

      .sound-path-row .field-stack {
        flex: 1 1 auto;
        min-width: 0;
      }

      /* One fixed 36px slot holding the mode toggle and the confirm button.
         They are stacked rather than sitting side by side, so swapping which one
         is visible cannot change the slot width -- and that is what stops the
         path input from resizing when an edit is pending. */
      .sound-slot {
        position: relative;
        flex: 0 0 auto;
        width: 36px;
        min-width: 36px;
        height: 40px;
      }

      .sound-slot > button {
        position: absolute;
        inset: 0;
        width: 36px;
        min-width: 36px;
        height: 40px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .sound-slot > button[hidden] {
        display: none;
      }

      /* The confirm reads as "commit this", not as another setting, so it is
         drawn in the accent colour rather than as a second grey button. */
      .sound-confirm {
        color: var(--mcode-accent);
        border-color: var(--mcode-accent);
      }

      .sound-confirm svg {
        width: 18px;
        height: 18px;
      }

      /* Icon-only toggle: a fixed square keeps the row from reflowing when the
         glyph changes, and the active state is drawn, not labelled. */
      .sound-mode-toggle {
        flex: 0 0 auto;
        width: 36px;
        min-width: 36px;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .sound-mode-toggle svg {
        width: 18px;
        height: 18px;
        display: block;
      }

      /* No accent border or fill: the glyph alone is the state, and a blue ring
         on top of it made the two signals redundant and noisy. */
      .sound-mode-toggle .icon-shuffle {
        display: none;
      }

      .sound-mode-toggle[aria-pressed='true'] .icon-sequence {
        display: none;
      }

      .sound-mode-toggle[aria-pressed='true'] .icon-shuffle {
        display: block;
      }

      .sound-mode-toggle svg {
        opacity: 0.72;
      }

      .sound-mode-toggle[aria-pressed='true'] svg {
        opacity: 1;
      }

      /* 单曲循环 outranks the mode, so a disabled mode button is the honest
         state: it reads as overridden rather than as a control that is quietly
         ignoring you. */
      .sound-mode-toggle:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .sound-mode-toggle:disabled svg {
        opacity: 0.5;
      }

      .sound-actions {
        justify-content: flex-start;
        align-items: center;
        margin-top: 12px;
      }

      /* 试听 and the two switches share one row: the switches sit right beside
         the button at the row's natural width, and travel together so a narrow
         panel wraps them as a unit instead of orphaning one. */
      .sound-actions > .btn {
        flex: 0 0 auto;
      }

      /* What is playing, and what the next 试听 will fetch. They used to share
         rows with other things: the current track sat beside the path input,
         the next-track hint sat beside the 试听 button. Each of those left the
         name about half a control short, and both had to shrink. On their own
         lines, in the card's full width, they can be read. */
      .sound-status {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-top: 10px;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      /* Both lines are the same shape: a fixed label, then the file name, which
         takes the rest and is the only thing that gives way. Neither may push the
         card wider, and both sit against the right edge so the row does not read
         as left-heavy when the names are short. */
      .sound-now,
      .sound-next {
        display: flex;
        align-items: baseline;
        justify-content: flex-end;
        gap: 5px;
        min-width: 0;
        width: 100%;
        font-size: 12px;
        color: var(--mcode-text-muted);
        overflow: hidden;
      }

      /* The author `display: flex` / `.btn` rules beat the UA rule for
         [hidden], so both need it spelled out. */
      .sound-next[hidden],
      .sound-confirm[hidden] {
        display: none;
      }

      /* Shared by 当前曲目 and 下一首. A bare filename with no label says the same
         thing on both lines, so the label is what tells them apart. */
      .sound-line-label {
        flex: 0 0 auto;
        white-space: nowrap;
      }

      /* Real file names are unbounded, and the tail is the part that identifies
         one: the extension, and the last words of the name. So the name is
         truncated at the START and the head is what disappears.

         The cap is the row width minus 7em. 7em is the widest label any pack
         ships — `Current track` is about 6.5em at 12px — plus the 5px gap, so
         label + name always fits and the name's right edge (the part that has to
         stay visible) is never the thing that gets clipped. `em` is the row's own
         font size, so the cap follows the panel instead of being a pixel constant
         that is only right at 463px.

         `direction: rtl` moves the overflow to the left edge: with the default
         LTR, text-overflow clips the tail and the name reads `deep-resonance…`
         with no extension at all. It only sets the paragraph direction for this
         one span; the Latin run itself still renders left-to-right, and the title
         attribute keeps the full path. */
      .sound-line-name {
        flex: 0 1 auto;
        min-width: 0;
        max-width: calc(100% - 7em);
        color: var(--mcode-text);
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        direction: rtl;
        text-align: right;
      }

      /* 试听 and the two switches share one row: the toggles are an inline-flex
         unit, so on a panel too narrow for all of it they wrap together instead
         of orphaning one checkbox, and the button stays on the left. */


      /* Both checkboxes travel together so a narrow row wraps them as a unit
         instead of orphaning one. They sit right next to 试听 at whatever width
         the row gives them — not parked against the far edge, which pulled them
         away from the button they belong with. */
      .sound-toggles {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        flex: 0 0 auto;
      }

      .pin {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        font-size: 12px;
        color: var(--mcode-text-muted);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
      }

      .pin input {
        margin: 0;
        cursor: pointer;
        accent-color: var(--mcode-accent);
      }

      .seg {
        display: inline-flex;
        background: var(--mcode-surface-muted);
        border: 1px solid var(--mcode-border);
        border-radius: 8px;
        padding: 3px;
        gap: 2px;
      }

      .seg button {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--mcode-text-muted);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 150ms ease-out, color 150ms ease-out;
      }

      .seg button[aria-pressed='true'] {
        background: var(--mcode-surface);
        color: var(--mcode-text);
        box-shadow: 0 0 0 1px var(--mcode-border);
      }

      .seg button:focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 1px;
      }

      kbd {
        display: inline-block;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        line-height: 16px;
        padding: 0 6px;
        border: 1px solid var(--mcode-border-strong);
        border-bottom-width: 2px;
        border-radius: 4px;
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
      }

      .field label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      input[type='number'],
      input[type='text'] {
        height: 36px;
        padding: 0 10px;
        border-radius: 8px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
        font-size: 14px;
      }

      input[type='number'] {
        width: 92px;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      input[type='text'] {
        width: 100%;
        height: 36px;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }

      input[type='number']:focus-visible,
      input[type='text']:focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 1px;
        border-color: var(--mcode-accent);
      }

      .presets {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .preset {
        height: 30px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
        color: var(--mcode-text-muted);
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
      }

      .preset[aria-pressed='true'] {
        color: var(--mcode-text);
        border-color: var(--mcode-border-strong);
      }

      .preset:focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 2px;
      }

      .stat-row {
        display: flex;
        gap: 24px;
        margin-bottom: 16px;
      }

      .stat-row .value {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 24px;
        font-weight: 600;
        line-height: 1.2;
      }

      .stat-row .caption {
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .confirm-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--mcode-danger);
        border-radius: 8px;
      }

      .confirm-row[hidden] {
        display: none;
      }

      .confirm-text {
        font-size: 13px;
        color: var(--mcode-text);
        flex: 1 1 100%;
      }

      .field-error {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--mcode-danger);
      }

      .field-error[hidden] {
        display: none;
      }

      .conn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .conn .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--mcode-success);
      }

      .conn.is-offline .dot {
        background: var(--mcode-danger);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 768px) {
        .page {
          padding: 16px;
        }

        .grid {
          grid-template-columns: 1fr;
        }

        .timer {
          font-size: 56px;
        }

        .head-stat {
          text-align: left;
        }

        /* Narrow: the description needs the full width, so the counter drops
           to its own row instead of being squeezed beside it. */
        .page-head {
          grid-template-areas:
            'title lang'
            'sub   sub'
            'stat  stat';
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="page-head">
        <h1 data-i18n="head.title">番茄钟 · 久坐提醒</h1>
        <div class="lang-switch" role="group" data-i18n-aria="lang.group">
          <button type="button" data-lang="zh" aria-pressed="true">中</button>
          <span class="sep" aria-hidden="true">/</span>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
          <span class="sep" aria-hidden="true">/</span>
          <button type="button" data-lang="ja" aria-pressed="false">日</button>
          <span class="sep" aria-hidden="true">/</span>
          <button type="button" data-lang="ko" aria-pressed="false">한</button>
        </div>
        <p class="sub" data-i18n="head.sub"></p>
        <div class="head-stat">
          <span class="num" id="sessionCount">0</span>

         * silently dropped, which reads as "the folder setting does nothing".

         * so the gain is applied in BOTH directions: a mastered-hot track is pulled
         * down as well as a quiet one being lifted. An earlier version only ever
         * amplified and clamped at 8x, which quietly broke the guarantee — a hot
         * track stayed where it was, and a near-silent one hit the clamp and
         * landed well short of the target, so the biggest jump was exactly the
         * case the feature exists to prevent.

         * so every later track is matched to the one the user already accepted.

         * recording would drag everything down to a whisper.

          // track cannot reach is a track that stays quiet, and the next louder
          // track then arrives as a jump. 40x covers real recordings down to

            [1318.51, 0.32],

         * Fetch and decode the configured audio file once, then reuse the buffer.

          // press would hit the previous preview's cache.

            // straight away made the SECOND press of 试听 at an offset already
            // fetched play the right file while the label stayed on the armed
            // track and the next-track hint never moved, which read as "the
            // button did nothing".

              nextTrackName = auditionNextName;

            '/api/sound?v=' +

              // the hint to the armed track's successor — which is why locking

            el.durationError.hidden = false;
            el.durationError.textContent = t('err.minutes');
            return;
          }
          busy = true;
          clearError();
          post('/api/settings/duration', { durationSec: Math.round(minutes) * 60 }).catch(
            function () {
              /* surfaced by showError */
            },
          );
        });

        for (var p = 0; p < presets.length; p += 1) {
          presets[p].addEventListener('click', function (event) {
            if (busy) return;
            var min = Number(event.currentTarget.dataset.min);
            el.durationInput.value = String(min);
            busy = true;
            clearError();
            post('/api/settings/duration', { durationSec: min * 60 }).catch(function () {
              /* surfaced by showError */
            });
          });
        }

        el.testSound.addEventListener('click', function () {
          getAudioContext();
          showSoundError('');
          if (snapshot.soundPath) {
            // 试听 is an audition, so it walks the folder. Replaying the armed
            // track on every press is what made shuffle look broken: the armed
            // track only moves when a real reminder fires, which is 25 minutes
            // away. The offset is request-scoped and never advances the cursor
            // the next reminder will use.
            var audition = snapshot.soundMode === 'single' ? 0 : ++previewIndex;
            void loadCustomSound(
              snapshot.soundPath,
              snapshot.soundVersion,
              audition ? 'preview' : snapshot.soundTrack,
              audition,
            ).then(function (ok) {
              if (ok) playReminderSound();
              else playChime();
            });
            return;
          }
          playChime();
        });

        el.soundForm.addEventListener('submit', function (event) {
          event.preventDefault();
          if (busy) return;
          // A new folder or mode re-arms the playlist, so auditioning starts over.
          previewIndex = 0;
          // Hide the confirm button now rather than after the round trip.
          // updatePathDraft() runs on the next render, so a rejected save puts it
          // straight back and leaves the typed text alone.
          if (el.soundConfirmBtn) el.soundConfirmBtn.hidden = true;
          void applySoundSetting(el.soundPathInput.value.trim());
        });

        // Any keystroke makes the box an unsaved draft, and that is what raises
        // the confirm button. Nothing else needs to watch the field.
        el.soundPathInput.addEventListener('input', updatePathDraft);

        // 恢复默认音 was removed as a button: clearing the field and pressing Enter
        // posts an empty path, and the server treats "" and null the same way --
        // both clear the configured sound and fall back to the built-in chime. The
        // field hint says so, because the button was the discoverable part.

        // Named ti, not t: t() is the translation lookup and must not be shadowed.
        for (var ti = 0; ti < themeButtons.length; ti += 1) {
          themeButtons[ti].addEventListener('click', function (event) {
            var choice = event.currentTarget.dataset.themeChoice;
            applyTheme(choice);
            try {
              localStorage.setItem(THEME_KEY, choice);
            } catch (error) {
              /* still applied for this page view */
            }
          });
        }

        el.discard.addEventListener('click', function () {
          if (busy) return;
          busy = true;
          clearError();
          post('/api/segment/discard').catch(function () {
            /* surfaced by showError */
          });
        });

        // An inline two-step confirmation. window.confirm() blocks the whole page
        // and drops an OS-styled dialog on top of the timer, which is jarring here.
        function openResetConfirm() {
          el.resetConfirmText.textContent =
            t('confirm.clear.full');
          el.resetConfirm.hidden = false;
          el.resetStats.hidden = true;
          el.resetCancel.focus();
        }

        function closeResetConfirm(restoreFocus) {
          el.resetConfirm.hidden = true;
          el.resetStats.hidden = false;
          if (restoreFocus) el.resetStats.focus();
        }

        el.resetStats.addEventListener('click', openResetConfirm);

        el.resetCancel.addEventListener('click', function () {
          closeResetConfirm(true);
        });

        el.resetConfirmBtn.addEventListener('click', function () {
          if (busy) return;
          closeResetConfirm(false);
          busy = true;
          post('/api/stats/reset').catch(function () {
            /* surfaced by showError */
          });
        });

        for (var l = 0; l < langButtons.length; l += 1) {
          langButtons[l].addEventListener('click', function (event) {
            applyLang(event.currentTarget.dataset.lang);
          });
        }

        // Toggling the mode re-applies immediately when a folder is already
        // configured, so the choice is not something the user has to also
        // remember to press 应用 for.
        el.soundModeToggle.addEventListener('click', function () {
          soundModeChoice = soundModeChoice === 'sequence' ? 'shuffle' : 'sequence';
          render();
          if (snapshot.soundPath && snapshot.soundMode !== 'single') {
            if (busy) return;
            // Mark it in flight so a frame carrying the old mode cannot undo
            // the label before the server has actually switched.
            soundModePending = soundModeChoice;
            // Re-send the RAW input, never soundPath. soundPath is already
            // resolved into the runtime's temp directory, so re-posting it would
            // overwrite the relative form and kill the setting on the next
            // restart — the exact failure this is meant to survive.
            previewIndex = 0;
            applySoundSetting(snapshot.soundInput || snapshot.soundPath);
          }
        });

        el.soundLoop.addEventListener('change', function (event) {
          if (busy) return;
          busy = true;
          pinPending = event.currentTarget.checked;
          showSoundError('');
          // Pin whatever the LABEL is showing, read straight out of the DOM.
          // The checkbox used to lock the armed track while the label showed the
          // track being auditioned, so the app looked like it swapped songs under
          // the click. Reading the rendered text means there is no second copy of
          // that state to fall out of sync.
          //
          // `path` is deliberately omitted so this is not read as "clear the
          // sound". The server matches the name only as a basename inside the
          // scanned folder, and falls back to the armed track if it is unknown.
          var payload = { pin: pinPending };
          if (pinPending && snapshot.soundPath && el.soundNowTrack) {
            var shown = el.soundNowTrack.textContent.trim();
            if (shown) payload.track = shown;
          }
          // Ticking the box is itself a change to how the next track is picked, so
          // the audition that produced the 下一首 row is no longer describing
          // anything real. Drop it whole, exactly as a new path or a mode switch
          // does: keeping the label but discarding the hint left the row claiming
          // the next press would play a file the lock stops it from playing, and
          // on the way back out the two rows no longer agreed with the press
          // either. Done before the request, because a refused pin needs the same
          // reset.
          clearAudition();
          post('/api/settings/sound', payload)
            .then(function () {
              pinPending = null;
            })
            .catch(function () {
              // Server refused: drop the optimistic tick and snap back.
              pinPending = null;
              render();
            });
        });

        el.soundNormalize.addEventListener('change', function (event) {
          var turningOn = event.currentTarget.checked;
          soundNormalize = turningOn;
          try {
            localStorage.setItem(NORMALIZE_KEY, soundNormalize ? '1' : '0');
          } catch (error) {
            /* preference simply will not survive a reload */
          }
          // Turning it on re-measures the reference from whatever plays next, so
          // the playlist is matched to the track the user is hearing now rather
          // than to a level picked long ago.
          if (turningOn) {
            normalizeReference = null;
            try {
              localStorage.removeItem(NORMALIZE_REF_KEY);
            } catch (error) {
              /* preference simply will not survive a reload */
            }
          }
          // Re-decode so the change is audible immediately instead of only after
          // the next track change.
          customSoundKey = null;
          customSoundBuffer = null;
          if (snapshot.soundPath) {
            void loadCustomSound(
              snapshot.soundPath,
              snapshot.soundVersion,
              snapshot.soundTrack,
            );
          }
        });

        // One global handler so Escape and Space cannot both act on the same keypress.
        //   1. An open confirm row always wins.
        //   2. Space resumes work only while reminded — never while running, so a
        //      stray tap mid-session cannot pause or resume anything.
        //   3. Space on a focused control is left to the browser, otherwise the
        //      default button activation and this handler would both fire.
        //   4. While running, Space on the primary button is swallowed. Without this
        //      the native activation hits 暂停, which is exactly the misfire the
        //      shortcut is meant to prevent. Focus is left alone on purpose — moving
        //      it would break keyboard navigation.
        document.addEventListener('keydown', function (event) {
          if (event.key === 'Escape' && !el.resetConfirm.hidden) {
            event.preventDefault();
            closeResetConfirm(true);
            return;
          }
          if (event.key !== ' ' && event.code !== 'Space') return;
          if (!el.resetConfirm.hidden) return;

          var target = event.target;
          var closable =
            target && target !== document.body && typeof target.closest === 'function'
              ? target.closest('button, input, select, textarea, a[href]')
              : null;
          var onPrimary = closable ? closable === el.primary : false;

          if (snapshot.phase === 'reminded') {
            if (closable) return;
            event.preventDefault();
            if (busy) return;
            busy = true;
            post('/api/segment/start').catch(function () {
              /* surfaced by showError */
            });
            return;
          }

          if (snapshot.phase === 'running' || snapshot.phase === 'paused') {
            if (onPrimary) event.preventDefault();
          }
        });

        // ------------------------------------------------------------------ runtime

        function openStream() {
          var source = new EventSource('/api/events');
          source.addEventListener('state', function (event) {
            try {
              applySnapshot(JSON.parse(event.data));
              setConn(true);
            } catch (error) {
              /* ignore malformed frame; the poll below repairs it */
            }
          });
          source.addEventListener('error', function () {
            setConn(false);
          });
          return source;
        }

        var stream = openStream();
        setInterval(refresh, POLL_MS);
        setInterval(render, 250);
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') refresh();
        });
        window.addEventListener('beforeunload', function () {
          if (stream) stream.close();
        });

        refresh();
        // Language last: applyLang() calls render(), and render() now reads
        // translations for every dynamic string.
        applyLang(readLang());
      })();
    </script>
  </body>
</html>
