<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>OpenPhotoShop</title>
    <link rel="stylesheet" href="/components.css" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <header>
      <strong>OpenPhotoShop <small>Mini App</small></strong>
      <nav id="menus" aria-label="主菜单"></nav>
      <span class="spacer"></span><button id="ask-agent">交给 Agent</button
      ><button id="save">保存工程</button><button id="export" class="primary">导出图片</button>
    </header>
    <section id="options" aria-label="工具选项">
      <strong id="tool-name">移动</strong
      ><label>颜色 <input id="color" type="color" value="#227fa8" /></label
      ><label>大小 <input id="size" type="number" min="1" max="500" value="32" /></label
      ><label id="tolerance-option" hidden
        >容差 <input id="tolerance" type="number" min="0" max="255" value="32" /></label
      ><label>不透明度 <input id="flow" type="range" min="1" max="100" value="100" /></label
      ><label><input id="fill-shape" type="checkbox" checked />填充形状</label
      ><button id="undo" title="撤销 Ctrl/⌘ Z">撤销</button><button id="redo">重做</button
      ><span id="hint">拖动移动当前图层</span>
    </section>
    <div id="workspace">
      <aside id="tools" aria-label="绘图工具"></aside>
      <main>
        <div id="tabs" role="tablist" aria-label="打开的文档"></div>
        <div id="stage" tabindex="0" aria-label="图像画布">
          <div id="canvas-wrap">
            <canvas id="image" aria-label="图像预览"></canvas
            ><canvas id="overlay" aria-label="绘图交互画布"></canvas>
          </div>
          <div id="welcome">
            <h1>开始修图</h1>
            <p>打开图片，使用图层和调色工具完成编辑。</p>
            <button id="open-start" class="primary">打开图片</button
            ><button id="demo">试用示例</button><button id="new-start">新建画布</button>
            <p class="muted">也可以把图片拖到这里</p>
          </div>
        </div>
      </main>
      <aside id="right">
        <section>
          <div class="panel-title">
            <h2>图层</h2>
            <button id="add-layer" title="新建透明图层">＋</button>
          </div>
          <div class="layer-controls">
            <select id="blend" aria-label="混合模式"></select
            ><label
              >不透明度<input id="layer-opacity" type="range" min="0" max="100" value="100"
            /></label>
          </div>
          <div id="layers" aria-label="图层列表"></div>
          <div class="row">
            <button id="duplicate-layer">复制</button><button id="layer-up">上移</button
            ><button id="layer-down">下移</button><button id="delete-layer">删除</button>
          </div>
        </section>
        <section>
          <h2>快速调整</h2>
          <div id="quick"></div>
        </section>
        <section>
          <h2>历史记录</h2>
          <ol id="history"></ol>
        </section>
        <section class="tips">
          <h2>操作提示</h2>
          <p id="tool-help">先打开图片，或试用示例。编辑后保存工程，保留全部图层。</p>
          <button id="agent-results">Agent 图片</button><button id="projects">本地工程</button
          ><button id="manual">使用说明</button>
        </section>
      </aside>
    </div>
    <footer>
      <span id="status" role="status">就绪 · 所有修图在本机完成</span><span class="spacer"></span
      ><span id="dimensions"></span><button id="zoom-out" aria-label="缩小">−</button
      ><output id="zoom-value">100%</output><button id="zoom-in" aria-label="放大">＋</button
      ><button id="fit">适合窗口</button><button id="actual">100%</button>
    </footer>
    <dialog id="dialog">
      <form method="dialog">
        <div class="dialog-head">
          <h2 id="dialog-title"></h2>
          <button value="cancel" aria-label="关闭对话框">×</button>
        </div>
        <div id="dialog-body"></div>
        <div class="dialog-actions">
          <button value="cancel">取消</button
          ><button id="dialog-ok" type="button" class="primary">确定</button>
        </div>
      </form>
    </dialog>
    <input id="file-input" type="file" accept="image/*,.json,.psd,.tif,.tiff" multiple hidden />
  </body>
</html>
