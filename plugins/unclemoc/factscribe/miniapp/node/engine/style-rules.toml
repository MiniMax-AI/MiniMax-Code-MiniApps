# ---- 批 105 B 档词表 ----

[nominalization]
# 英文名词化后缀；不含裸 -al/-ic/-ive（命中的几乎全是技术词）。
suffixes = ["tion", "sion", "ment", "ance", "ence", "ity", "ness", "ism"]
# 词长下限：短于 5 个字母的词形不算（tion 本身不是词）。
min_length = 5
# 剥离本文频次最高的 N 个类型，当作领域术语；报时列出被剥离的词。
strip_top = 5

[zh_aspect_zhe]
# 动词后「着」的词内用法：不是进行体，不计入分子。
exclude = ["意味着", "标志着", "象征着", "预示着", "代表着",
           "照着", "沿着", "朝着", "向着", "随着", "接着", "跟着",
           "当着", "为着", "冲着", "凭着", "按着", "依着", "据着",
           "本着", "对着", "关于", "够得着", "够不着", "来着", "合着"]

[zh_dang_when]
# 只认这三种尾巴；「时」后面不能跟「候」（否则是「什么时候」）。
tails = ["的时候", "之后", "时"]
# 单次出现是正常中文；同一段落内至少这么多处才报（跨段不累计）。
min_per_paragraph = 2
# 「当」后紧跟这些字是词内用法（当成/当作/当天/当时/当面…），不算条件。
forbid_heads = ["成", "作", "然", "即", "初", "场", "时", "天", "年",
                "月", "日", "前", "中", "下", "上", "面", "真", "众",
                "地", "晚", "夜", "早", "代", "今"]

[zh_collocation_redundancy]
# 搭配冗余：每条给匹配式与删法；单位＝处。
[[zh_collocation_redundancy.items]]
label = "大约…左右"
pattern = "大约[^。！？；]{0,20}左右"
fix = "删「大约」或「左右」，只留一个"

[[zh_collocation_redundancy.items]]
label = "唯一一个"
pattern = "唯一一个"
fix = "删「一个」，写「唯一」"

[[zh_collocation_redundancy.items]]
label = "相互之间"
pattern = "相互之间"
fix = "删「相互」，写「之间」"

[[zh_collocation_redundancy.items]]
label = "彼此互相"
pattern = "彼此互相"
fix = "删「彼此」或「互相」，只留一个"

[[zh_collocation_redundancy.items]]
label = "提前预…"
pattern = "提前预[先进订定约热租告测]"
fix = "删「提前」，写「预订/预支/预约」"

[[zh_collocation_redundancy.items]]
label = "免费赠送"
pattern = "免费赠送"
fix = "删「免费」，赠送本身就不收钱"

[[zh_collocation_redundancy.items]]
label = "亲眼目睹"
pattern = "亲眼目睹"
fix = "删「亲眼」，目睹本身就是亲眼看见"

[[zh_collocation_redundancy.items]]
label = "再次重申"
pattern = "再次重申"
fix = "删「再次」，重申就是再说一次"

[[zh_collocation_redundancy.items]]
label = "一致公认"
pattern = "一致公认"
fix = "删「一致」，公认就是一致认为"

[[zh_collocation_redundancy.items]]
label = "首先第一"
pattern = "首先第一"
fix = "删「首先」或「第一」，只留一个"

[abbrev_rules]
# ≥2 个大写字母才算缩写。
min_letters = 2
# 罗马数字、文献标记不是缩写。
exclude = ["II", "III", "IV", "VI", "VII", "VIII", "IX", "XI", "XII",
           "XIII", "XIV", "XV", "TODO", "TBD", "FIXME"]

[we_action]
# WE_ACTION_DENSITY 的动作动词表。只收「做了一件事」的动词；
# 提出/主张/认为/说明这类修辞或认知动词不收（「我们提出」不算动作句）。
english = ["ran", "run", "runs", "running",
           "did", "do", "does", "doing",
           "tried", "try", "tries", "trying",
           "changed", "change", "changes", "changing",
           "added", "add", "adds", "adding",
           "removed", "remove", "removes", "removing",
           "tested", "test", "tests", "testing",
           "looked", "look", "looks", "looking"]
chinese = ["跑", "做", "试", "改", "加", "删", "测", "查", "记",
           "尝试", "修改", "增加", "添加", "删除", "运行",
           "测试", "测量", "检查", "记录", "核对", "查验"]
