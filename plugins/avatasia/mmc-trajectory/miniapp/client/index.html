<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>会话轨迹</title>
    <style>
      /* ============================================================
         Theme tokens — page-owned, light + dark, mapped by
         data-theme (set from prefers-color-scheme by the script).
         ============================================================ */
      :root,
      :root[data-theme='light'] {
        --mcode-bg: #ffffff;
        --mcode-bg-secondary: #f5f5f5;
        --mcode-surface: #ffffff;
        --mcode-surface-muted: #fafafa;
        --mcode-text: #171717;
        --mcode-text-muted: #666666;
        --mcode-text-subtle: #adadad;
        --mcode-border: #0a0a0a14;
        --mcode-border-strong: #0a0a0af2;
        --mcode-accent: #0094fc;
        --mcode-success: #04b54b;
        --mcode-warning: #f56811;
        --mcode-danger: #f73646;
        --mcode-primary-action-bg: #171717;
        --mcode-primary-action-text: #ffffff;
      }

      :root[data-theme='dark'] {
        --mcode-bg: #171717;
        --mcode-bg-secondary: #1c1c1c;
        --mcode-surface: #262626;
        --mcode-surface-muted: #262626;
        --mcode-text: #ededed;
        --mcode-text-muted: #949494;
        --mcode-text-subtle: #666666;
        --mcode-border: #ffffff14;
        --mcode-border-strong: #fffffff2;
        --mcode-accent: #0077d9;
        --mcode-success: #009c3d;
        --mcode-warning: #e25507;
        --mcode-danger: #e31937;
        --mcode-primary-action-bg: #ffffff;
        --mcode-primary-action-text: #171717;
      }

      /* Fallback when the script has not set data-theme yet. */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --mcode-bg: #171717;
          --mcode-bg-secondary: #1c1c1c;
          --mcode-surface: #262626;
          --mcode-surface-muted: #262626;
          --mcode-text: #ededed;
          --mcode-text-muted: #949494;
          --mcode-text-subtle: #666666;
          --mcode-border: #ffffff14;
          --mcode-border-strong: #fffffff2;
          --mcode-accent: #0077d9;
          --mcode-success: #009c3d;
          --mcode-warning: #e25507;
          --mcode-danger: #e31937;
          --mcode-primary-action-bg: #ffffff;
          --mcode-primary-action-text: #171717;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: var(--mcode-bg);
        color: var(--mcode-text);
        font-family: ui-sans-serif, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .icon {
        display: block;
        flex: none;
      }

      .page {
        max-width: 1440px;
        margin: 0 auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      /* ---------------- header ---------------- */

      .page-header {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .page-header h1 {
        margin: 0;
        font-size: 18px;
        line-height: 28px;
        font-weight: 600;
      }

      .page-subtitle {
        margin: 4px 0 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--mcode-text-muted);
      }

      .header-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      /* ---------------- buttons & controls ---------------- */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 34px;
        padding: 0 12px;
        border: 1px solid var(--mcode-border);
        border-radius: 8px;
        background: var(--mcode-surface);
        color: var(--mcode-text);
        font: inherit;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
        transition: background-color 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
      }

      .btn:hover:not(:disabled) {
        background: var(--mcode-surface-muted);
        border-color: var(--mcode-border-strong);
      }

      .btn:active:not(:disabled) {
        opacity: 0.75;
      }

      .btn:disabled {
        cursor: not-allowed;
        color: var(--mcode-text-subtle);
        background: var(--mcode-surface-muted);
      }

      .btn-primary {
        background: var(--mcode-primary-action-bg);
        color: var(--mcode-primary-action-text);
        border-color: transparent;
      }

      .btn-primary:hover:not(:disabled) {
        background: var(--mcode-primary-action-bg);
        border-color: transparent;
        opacity: 0.86;
      }

      .btn-text {
        background: transparent;
        border-color: transparent;
        color: var(--mcode-accent);
        padding: 0 8px;
      }

      .btn-text:hover:not(:disabled) {
        background: var(--mcode-surface-muted);
        border-color: transparent;
      }

      .btn[aria-pressed='true'] {
        background: var(--mcode-surface-muted);
        border-color: var(--mcode-accent);
        color: var(--mcode-accent);
      }

      .btn .btn-state {
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .btn[aria-pressed='true'] .btn-state {
        color: var(--mcode-accent);
      }

      input[type='search'],
      input[type='text'],
      select {
        min-height: 36px;
        max-width: 100%;
        padding: 0 8px;
        border: 1px solid var(--mcode-border);
        border-radius: 8px;
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
        font: inherit;
        font-size: 14px;
      }

      select {
        max-width: 320px;
        text-overflow: ellipsis;
      }

      input::placeholder {
        color: var(--mcode-text-subtle);
      }

      input:focus,
      select:focus {
        border-color: var(--mcode-accent);
        outline: 2px solid var(--mcode-accent);
        outline-offset: 1px;
      }

      /* ---------------- bars (alert / status) ---------------- */

      .bar {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--mcode-border);
        border-left: 3px solid var(--mcode-border-strong);
        border-radius: 8px;
        background: var(--mcode-surface-muted);
        font-size: 14px;
      }

      .bar[hidden] {
        display: none;
      }

      .bar-danger {
        border-left-color: var(--mcode-danger);
        color: var(--mcode-text);
      }

      .bar-warning {
        border-left-color: var(--mcode-warning);
      }

      .bar-success {
        border-left-color: var(--mcode-success);
      }

      .bar-title {
        font-weight: 500;
      }

      .bar-hint {
        color: var(--mcode-text-muted);
        font-size: 12px;
      }

      /* ---------------- toolbar ---------------- */

      .toolbar {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--mcode-border);
        border-radius: 12px;
        background: var(--mcode-surface);
      }

      .toolbar-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
      }

      .field {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .field-label {
        font-size: 12px;
        color: var(--mcode-text-muted);
        white-space: nowrap;
      }

      .field-grow {
        flex: 1 1 220px;
      }

      .field-grow input {
        width: 100%;
      }

      .chipbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        margin: 0;
        padding: 0;
        border: 0;
        min-width: 0;
      }

      .legend {
        float: none;
        padding: 0 4px 0 0;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        min-height: 28px;
        padding: 0 10px;
        border: 1px solid var(--mcode-border);
        border-radius: 999px;
        background: var(--mcode-surface);
        color: var(--mcode-text-muted);
        font: inherit;
        font-size: 12px;
        line-height: 1;
        cursor: pointer;
        transition: background-color 150ms ease-out, border-color 150ms ease-out, color 150ms ease-out;
      }

      .chip:hover {
        background: var(--mcode-surface-muted);
        border-color: var(--mcode-border-strong);
      }

      .chip input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        margin: 0;
        pointer-events: none;
      }

      .chip-mark {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }

      .chip[aria-pressed='true'],
      .chip.is-on {
        background: var(--mcode-surface-muted);
        border-color: var(--mcode-border-strong);
        color: var(--mcode-text);
        font-weight: 500;
      }

      .chip:focus-within {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 2px;
      }

      .toolbar-status {
        margin: 0;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      /* ---------------- KPI strip ---------------- */

      .kpi-section {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .section-title {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
      }

      .kpi-grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr 1fr 1.1fr 1.1fr;
        gap: 12px;
      }

      .kpi-card {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px;
        border: 1px solid var(--mcode-border);
        border-radius: 12px;
        background: var(--mcode-surface);
        min-width: 0;
      }

      .kpi-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .kpi-value {
        font-size: 26px;
        line-height: 32px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }

      .kpi-sub {
        font-size: 12px;
        line-height: 1.5;
        color: var(--mcode-text-muted);
        overflow-wrap: anywhere;
      }

      .kpi-card.is-skeleton .kpi-value {
        color: var(--mcode-text-subtle);
      }

      /* ---------------- two columns ---------------- */

      .columns {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }

      .panel {
        border: 1px solid var(--mcode-border);
        border-radius: 12px;
        background: var(--mcode-surface);
        min-width: 0;
        overflow: hidden;
      }

      .panel-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--mcode-border);
      }

      .panel-head-meta {
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      /* ---------------- ledger ---------------- */

      .ledger-body {
        padding: 8px 0 12px;
      }

      .turn-group {
        display: block;
      }

      .turn-head {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 8px 16px;
        border: 0;
        border-bottom: 1px solid var(--mcode-border);
        background: var(--mcode-bg-secondary);
        color: var(--mcode-text);
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition: background-color 150ms ease-out;
      }

      .turn-head:hover {
        background: var(--mcode-surface-muted);
      }

      .turn-head .icon {
        transition: transform 200ms ease-out;
      }

      .turn-head[aria-expanded='false'] .icon {
        transform: rotate(-90deg);
      }

      .turn-title {
        font-size: 14px;
        font-weight: 500;
        white-space: nowrap;
      }

      .turn-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        font-size: 12px;
        color: var(--mcode-text-muted);
        min-width: 0;
      }

      .turn-meta .num {
        font-variant-numeric: tabular-nums;
      }

      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .row-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .row-list[hidden] {
        display: none;
      }

      .row {
        display: grid;
        grid-template-columns: 42px 76px minmax(0, 1fr) 68px 76px;
        align-items: center;
        gap: 8px;
        width: 100%;
        min-height: 36px;
        padding: 4px 16px;
        border: 0;
        border-left: 2px solid transparent;
        background: transparent;
        color: var(--mcode-text);
        font: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
        transition: background-color 150ms ease-out;
      }

      .row:hover {
        background: var(--mcode-surface-muted);
      }

      .row[aria-current='true'] {
        background: var(--mcode-surface-muted);
        border-left-color: var(--mcode-accent);
      }

      .row.is-error {
        border-left-color: var(--mcode-danger);
      }

      .row[aria-current='true'].is-error {
        box-shadow: inset 2px 0 0 var(--mcode-danger);
      }

      /* Response rail: rows that came back from one model response share a responseId and
         are drawn joined by a tree line, so it is visible which rows arrived together.
         It sits inside the row padding, leaving the 2px left border free for the selected
         and failed states, and it spends no colour channel of its own. */
      .row[data-rail] {
        position: relative;
      }

      .row[data-rail]::before {
        content: '';
        position: absolute;
        left: 7px;
        width: 1px;
        background: var(--mcode-border-strong);
        pointer-events: none;
      }

      .row[data-rail='start']::before {
        top: 50%;
        bottom: 0;
      }

      .row[data-rail='mid']::before {
        top: 0;
        bottom: 0;
      }

      .row[data-rail='end']::before {
        top: 0;
        bottom: 50%;
      }

      .row[data-rail='solo']::before {
        top: calc(50% - 2px);
        bottom: calc(50% - 2px);
        left: 5px;
        width: 5px;
        border-radius: 50%;
      }

      .row[aria-current='true'] .row-index {
        font-weight: 600;
      }

      .row-index {
        font-size: 12px;
        color: var(--mcode-text-muted);
        font-variant-numeric: tabular-nums;
      }

      .row-summary {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }

      .row-meta {
        font-size: 12px;
        color: var(--mcode-text-muted);
        font-variant-numeric: tabular-nums;
        text-align: right;
        white-space: nowrap;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 2px 8px;
        border: 1px solid var(--mcode-border);
        border-radius: 999px;
        background: var(--mcode-surface-muted);
        color: var(--mcode-text-muted);
        font-size: 12px;
        line-height: 18px;
        white-space: nowrap;
      }

      .pill-mark {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }

      .pill-user {
        color: var(--mcode-accent);
        border-color: currentColor;
        background: var(--mcode-surface-muted);
      }

      .pill-assistant {
        color: var(--mcode-success);
        border-color: currentColor;
      }

      .pill-thinking {
        color: var(--mcode-text-muted);
      }

      .pill-toolcall {
        color: var(--mcode-warning);
        border-color: currentColor;
      }

      .pill-toolresult {
        color: var(--mcode-text-muted);
        border-style: dashed;
      }

      .pill-system {
        color: var(--mcode-text-subtle);
        border-style: dashed;
      }

      .pill-compaction {
        color: var(--mcode-danger);
        border-color: currentColor;
      }

      .pill-error {
        color: var(--mcode-danger);
        border-color: currentColor;
        font-weight: 500;
      }

      /* ---------------- generic state blocks ---------------- */

      .state-block {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 32px 24px;
        text-align: center;
        color: var(--mcode-text-muted);
      }

      .state-block .icon {
        color: var(--mcode-text-subtle);
      }

      .state-title {
        font-size: 14px;
        font-weight: 500;
        color: var(--mcode-text);
      }

      .state-hint {
        font-size: 12px;
        max-width: 46ch;
      }

      .load-more-wrap {
        padding: 8px 16px 0;
      }

      .ledger-foot {
        padding: 8px 16px 0;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .skeleton-row {
        display: grid;
        grid-template-columns: 42px 76px minmax(0, 1fr) 68px 76px;
        gap: 8px;
        align-items: center;
        padding: 4px 16px;
        min-height: 36px;
      }

      .skeleton-bar {
        height: 10px;
        border-radius: 4px;
        background: var(--mcode-surface-muted);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* ---------------- inspector ---------------- */

      .inspector-locator {
        margin: 0;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--mcode-text-muted);
        border-bottom: 1px solid var(--mcode-border);
      }

      /* Shown only when the ledger is pinned to a generation that is no longer active, so the
         numbers on screen are never silently about a slice the reader did not choose. */
      .generation-note {
        margin: 0;
        padding: 8px 16px;
        font-size: 12px;
        color: var(--mcode-text-subtle);
        background: var(--mcode-bg-secondary);
        border-bottom: 1px solid var(--mcode-border);
      }

      .generation-note[hidden] {
        display: none;
      }

      .tablist {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        padding: 8px 16px 0;
        border-bottom: 1px solid var(--mcode-border);
      }

      .tab {
        min-height: 30px;
        padding: 0 10px;
        border: 1px solid transparent;
        border-bottom: 2px solid transparent;
        border-radius: 8px 8px 0 0;
        background: transparent;
        color: var(--mcode-text-muted);
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        transition: color 150ms ease-out, background-color 150ms ease-out;
      }

      .tab:hover:not(:disabled) {
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
      }

      .tab[aria-selected='true'] {
        color: var(--mcode-text);
        font-weight: 500;
        border-bottom-color: var(--mcode-accent);
      }

      .tab:disabled {
        color: var(--mcode-text-subtle);
        cursor: not-allowed;
      }

      .tabpanel {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .tabpanel[hidden] {
        display: none;
      }

      .kv-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      .kv-table th,
      .kv-table td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--mcode-border);
        text-align: left;
        vertical-align: top;
        font-weight: 400;
      }

      .kv-table th {
        width: 40%;
        color: var(--mcode-text-muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .kv-table td {
        overflow-wrap: anywhere;
      }

      .table-scroll {
        max-width: 100%;
        overflow-x: auto;
      }

      .block-title {
        margin: 0;
        font-size: 12px;
        font-weight: 500;
        color: var(--mcode-text-muted);
      }

      .pre {
        margin: 0;
        padding: 12px;
        max-height: 420px;
        overflow: auto;
        border: 1px solid var(--mcode-border);
        border-radius: 8px;
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        tab-size: 2;
      }

      .tok-key {
        color: var(--mcode-accent);
      }

      .tok-str {
        color: var(--mcode-success);
      }

      .tok-num {
        color: var(--mcode-warning);
      }

      .tok-bool,
      .tok-null {
        color: var(--mcode-text-muted);
      }

      .note {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }

      .note-danger {
        color: var(--mcode-danger);
      }

      .inspector-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        border-top: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
      }

      .inspector-status {
        margin: 0;
        padding: 0 16px 12px;
        font-size: 12px;
        color: var(--mcode-text-muted);
        background: var(--mcode-surface-muted);
      }

      /* ---------------- footer ---------------- */

      .page-footer {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-top: 8px;
        border-top: 1px solid var(--mcode-border);
        font-size: 12px;
        line-height: 1.6;
        color: var(--mcode-text-muted);
      }

      .page-footer p {
        margin: 0;
      }

      /* ---------------- narrow screens ---------------- */

      @media (max-width: 1080px) {
        .kpi-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .columns {
          grid-template-columns: minmax(0, 1fr);
        }
      }

      @media (max-width: 767px) {
        .page {
          padding: 16px;
          gap: 12px;
        }

        .kpi-grid {
          grid-template-columns: minmax(0, 1fr);
        }

        .kpi-card {
          padding: 12px;
        }

        .toolbar-row {
          align-items: stretch;
        }

        .field {
          flex: 1 1 100%;
        }

        select,
        .field-grow input {
          width: 100%;
          max-width: none;
        }

        /* All five columns stay so the 失败 text never disappears on narrow screens. */
        .row,
        .skeleton-row {
          grid-template-columns: 28px 64px minmax(0, 1fr) 54px 66px;
          gap: 6px;
          padding: 4px 12px;
        }

        .turn-head,
        .kv-table td {
          padding-left: 12px;
          padding-right: 12px;
        }
      }

        *::before,
        *::after {

          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;

          transition: none;
        }

        lines.push('## 定位');

        if (record.toolName) lines.push('- 工具：' + record.toolName + (record.toolCallId ? '（' + record.toolCallId + '）' : ''));

        lines.push('## 元信息');
        lines.push('');
        lines.push('- 时间：' + formatClock(record.timestamp) + '（相对起点 ' + formatOffset(record.relativeMs) + '）');

          lines.push('- 错误：' + safeText(record.error));

          lines.push('## 摘要');

          lines.push('## 原文 JSON' + (rawTruncated ? '（已截断到 ' + HANDOFF_RAW_LIMIT + ' 字符）' : ''));
