      var ICON_PATHS = {
        chevronDown: ['M4 6.2 8 10.2 12 6.2'],
        copy: ['M5.6 5.6h7.8v7.8H5.6z', 'M2.6 2.6h7.8v7.8'],
        arrowRight: ['M2.6 8h9.2', 'M8.6 4.6 12 8l-3.4 3.4', 'M13.4 2.6v10.8']
      };

      function icon(name) {
        var svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('class', 'icon');
        svg.setAttribute('width', '16');
        svg.setAttribute('height', '16');
        svg.setAttribute('viewBox', '0 0 16 16');
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '1.5');
        svg.setAttribute('stroke-linecap', 'round');
        svg.setAttribute('stroke-linejoin', 'round');
        svg.setAttribute('aria-hidden', 'true');
        var paths = ICON_PATHS[name] || [];
        for (var i = 0; i < paths.length; i += 1) {
          var node = document.createElementNS(SVG_NS, 'path');
          node.setAttribute('d', paths[i]);
          svg.appendChild(node);
        }
        return svg;
      }

      /** All data-bearing text goes through textContent. */
      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined && text !== null) node.textContent = String(text);
        return node;
      }

      function clear(node) {
        while (node.firstChild) node.removeChild(node.firstChild);
      }

      function pill(label, tone) {
        var node = el('span', 'pill' + (tone ? ' pill-' + tone : ''));
        node.appendChild(el('span', 'pill-mark'));
        node.appendChild(el('span', null, label));
        return node;
      }

      function stateBlock(iconSvg, title, hint, action) {
        var wrap = el('div', 'state-block');
        if (iconSvg) wrap.appendChild(iconSvg);
        wrap.appendChild(el('p', 'state-title', title));
        if (hint) wrap.appendChild(el('p', 'state-hint', hint));
        if (action) wrap.appendChild(action);
        return wrap;
      }

      /* ---------------- theme ---------------- */

      function applyTheme() {
        var media = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        var theme = media && media.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      }

      /* ---------------- state ---------------- */

      var POLL_INTERVAL = 2500;
      var PAGE_STEP = 200;
      var SEARCH_DEBOUNCE = 200;

      var state = {
        sessions: [],
        sessionsLoaded: false,
        sessionsError: false,
        followLatest: true,
        sessionId: null,
        payload: null,
        signature: '',
        loading: true,
        hardError: null,
        stale: false,
        selectedId: null,
        collapsed: {},
        allCollapsed: false,
        kinds: KIND_ORDER.slice(),
        query: '',
        limit: PAGE_STEP,
        activeTab: 'summary',
        hostSessionId: detectHostSessionId(),
        flat: [],
        // Validator for the displayed trajectory. Sent back as If-None-Match so an
        // unchanged session costs a 304 with no body instead of a multi-megabyte reply.
        etag: '',
        etagFor: '',
        // null = follow whatever generation the runtime considers active. A number pins the
        // ledger to one slice of a rotated history so pre-compaction turns stay reachable.
        generation: null
      };

      var dom = {};
      var inflight = null;
      var sessionsInflight = null;
      var pollTimer = null;
      var searchTimer = null;
      var refreshSeq = 0;

      function cacheDom() {
        dom.followBtn = document.getElementById('follow-btn');
        dom.followState = document.getElementById('follow-state');
        dom.refreshBtn = document.getElementById('refresh-btn');
        dom.liveStatus = document.getElementById('live-status');
        dom.errorBar = document.getElementById('error-bar');
        dom.errorTitle = document.getElementById('error-title');
        dom.errorText = document.getElementById('error-text');
        dom.staleBar = document.getElementById('stale-bar');
        dom.toolbar = document.getElementById('toolbar');
        dom.sessionSelect = document.getElementById('session-select');
        dom.generationField = document.getElementById('generation-field');
        dom.generationSelect = document.getElementById('generation-select');
        dom.generationHint = document.getElementById('generation-hint');
        dom.searchInput = document.getElementById('search-input');
        dom.collapseAll = document.getElementById('collapse-all');
        dom.chipAll = document.getElementById('chip-all');
        dom.filterStatus = document.getElementById('filter-status');
        dom.kpiGrid = document.getElementById('kpi-grid');
        dom.ledger = document.getElementById('ledger');
        dom.ledgerMeta = document.getElementById('ledger-meta');
        dom.inspectorMeta = document.getElementById('inspector-meta');
        dom.inspectorLocator = document.getElementById('inspector-locator');
        dom.tablist = document.getElementById('tablist');
        dom.panels = document.getElementById('panels');
        dom.copyBtn = document.getElementById('copy-btn');
        dom.handoffBtn = document.getElementById('handoff-btn');
        dom.inspectorStatus = document.getElementById('inspector-status');
        dom.footerTruncated = document.getElementById('footer-truncated');
        dom.footerBinding = document.getElementById('footer-binding');
      }

      function announce(text) {
        dom.liveStatus.textContent = text;
      }

      function inspectorSay(text) {
        dom.inspectorStatus.textContent = text;
      }

      /**
       * The Mini App runtime hands `start(context)` no session id and the Node service is
       * shared by plugin identity, so the server cannot tell whose conversation it is
       * rendering. The Host bridge is the one place that might know. Probe it, and only
       * accept a value that is exactly a session id, so an unrelated field can never be
       * mistaken for one.
       * @returns {string | null}
       */
      function detectHostSessionId() {
        var api = typeof window !== 'undefined' ? window.mcode : undefined;
        if (!api || typeof api !== 'object') return null;
        var candidates = [
          api.sessionId,
          api.session && api.session.id,
          api.context && api.context.sessionId,
          api.miniapp && api.miniapp.sessionId,
          api.miniapp && api.miniapp.context && api.miniapp.context.sessionId
        ];
        for (var i = 0; i < candidates.length; i += 1) {
          var value = candidates[i];
          if (typeof value === 'string' && /^mvs_[0-9a-f]{32}$/.test(value.trim())) return value.trim();
        }
        return null;
      }

      function sessionParam() {
        // A Host-bound id always wins: it is the only value that is genuinely "this conversation".
        if (state.hostSessionId) return encodeURIComponent(state.hostSessionId);
        return state.followLatest || !state.sessionId ? 'latest' : encodeURIComponent(state.sessionId);
      }

      function fetchSessions() {
        if (sessionsInflight) sessionsInflight.abort();
        var controller = new AbortController();
        sessionsInflight = controller;
        var query = '?limit=20';
        return fetch('/api/sessions' + query, { signal: controller.signal, headers: { Accept: 'application/json' } })
          .then(function (response) {
            if (!response.ok) throw new Error('http');
            return response.json();
          })
          .then(function (data) {
            sessionsInflight = null;
            state.sessions = data && Array.isArray(data.sessions) ? data.sessions : [];
            state.sessionsLoaded = true;
            state.sessionsError = false;
            renderSessionSelect();
          })
          .catch(function (error) {
            sessionsInflight = null;
            if (error && error.name === 'AbortError') return;
            state.sessionsError = true;
          });
      }

      function fetchTrajectory(manual) {
        if (inflight) inflight.abort();
        var controller = new AbortController();
        inflight = controller;
        var seq = (refreshSeq += 1);
        var session = sessionParam();
        // The generation belongs in the request key, not just the URL: the same session at
        // two generations is two different bodies, and reusing a validator across them would
        // let one silently satisfy the other with a 304.
        var genKey = state.generation === null ? 'auto' : String(state.generation);
        var url = '/api/trajectory?session=' + session
          + (state.generation === null ? '' : '&generation=' + encodeURIComponent(String(state.generation)));
        var cacheKey = session + '#' + genKey;
        var headers = { Accept: 'application/json' };
        // A manual refresh must always reach the server: drop the validator so the
        // response cannot be revalidated into a 304 the user did not ask for.
        if (manual) {
          state.etag = '';
          state.etagFor = '';
        } else if (state.etag && state.etagFor === cacheKey) {
          headers['If-None-Match'] = state.etag;
        }
        if (state.loading) renderLoading();

        return fetch(url, { signal: controller.signal, headers: headers })
          .then(function (response) {
            // Nothing changed since the copy already on screen. Keep every piece of state
            // — no re-flatten, no re-render — and let the next poll do the same cheaply.
            if (response.status === 304) {
              var fresh = response.headers.get('etag');
              if (fresh) state.etag = fresh;
              state.etagFor = cacheKey;
              return null;
            }
            return response
              .json()
              .catch(function () {
                return null;
              })
              .then(function (body) {
                if (!response.ok) {
                  var error = new Error('api');
                  error.status = response.status;
                  error.code = body && body.error ? body.error : 'unknown';
                  error.serverMessage = body && body.message ? String(body.message) : '';
                  throw error;
                }
                if (!body || typeof body !== 'object') throw new Error('api');
                var tag = response.headers.get('etag');
                state.etag = tag || '';
                state.etagFor = cacheKey;
                return body;
              });
          })
          .then(function (payload) {
            if (seq !== refreshSeq) return;
            inflight = null;
            if (payload === null) {
              // 304: the previous render is still accurate. Only clear a pending loading
              // state, because nothing on screen should have been replaced.
              if (state.loading) {
                state.loading = false;
                render();
              }
              return;
            }
            applyPayload(payload, manual);
          })
          .catch(function (error) {
            if (seq !== refreshSeq) return;
            inflight = null;
            if (error && error.name === 'AbortError') return;
            handleTrajectoryError(error);
          });
      }

      function applyPayload(payload, manual) {
        var next = signatureOf(payload);
        var changed = next !== state.signature;
        state.payload = payload;
        state.signature = next;
        state.loading = false;
        state.hardError = null;
        state.stale = false;
        state.flat = flattenTurns(payload.turns);

        if (changed) {
          state.limit = Math.min(PAGE_STEP, state.flat.length) || PAGE_STEP;
          revealSelection();
        }
        render();
        if (manual) announce('已刷新，正在显示最新数据。');
      }

      function handleTrajectoryError(error) {
        state.loading = false;
        // Never surface status codes, URLs, or local paths.
        var serverMessage = error && error.serverMessage ? String(error.serverMessage) : '';
        if (state.payload) {
          state.stale = true;
          var code = error && error.code ? error.code : '';
          var title = dom.staleBar.querySelector('.bar-title');
          if (title) {
            if (code === 'session_not_found' || code === 'not_found') title.textContent = '该会话已不可用，正在重试';
            else if (code === 'trajectory_unavailable') title.textContent = '本地会话数据目录暂时不可用，正在重试';
            else if (code === 'trajectory_unreadable') title.textContent = '会话数据暂时无法读取，正在重试';
            else title.textContent = '更新失败，正在重试';
          }
        } else {
          state.stale = false;
          state.hardError = serverMessage || '暂时无法读取会话轨迹数据。';
        }
        render();
      }

      /* ---------------- rendering: session select ---------------- */

      function sessionOptionLabel(session, now) {
        var label = truncateText(session && session.label ? session.label : '', 42);
        var when = formatAgo(session ? session.lastActiveAt : null, now);
        var tail = '（' + when + ' · ' + formatInt(session ? session.messageCount : null) + ' 条）';
        if (!label) return '未命名会话 ' + tail;
        return label + ' ' + tail;
      }

      function renderSessionSelect() {
        var select = dom.sessionSelect;
        var previous = state.followLatest ? 'latest' : state.sessionId || '';
        clear(select);

        var followOption = el('option', null, '跟随最新（自动切换）');
        followOption.value = 'latest';
        select.appendChild(followOption);

        var now = Date.now();
        for (var i = 0; i < state.sessions.length; i += 1) {
          var session = state.sessions[i];
          if (!session || !session.id) continue;
          var option = el('option', null, sessionOptionLabel(session, now));
          option.value = session.id;
          select.appendChild(option);
        }
        if (previous && previous !== 'latest') {
          select.value = previous;
          if (select.selectedIndex < 0) {
            // The pinned session aged out of the 20 most recent; keep the picker coherent.
            var pinned = el('option', null, '当前会话（不在最近列表）');
            pinned.value = previous;
            select.insertBefore(pinned, select.options[1] || null);
            select.value = previous;
          }
        } else {
          select.value = 'latest';
        }
        if (select.selectedIndex < 0) select.value = 'latest';
      }

      /* ---------------- rendering: KPI ---------------- */

      function kpiCard(label, value, sub, skeleton) {
        var card = el('div', 'kpi-card' + (skeleton ? ' is-skeleton' : ''));
        card.appendChild(el('span', 'kpi-label', label));
        card.appendChild(el('span', 'kpi-value', value));
        card.appendChild(el('span', 'kpi-sub', sub));
        return card;
      }

      // One label per part of a turn total, in the order a reader would count them.
      function turnBreakdown(stats) {
        var parts = ['对话 ' + formatInt(stats.turnsWithPrompt)];
        if (isCount(stats.qaTurns) && stats.qaTurns > 0) parts.push('问答 ' + formatInt(stats.qaTurns));
        if (isCount(stats.compactionTurns) && stats.compactionTurns > 0) parts.push('压缩 ' + formatInt(stats.compactionTurns));
        if (isCount(stats.turnsWithoutPrompt) && stats.turnsWithoutPrompt > 0) parts.push('其他 ' + formatInt(stats.turnsWithoutPrompt));
        return parts.join(' · ');
      }

      function renderKpi() {
        var grid = dom.kpiGrid;
        clear(grid);
        var stats = state.payload && state.payload.stats ? state.payload.stats : null;

        if (!stats) {
          grid.appendChild(kpiCard('消息', DASH, '正在读取…', true));
          grid.appendChild(kpiCard('工具调用', DASH, '正在读取…', true));
          grid.appendChild(kpiCard('对话轮次', DASH, '正在读取…', true));
          grid.appendChild(kpiCard('Token 总量', DASH, '正在读取…', true));
          grid.appendChild(kpiCard('总耗时', DASH, '正在读取…', true));
          return;
        }

        var tokens = stats.tokens || {};
        // A separate "responses" tile would repeat 助手: one assistant row is one model
        // response, verified identical across sessions. Compactions are the one count the
        // strip cannot derive from what it already shows, so it is called out when present.
        var compactionNote = isCount(stats.compactions) && stats.compactions > 0
          ? ' · 压缩 ' + formatInt(stats.compactions)
          : '';
        // `messages` counts what is on screen. The default view is the whole lineage, so it
        // normally already spans every generation; when the reader narrows to one slice the
        // session-wide total is shown next to it, and either way the span is stated.
        var session = state.payload && state.payload.session ? state.payload.session : null;
        var span = session && Array.isArray(session.generations) ? session.generations.length : 0;
        var rotationNote = '';
        if (isCount(stats.messagesAll) && stats.messagesAll > stats.messages) {
          rotationNote = ' · 全程 ' + formatInt(stats.messagesAll);
        }
        if (span > 1) {
          rotationNote += rotationNote ? ' · ' : ' · ';
          rotationNote += (session && session.stitched ? '跨 ' : '共 ') + formatInt(span) + ' 代';
        }
        grid.appendChild(
          kpiCard(
            '消息',
            formatInt(stats.messages),
            '用户 ' + formatInt(stats.userMessages) + ' · 助手 ' + formatInt(stats.assistantMessages) +
            ' · 思考块 ' + formatInt(stats.thinkingBlocks) + compactionNote + rotationNote
          )
        );
        grid.appendChild(
          kpiCard(
            '工具调用',
            formatInt(stats.toolCalls),
            '结果 ' + formatInt(stats.toolResults) + ' · 失败 ' + formatInt(stats.errors) +
            (isCount(stats.errors) && stats.errors > 0 ? '（见失败标记）' : '')
          )
        );
        grid.appendChild(
          kpiCard(
            '对话轮次',
            formatInt(stats.turns),
            // Spell out what the total is made of. A raw turn count is the number most likely
            // to be misread as "how many things I typed": a checkpoint is not conversation,
            // and a reply that arrived through a question card never became a typed message.
            // Only the parts that are actually present are listed.
            turnBreakdown(stats)
          )
        );
        grid.appendChild(
          kpiCard(
            'Token 总量',
            formatInt(tokens.totalTokens),
            '输入 ' + formatInt(tokens.input) + ' · 输出 ' + formatInt(tokens.output) +
            ' · 缓存读 ' + formatInt(tokens.cacheRead) + ' · 缓存写 ' + formatInt(tokens.cacheWrite)
          )
        );
        grid.appendChild(
          kpiCard(
            '总耗时',
            formatDuration(isNil(stats.durationMs) ? null : stats.durationMs),
            '会话体积 ' + formatBytes(state.payload.session ? state.payload.session.sizeBytes : null)
          )
        );
      }

      /* ---------------- rendering: ledger ---------------- */

      function visibleEntries() {
        var out = [];
        for (var i = 0; i < state.flat.length; i += 1) {
          var entry = state.flat[i];
          if (!hasKind(entry.record, state.kinds)) continue;
          if (!matchesQuery(entry.record, state.query)) continue;
          out.push(entry);
        }
        return out;
      }

      function revealSelection() {
        if (!state.selectedId) return;
        for (var i = 0; i < state.flat.length; i += 1) {
          if (state.flat[i].record.id === state.selectedId) {
            var needed = state.flat.length - i;
            if (needed > state.limit) state.limit = Math.min(needed, state.flat.length);
            return;
          }
        }
        state.selectedId = null;
      }

      function selectedRecord() {
        if (!state.selectedId) return null;
        for (var i = 0; i < state.flat.length; i += 1) {
          if (state.flat[i].record.id === state.selectedId) return state.flat[i];
        }
        return null;
      }

      /**
       * Tree-line state for each row on screen: one model response yields several rows that
       * share a `responseId`, and the rail joins them. Computed over the rows actually
       * visible, so filtering and paging cannot leave a rail pointing at a hidden row.
       * @param {Array<{record: any}>} entries
       * @returns {Array<{ state: string, index: number, size: number } | null>}
       */
      function railStates(entries) {
        var positions = new Map();
        for (var i = 0; i < entries.length; i += 1) {
          var rid = entries[i].record.responseId;
          if (!rid) continue;
          var list = positions.get(rid);
          if (!list) {
            list = [];
            positions.set(rid, list);
          }
          list.push(i);
        }
        var out = new Array(entries.length);
        for (var k = 0; k < entries.length; k += 1) out[k] = null;
        positions.forEach(function (idxs) {
          var first = idxs[0];
          var last = idxs[idxs.length - 1];
          for (var n = 0; n < idxs.length; n += 1) {
            var at = idxs[n];
            var state = 'mid';
            if (idxs.length === 1) state = 'solo';
            else if (at === first) state = 'start';
            else if (at === last) state = 'end';
            out[at] = { state: state, index: n + 1, size: idxs.length };
          }
        });
        return out;
      }

      function buildRow(entry, rail) {
        var record = entry.record;
        var row = el('button', 'row');
        row.type = 'button';
        row.setAttribute('data-row-id', record.id || String(record.index));
        if (record.id === state.selectedId) row.setAttribute('aria-current', 'true');
        else row.removeAttribute('aria-current');
        var failed = !!(record.isError || record.error);
        if (failed) row.classList.add('is-error');

        row.appendChild(el('span', 'row-index', '#' + (isCount(record.index) ? record.index : DASH)));

        // A compaction is a checkpoint, not something anyone said — label it as its own
        // thing instead of folding it into 系统, which is also where injected blocks land.
        var isCompaction = record.title === 'compaction';
        var label = pill(
          kindLabel(record),
          isCompaction ? 'compaction' : kindTone(record.kind)
        );
        row.appendChild(label);

        var summaryText = record.summary || record.text || record.toolName || record.title || '';
        var summary = el('span', 'row-summary', truncateText(safeText(summaryText), 160) || DASH);
        summary.title = truncateText(safeText(summaryText), 600);
        row.appendChild(summary);

        row.appendChild(el('span', 'row-meta', formatOffset(record.relativeMs)));

        // Fixed five-column grid: an error marker takes over the duration cell so
        // the row never wraps; the exact duration stays available in the inspector.
        var durationText = isNil(record.durationMs) ? DASH : formatDuration(record.durationMs);
        if (failed) {
          row.appendChild(pill('失败', 'error'));
          row.title = '失败 · 耗时 ' + durationText + '（详情见右侧检视）';
        } else {
          row.appendChild(el('span', 'row-meta row-col-duration', durationText));
        }

        row.addEventListener('click', function () {
          selectRecord(record.id);
        });

        // The rail is decorative; the same fact is stated in the tooltip so it is not
        // available only by looking at the page.
        if (rail) {
          row.setAttribute('data-rail', rail.state);
          var label = rail.size > 1
            ? '同一次模型返回的第 ' + rail.index + '/' + rail.size + ' 条'
            : '这一次返回只有这一条';
          row.title = row.title ? row.title + ' · ' + label : label;
        }
        return row;
      }

      function kindTone(kind) {
        if (kind === 'user') return 'user';
        if (kind === 'assistant') return 'assistant';
        if (kind === 'thinking') return 'thinking';
        if (kind === 'toolCall') return 'toolcall';
        if (kind === 'toolResult') return 'toolresult';
        return 'system';
      }

      function buildTurnHead(turn, expanded) {
        var head = el('button', 'turn-head');
        head.type = 'button';
        head.setAttribute('aria-expanded', expanded ? 'true' : 'false');
        head.appendChild(icon('chevronDown'));

        var title = '轮次 ' + (isCount(turn.index) ? turn.index : DASH);
        head.appendChild(el('span', 'turn-title', title));

        var meta = el('span', 'turn-meta');
        meta.appendChild(el('span', null, '工具调用 ' + formatInt(turn.toolCalls)));
        var tokens = turn.tokens || {};
        meta.appendChild(el('span', null, '输入 ' + formatInt(tokens.input)));
        meta.appendChild(el('span', null, '输出 ' + formatInt(tokens.output)));
        meta.appendChild(el('span', null, '缓存读 ' + formatInt(tokens.cacheRead)));
        meta.appendChild(el('span', null, '耗时 ' + (isNil(turn.durationMs) ? DASH : formatDuration(turn.durationMs))));
        if (isCount(turn.errors) && turn.errors > 0) {
          meta.appendChild(el('span', 'note note-danger', '失败 ' + formatInt(turn.errors)));
        }
        head.appendChild(meta);

        head.addEventListener('click', function () {
          state.collapsed[turn.id] = !state.collapsed[turn.id];
          if (!state.collapsed[turn.id]) delete state.collapsed[turn.id];
          state.allCollapsed = areAllCollapsed(visibleTurns());
          renderLedger();
          renderCollapseButton();
        });
        return head;
      }

      function turnKey(turn) {
        return turn && turn.id ? turn.id : 'turn-' + (isCount(turn && turn.index) ? turn.index : Math.random());
      }

      function isCollapsed(turn) {
        var key = turnKey(turn);
        return state.collapsed[key] === true;
      }

      function visibleTurns(entries) {
        var order = [];
        var map = {};
        for (var i = 0; i < entries.length; i += 1) {
          var turn = entries[i].turn;
          var key = turnKey(turn);
          if (!map[key]) {
            map[key] = { turn: turn, entries: [] };
            order.push(map[key]);
          }
          map[key].entries.push(entries[i]);
        }
        return order;
      }

      function areAllCollapsed(groups) {
        if (!groups.length) return false;
        for (var i = 0; i < groups.length; i += 1) {
          if (!isCollapsed(groups[i].turn)) return false;
        }
        return true;
      }

      function renderLedger() {
        var ledger = dom.ledger;
        var scrollY = window.scrollY || window.pageYOffset || 0;
        clear(ledger);

        if (state.loading) {
          ledger.appendChild(buildSkeleton());
          dom.ledgerMeta.textContent = '加载中';
          return;
        }

        if (state.hardError) {
          ledger.appendChild(
            stateBlock(null, '轨迹暂时不可用', '服务恢复后会自动重试，页面结构保持不变。')
          );
          dom.ledgerMeta.textContent = '不可用';
          return;
        }

        if (!state.payload) {
          ledger.appendChild(buildSkeleton());
          dom.ledgerMeta.textContent = '加载中';
          return;
        }

        if (state.sessionsLoaded && state.sessions.length === 0) {
          ledger.appendChild(
            stateBlock(
              icon('arrowRight'),
              '还没有可读取的本地会话',
              '在 MiniMax Code 里开始一次对话后回到本页，轨迹会自动出现。'
            )
          );
          dom.ledgerMeta.textContent = '共 0 条';
          updateFilterStatus(0, 0);
          return;
        }

        var matched = visibleEntries();
        var total = state.flat.length;
        updateFilterStatus(matched.length, total);
        dom.ledgerMeta.textContent = '轮次 ' + (state.payload.stats ? formatInt(state.payload.stats.turns) : DASH);

        if (matched.length === 0) {
          var reset = el('button', 'btn', '清除筛选');
          reset.type = 'button';
          reset.addEventListener('click', function () {
            clearFilters();
          });
          ledger.appendChild(
            stateBlock(null, '当前筛选条件下没有命中记录', '共 ' + total + ' 条记录中没有匹配项，可以放宽类型或搜索词。', reset)
          );
          return;
        }

        var windowed = matched.length > state.limit ? matched.slice(matched.length - state.limit) : matched;
        var hiddenAbove = matched.length - windowed.length;

        if (hiddenAbove > 0) {
          var wrap = el('div', 'load-more-wrap');
          var more = el('button', 'btn', '向上加载更早的 ' + Math.min(PAGE_STEP, hiddenAbove) + ' 条');
          more.type = 'button';
          more.addEventListener('click', function () {
            var anchorId = windowed[0] ? windowed[0].record.id : null;
            var anchorBefore = anchorId ? anchorOffset(anchorId) : null;
            state.limit += PAGE_STEP;
            renderLedger();
            if (anchorId && anchorBefore !== null) {
              var after = anchorOffset(anchorId);
              if (after !== null) window.scrollBy(0, after - anchorBefore);
            }
          });
          wrap.appendChild(more);
          ledger.appendChild(wrap);
        }

        var groups = visibleTurns(windowed);
        for (var i = 0; i < groups.length; i += 1) {
          var group = groups[i];
          var collapsed = isCollapsed(group.turn);
          var section = el('section', 'turn-group');
          section.setAttribute('aria-label', '轮次 ' + (isCount(group.turn.index) ? group.turn.index : DASH));
          section.appendChild(buildTurnHead(group.turn, !collapsed));
          var list = el('ul', 'row-list');
          if (collapsed) list.hidden = true;
          var rails = railStates(group.entries);
          for (var j = 0; j < group.entries.length; j += 1) {
            var item = el('li');
            item.appendChild(buildRow(group.entries[j], rails[j]));
            list.appendChild(item);
          }
          section.appendChild(list);
          ledger.appendChild(section);
        }

        var foot = el('p', 'ledger-foot');
        foot.textContent =
          '已显示 ' + formatInt(windowed.length) + ' / 共 ' + formatInt(total) + ' 条记录' +
          (hiddenAbove > 0 ? '（更早的 ' + formatInt(hiddenAbove) + ' 条尚未加载）' : '');
        ledger.appendChild(foot);

        window.scrollTo(0, scrollY);
      }

      function anchorOffset(id) {
        var node = dom.ledger.querySelector('[data-row-id="' + cssEscape(id) + '"]');
        return node ? node.getBoundingClientRect().top : null;
      }

      function cssEscape(value) {
        var text = String(value);
        if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(text);
        return text.replace(/["\\]/g, '\\$&');
      }

      function buildSkeleton() {
        var wrap = el('div');
        var group = el('section', 'turn-group');
        var head = el('div', 'turn-head');
        head.appendChild(el('span', 'skeleton-bar'));
        group.appendChild(head);
        for (var i = 0; i < 8; i += 1) {
          var row = el('div', 'skeleton-row');
          var widths = ['60%', '70%', '90%', '80%', '60%'];
          for (var j = 0; j < 5; j += 1) {
            var bar = el('div', 'skeleton-bar');
            bar.style.width = widths[j];
            row.appendChild(bar);
          }
          group.appendChild(row);
        }
        wrap.appendChild(group);
        var note = el('p', 'ledger-foot', '正在读取轨迹…');
        wrap.appendChild(note);
        return wrap;
      }

      function renderLoading() {
        renderKpi();
        renderLedger();
        renderInspector();
      }

      function updateFilterStatus(matched, total) {
        dom.filterStatus.textContent = '命中 ' + formatInt(matched) + ' / 共 ' + formatInt(total) + ' 条';
      }

      function renderCollapseButton() {
        var all = state.allCollapsed;
        dom.collapseAll.setAttribute('aria-pressed', all ? 'true' : 'false');
        dom.collapseAll.textContent = all ? '展开全部' : '折叠全部';
      }

      /* ---------------- selection ---------------- */

      function selectRecord(id) {
        state.selectedId = id;
        state.activeTab = 'summary';
        renderLedger();
        renderInspector();
        inspectorSay('');
      }

      function clearFilters() {
        state.kinds = KIND_ORDER.slice();
        state.query = '';
        state.limit = PAGE_STEP;
        if (dom.searchInput) dom.searchInput.value = '';
        syncChipInputs();
        render();
      }

      /* ---------------- inspector ---------------- */

      var TABS = [
        { id: 'summary', label: '摘要', available: function () { return true; } },
        { id: 'raw', label: '原文', available: function () { return true; } },
        {
          id: 'args',
          label: '参数',
          available: function (record) {
            return record.kind === 'toolCall' && record.arguments !== null && record.arguments !== undefined;
          }
        },
        {
          id: 'result',
          label: '结果',
          available: function (record) {
            return record.kind === 'toolResult' && record.result !== null && record.result !== undefined;
          }
        },
        {
          id: 'thinking',
          label: '思考',
          available: function (record) {
            if (record.kind !== 'thinking') return false;
            var value = record.thinking;
            return value !== null && value !== undefined && safeText(value).trim() !== '';
          }
        }
      ];

      function renderInspector() {
        var entry = selectedRecord();
        clear(dom.tablist);
        clear(dom.panels);

        if (!entry) {
          dom.inspectorLocator.textContent = '尚未选择记录';
          dom.inspectorMeta.textContent = '';
          dom.tablist.hidden = true;
          dom.copyBtn.disabled = true;
          dom.handoffBtn.disabled = true;
          updateHandoffButton();
          var panel = el('div', 'tabpanel');
          panel.appendChild(
            stateBlock(
              null,
              state.loading ? '正在读取轨迹' : '在左侧选择一条记录',
              state.loading ? '数据加载后即可查看详情。' : '选中后这里会显示摘要、原文、参数、结果与思考。'
            )
          );
          dom.panels.appendChild(panel);
          return;
        }

        var record = entry.record;
        var turn = entry.turn;
        var turnIndex = isCount(turn && turn.index) ? turn.index : null;
        dom.inspectorLocator.textContent =
          '轮次 ' + (turnIndex === null ? DASH : turnIndex) + ' · #' + (isCount(record.index) ? record.index : DASH) +
          ' · ' + kindLabel(record);
        dom.inspectorMeta.textContent = record.id ? '记录 ' + record.id : '';
        dom.tablist.hidden = false;

        var available = TABS.filter(function (tab) {
          return tab.available(record);
        });
        if (!available.some(function (tab) { return tab.id === state.activeTab; })) {
          state.activeTab = 'summary';
        }

        var buttons = {};
        for (var i = 0; i < TABS.length; i += 1) {
          var tab = TABS[i];
          var enabled = available.indexOf(tab) >= 0;
          var button = el('button', 'tab', tab.label);
          button.type = 'button';
          button.id = 'tab-' + tab.id;
          button.setAttribute('role', 'tab');
          button.setAttribute('aria-selected', tab.id === state.activeTab && enabled ? 'true' : 'false');
          button.setAttribute('aria-controls', 'panel-' + tab.id);
          button.tabIndex = tab.id === state.activeTab && enabled ? 0 : -1;
          button.disabled = !enabled;
          if (!enabled) button.setAttribute('title', '该记录没有这一部分内容');
          button.addEventListener('click', function (event) {
            activateTab(event.currentTarget.id.slice(4));
          });
          button.addEventListener('keydown', function (event) {
            onTabKeydown(event, buttons);
          });
          buttons[tab.id] = button;
          dom.tablist.appendChild(button);
        }

        for (var j = 0; j < available.length; j += 1) {
          var active = available[j];
          var panel = el('div', 'tabpanel');
          panel.id = 'panel-' + active.id;
          panel.setAttribute('role', 'tabpanel');
          panel.setAttribute('aria-labelledby', 'tab-' + active.id);
          panel.tabIndex = 0;
          if (active.id !== state.activeTab) panel.hidden = true;
          panel.appendChild(buildPanel(active.id, record, turn));
          dom.panels.appendChild(panel);
        }

        dom.copyBtn.disabled = false;
        updateHandoffButton();
      }

      function activateTab(id) {
        state.activeTab = id;
        renderInspector();
      }

      function onTabKeydown(event, buttons) {
        var ids = TABS.map(function (tab) {
          return tab.id;
        });
        var order = ids.filter(function (id) {
          return buttons[id] && !buttons[id].disabled;
        });
        if (!order.length) return;
        var current = event.currentTarget.id.slice(4);
        var position = order.indexOf(current);
        var next = null;
        if (event.key === 'ArrowRight') next = order[(position + 1) % order.length];
        else if (event.key === 'ArrowLeft') next = order[(position - 1 + order.length) % order.length];
        else if (event.key === 'Home') next = order[0];
        else if (event.key === 'End') next = order[order.length - 1];
        if (!next) return;
        event.preventDefault();
        buttons[next].focus();
        activateTab(next);
      }

      function kvRow(table, key, value) {
        var tr = document.createElement('tr');
        var th = el('th', null, key);
        th.setAttribute('scope', 'row');
        var td = el('td', null, value);
        tr.appendChild(th);
        tr.appendChild(td);
        table.appendChild(tr);
      }

      function buildPanel(tabId, record, turn) {
        if (tabId === 'summary') return buildSummary(record, turn);
        if (tabId === 'raw') return buildRaw(record);
        if (tabId === 'args') return buildBlock('工具参数', record.arguments, true);
        if (tabId === 'result') return buildBlock('工具结果', record.result, false);
        return buildBlock('思考过程', record.thinking, false);
      }

      function buildSummary(record, turn) {
        var wrap = el('div');
        wrap.className = 'stack';
        wrap.style.display = 'flex';
        wrap.style.flexDirection = 'column';
        wrap.style.gap = '12px';

        if (record.isError || record.error) {
          var alert = el('div', 'bar bar-danger');
          var texts = el('div');
          texts.appendChild(el('p', 'bar-title', '失败'));
          texts.appendChild(el('p', 'bar-hint', safeText(record.error) || '该记录以错误结束，但没有给出错误信息。'));
          alert.appendChild(texts);
          wrap.appendChild(alert);
        }

        var scroll = el('div', 'table-scroll');
        var table = el('table', 'kv-table');
        var caption = el('caption', 'sr-only', '记录元信息');
        table.appendChild(caption);
        kvRow(table, '类型', record.title === 'compaction' ? '压缩（上下文检查点）' : kindLabel(record));
        kvRow(table, '角色', isNil(record.role) ? DASH : String(record.role));
        kvRow(table, '轮次', isCount(turn && turn.index) ? '轮次 ' + turn.index : DASH);
        kvRow(table, '记录序号', isCount(record.index) ? '#' + record.index : DASH);
        if (record.tokensBefore !== null && record.tokensBefore !== undefined) {
          kvRow(table, '压缩前上下文', formatInt(record.tokensBefore) + ' tokens');
        }
        // What the checkpoint actually did: which generation it opened, who wrote it, and
        // which earlier revision it replaced. Without these the numbers above have no story.
        if (isCount(record.generation)) kvRow(table, '开启的上下文代', '第 ' + formatInt(record.generation) + ' 代');
        if (record.producedBy) kvRow(table, '检查点来源', String(record.producedBy));
        if (isCount(record.parentGeneration)) {
          kvRow(table, '替换的上一代', '第 ' + formatInt(record.parentGeneration) + ' 代');
        }
        if (record.parentCompactionId) kvRow(table, '上一代检查点 id', String(record.parentCompactionId));
        if (record.toolName) kvRow(table, '工具', record.toolName + (record.toolCallId ? '（' + record.toolCallId + '）' : ''));
        kvRow(table, '时间', formatClock(record.timestamp));
        kvRow(table, '相对起点', formatOffset(record.relativeMs));
        kvRow(table, '耗时', isNil(record.durationMs) ? DASH : formatDuration(record.durationMs));
        kvRow(table, '模型', isNil(record.model) ? DASH : String(record.model));
        kvRow(table, '提供方', isNil(record.provider) ? DASH : String(record.provider));
        kvRow(table, '接口', isNil(record.api) ? DASH : String(record.api));
        kvRow(table, '结束原因', isNil(record.stopReason) ? DASH : String(record.stopReason));
        kvRow(table, '状态', record.isError || record.error ? '失败' : '已完成');
        scroll.appendChild(table);
        wrap.appendChild(scroll);

        var tokens = record.tokens;
        wrap.appendChild(el('p', 'block-title', 'Token 用量'));
        if (!tokens) {
          wrap.appendChild(el('p', 'note', '该记录没有 token 统计，显示为 ' + DASH + '。'));
        } else {
          var tokenScroll = el('div', 'table-scroll');
          var tokenTable = el('table', 'kv-table');
          kvRow(tokenTable, '输入', formatInt(tokens.input));
          kvRow(tokenTable, '输出', formatInt(tokens.output));
          kvRow(tokenTable, '缓存读', formatInt(tokens.cacheRead));
          kvRow(tokenTable, '缓存写', formatInt(tokens.cacheWrite));
          kvRow(tokenTable, '合计', formatInt(tokens.totalTokens));
          tokenScroll.appendChild(tokenTable);
          wrap.appendChild(tokenScroll);
        }

        if (record.summary) {
          wrap.appendChild(el('p', 'block-title', '摘要'));
          wrap.appendChild(el('p', 'note', safeText(record.summary)));
        }
        return wrap;
      }

      function buildRaw(record) {
        var wrap = el('div');
        wrap.style.display = 'flex';
        wrap.style.flexDirection = 'column';
        wrap.style.gap = '8px';
        if (record.rawOmitted) {
          wrap.appendChild(el('p', 'note note-danger', '原文过大，已省略。可以从参数与结果页查看已保留的部分。'));
        }
        if (record.textTruncated) {
          wrap.appendChild(el('p', 'note', '正文已截断：仅保留前段内容。'));
        }
        var pre = el('pre', 'pre');
        pre.setAttribute('tabindex', '0');
        var source = record.raw !== null && record.raw !== undefined ? record.raw : stripVolatile(record);
        if (source === null || source === undefined) {
          pre.textContent = DASH;
        } else {
          pre.innerHTML = jsonColorize(source);
        }
        wrap.appendChild(pre);
        return wrap;
      }

      function stripVolatile(record) {
        var copy = {};
        for (var key in record) {
          if (Object.prototype.hasOwnProperty.call(record, key)) copy[key] = record[key];
        }
        return copy;
      }

      function buildBlock(title, value, colored) {
        var wrap = el('div');
        wrap.style.display = 'flex';
        wrap.style.flexDirection = 'column';
        wrap.style.gap = '8px';
        wrap.appendChild(el('p', 'block-title', title));
        var pre = el('pre', 'pre');
        pre.setAttribute('tabindex', '0');
        var text = safeText(value);
        if (!text) {
          pre.textContent = DASH;
        } else if (colored && typeof value === 'object') {
          pre.innerHTML = jsonColorize(value);
        } else {
          pre.textContent = text;
        }
        wrap.appendChild(pre);
        return wrap;
      }

      /* ---------------- copy & handoff ---------------- */

      function recordForClipboard(record) {
        if (record.raw !== null && record.raw !== undefined) return stringify(record.raw);
        return stringify(record);
      }

      function copySelected() {
        var entry = selectedRecord();
        if (!entry) return;
        var text = recordForClipboard(entry.record);
        var done = function (ok) {
          inspectorSay(ok ? '已复制该记录的 JSON。' : '复制失败，请手动选择文本后复制。');
        };
        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(text).then(
            function () {
              done(true);
            },
            function () {
              done(legacyCopy(text));
            }
          );
          return;
        }
        done(legacyCopy(text));
      }

      function legacyCopy(text) {
        try {
          var area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          var ok = document.execCommand('copy');
          document.body.removeChild(area);
          return ok;
        } catch (error) {
          return false;
        }
      }

      function hostBridge() {
        var api = typeof window !== 'undefined' ? window.mcode : undefined;
        var message = api && api.miniapp ? api.miniapp.message : undefined;
        return message && typeof message.append === 'function' ? message : null;
      }

      function updateHandoffButton() {
        var available = !!hostBridge();
        dom.handoffBtn.disabled = !selectedRecord() || !available;
        if (!available) {
          dom.handoffBtn.title = '当前环境没有 MiniMax Code 桥接，只有在侧边栏打开本应用时可用';
          if (!dom.handoffBtn.getAttribute('data-bridge-note')) {
            dom.handoffBtn.setAttribute('data-bridge-note', '1');
            inspectorSay('当前环境没有 Host 桥接，无法写入对话输入框（普通浏览器打开时没有这个能力）。');
          }
        }
      }

      var HANDOFF_ERRORS = {
        user_cancelled: '已取消，没有写入任何内容。',
        invalid_request: '请求无效，未能写入。请重试或缩短内容。',
        text_too_large: '内容超过长度上限，未能写入。请缩小范围后再试。',
        not_allowed: '当前对话不允许写入这条内容。',
        target_unavailable: '没有可用的目标对话，未能写入。请先打开一个对话。',
        result_unknown: '结果未知，请先检查输入框，内容可能已经写入；不要重复发送。'
      };

      function handoffSelected() {
        var entry = selectedRecord();
        if (!entry) return;
        var message = hostBridge();
        if (!message) {
          updateHandoffButton();
          return;
        }
        var record = entry.record;
        var rawSource = record.raw !== null && record.raw !== undefined ? record.raw : stripVolatile(record);
        var raw = truncateJson(rawSource, HANDOFF_RAW_LIMIT);
        var text = buildHandoffMarkdown(
          state.payload ? state.payload.session : null,
          entry.turn,
          record,
          raw.text,
          raw.truncated
        );

        dom.handoffBtn.disabled = true;
        inspectorSay('已发出请求，等待你在弹出的确认框中确认…');
        var result = message.append(text);
        if (result && typeof result.then === 'function') {
          result.then(
            function () {
              inspectorSay('已添加到输入框，请确认后发送。Agent 尚未开始处理。');
              dom.handoffBtn.disabled = false;
            },
            function (error) {
              var code = error && typeof error === 'object' && typeof error.message === 'string' ? error.message : '';
              inspectorSay(HANDOFF_ERRORS[code] || '写入失败，请检查对话后重试。');
              dom.handoffBtn.disabled = false;
            }
          );
          return;
        }
        inspectorSay('已添加到输入框，请确认后发送。');
        dom.handoffBtn.disabled = false;
      }

      /* ---------------- top-level render ---------------- */

      function render() {
        renderBars();
        renderGeneration();
        renderKpi();
        renderLedger();
        renderCollapseButton();
        renderInspector();
        renderFooter();
        updateHandoffButton();
      }

      function renderGeneration() {
        var session = state.payload ? state.payload.session : null;
        var generations = session && Array.isArray(session.generations) ? session.generations : [];
        var activeGeneration = null;
        for (var i = 0; i < generations.length; i += 1) {
          if (generations[i] && generations[i].active) activeGeneration = generations[i].generation;
        }
        if (activeGeneration === null && session && isCount(session.activeGeneration)) {
          activeGeneration = session.activeGeneration;
        }

        var options = generationOptions(generations, activeGeneration);
        // The control only earns its place when history has actually been rotated. With one
        // generation there is nothing to narrow to, so offering "all" versus "all" is noise.
        var multi = options.length > 1;
        dom.generationField.hidden = !multi;
        if (multi) {
          // Rebuilding the <select> on every render would throw away whatever the reader had
          // just picked — including the pick that triggered this very render. Only touch the
          // DOM when the option set itself actually changed.
          var signature = options
            .map(function (entry) { return entry.generation + ':' + entry.label; })
            .join('|');
          if (dom.generationSelect.getAttribute('data-signature') !== signature) {
            clear(dom.generationSelect);
            for (var j = 0; j < options.length; j += 1) {
              var option = document.createElement('option');
              option.value = String(options[j].generation);
              option.textContent = options[j].label;
              dom.generationSelect.appendChild(option);
            }
            dom.generationSelect.setAttribute('data-signature', signature);
          }
          var following = state.generation === null ? 'all' : String(state.generation);
          if (dom.generationSelect.value !== following) dom.generationSelect.value = following;
        }

        // The banner only appears when the ledger is narrowed. With nothing selected the page
        // is already showing the whole conversation and saying so would be noise.
        var pinned = multi && state.generation !== null;
        var shown = session && isCount(session.generation) ? session.generation : state.generation;
        dom.generationHint.hidden = !pinned;
        if (pinned) {
          dom.generationHint.textContent = '正在查看第 ' + formatInt(shown) +
            ' 代上下文 —— 这是压缩前的历史快照，不会随后续对话更新。全部上下文共 ' +
            formatInt(statsAll()) + ' 条消息。';
        }
      }

      function statsAll() {
        var stats = state.payload && state.payload.stats ? state.payload.stats : null;
        return stats && isCount(stats.messagesAll) ? stats.messagesAll : 0;
      }

      function renderBars() {
        if (state.hardError) {
          dom.errorBar.hidden = false;
          dom.errorTitle.textContent = '无法读取会话轨迹';
          dom.errorText.textContent = state.hardError;
        } else {
          dom.errorBar.hidden = true;
          dom.errorText.textContent = '';
        }
        dom.staleBar.hidden = !state.stale;
      }

      function renderFooter() {
        var session = state.payload ? state.payload.session : null;
        dom.footerTruncated.hidden = !(session && session.truncated);
        // Say plainly which conversation is on screen and how we know it.
        var binding = session ? session.binding : null;
        if (!session) {
          // Before the first response lands there is nothing to report; claiming a fallback
          // here would look like a failure that is not happening.
          dom.footerBinding.textContent = '正在判定当前会话…';
        } else if (state.hostSessionId) {
          dom.footerBinding.textContent =
            '已锁定打开本页面所属的会话 ' + state.hostSessionId + '（由宿主桥接提供）。';
        } else if (binding === 'ambiguous') {
          var list = (session.ambiguousCandidates || []).map(function (item) {
            return '「' + (item.label || item.id) + '」';
          }).join('、');
          dom.footerBinding.textContent =
            '检测到 ' + (session.ambiguousCandidates || []).length
            + ' 个对话同时在执行任务（' + list
            + '），无法判断本页属于哪一个。当前暂按最近更新显示「'
            + (session.label || session.id) + '」，请在上方确认，或手动切换。';
        } else if (binding === 'runtime-db') {
          dom.footerBinding.textContent = session.leased
            ? '当前显示的是正在运行的对话「' + (session.label || session.id) + '」，由本机运行时数据库判定：该会话正持有活跃的 turn 租约。'
            : '当前显示的是最近更新的对话「' + (session.label || session.id) + '」，由本机运行时数据库判定（当前没有正在执行的 turn）。';
        } else if (state.followLatest) {
          dom.footerBinding.textContent =
            '当前显示最近写入的会话。运行时数据库不可用，退回按文件时间判断；多会话同时活跃时可能不是打开本页面的那个会话，可在下方手动切换。';
        } else {
          dom.footerBinding.textContent =
            '当前显示手动选择的会话 ' + (state.sessionId || '') + '。';
        }
      }

      /* ---------------- wiring ---------------- */

      function setFollow(enabled) {
        state.followLatest = enabled;
        dom.followBtn.setAttribute('aria-pressed', enabled ? 'true' : 'false');
        dom.followState.textContent = enabled ? '开' : '关';
        dom.sessionSelect.value = enabled ? 'latest' : state.sessionId || 'latest';
        state.signature = '';
        state.loading = true;
        fetchSessions();
        fetchTrajectory(false);
        announce(enabled ? '已开启跟随最新，正在跟踪最近的会话。' : '已关闭跟随最新，固定在所选会话。');
      }

      function syncChipInputs() {
        var boxes = dom.toolbar.querySelectorAll('.chips input[type="checkbox"]');
        for (var i = 0; i < boxes.length; i += 1) {
          boxes[i].checked = state.kinds.indexOf(boxes[i].value) >= 0;
          boxes[i].parentNode.classList.toggle('is-on', boxes[i].checked);
        }
        dom.chipAll.setAttribute('aria-pressed', state.kinds.length === KIND_ORDER.length ? 'true' : 'false');
      }

      function onKindToggle(value, checked) {
        var next = state.kinds.filter(function (kind) {
          return kind !== value;
        });
        if (checked) next = next.concat([value]);
        next.sort(function (a, b) {
          return KIND_ORDER.indexOf(a) - KIND_ORDER.indexOf(b);
        });
        state.kinds = next;
        state.limit = PAGE_STEP;
        syncChipInputs();
        renderLedger();
        updateFilterStatus(visibleEntries().length, state.flat.length);
      }

      function startPolling() {
        stopPolling();
        pollTimer = window.setInterval(function () {
          if (document.hidden) return;
          fetchSessions();
          fetchTrajectory(false);
        }, POLL_INTERVAL);
      }

      function stopPolling() {
        if (pollTimer !== null) {
          window.clearInterval(pollTimer);
          pollTimer = null;
        }
      }

      function wire() {
        dom.followBtn.addEventListener('click', function () {
          setFollow(!state.followLatest);
        });

        dom.refreshBtn.addEventListener('click', function () {
          announce('正在刷新…');
          fetchSessions();
          fetchTrajectory(true);
        });

        dom.sessionSelect.addEventListener('change', function () {
          var value = dom.sessionSelect.value;
          // A different session has a different generation chain; keeping the old pin would
          // ask that session for a generation number it may never have had.
          state.generation = null;
          if (value === 'latest') {
            setFollow(true);
            return;
          }
          state.sessionId = value;
          setFollow(false);
        });

        dom.generationSelect.addEventListener('change', function () {
          var raw = dom.generationSelect.value;
          // `Number('')` and `Number('abc')` are not a generation: the first silently becomes
          // 0, which would claim the reader chose the oldest snapshot when they chose nothing.
          var parsed = /^\d+$/.test(raw) ? Number(raw) : null;
          state.generation = parsed !== null && isCount(parsed) ? parsed : null;
          // The pin changes what every count on the page refers to, so the selected record,
          // the page window and the validator all have to start over.
          state.selectedId = null;
          state.limit = PAGE_STEP;
          state.etag = '';
          state.etagFor = '';
          state.loading = true;
          render();
          fetchTrajectory(true);
        });

        dom.searchInput.addEventListener('input', function () {
          if (searchTimer !== null) window.clearTimeout(searchTimer);
          searchTimer = window.setTimeout(function () {
            searchTimer = null;
            state.query = dom.searchInput.value.trim();
            state.limit = PAGE_STEP;
            renderLedger();
          }, SEARCH_DEBOUNCE);
        });

        dom.toolbar.addEventListener('submit', function (event) {
          event.preventDefault();
        });

        dom.chipAll.addEventListener('click', function () {
          if (state.kinds.length === KIND_ORDER.length) {
            state.kinds = [];
          } else {
            state.kinds = KIND_ORDER.slice();
          }
          state.limit = PAGE_STEP;
          syncChipInputs();
          renderLedger();
          updateFilterStatus(visibleEntries().length, state.flat.length);
        });

        var boxes = dom.toolbar.querySelectorAll('.chips input[type="checkbox"]');
        for (var i = 0; i < boxes.length; i += 1) {
          boxes[i].addEventListener('change', function (event) {
            onKindToggle(event.target.value, event.target.checked);
          });
        }

        dom.collapseAll.addEventListener('click', function () {
          var groups = visibleTurns(visibleEntries());
          var collapse = !areAllCollapsed(groups);
          state.allCollapsed = collapse;
          for (var g = 0; g < groups.length; g += 1) {
            var key = turnKey(groups[g].turn);
            if (collapse) state.collapsed[key] = true;
            else delete state.collapsed[key];
          }
          renderLedger();
          renderCollapseButton();
        });

        dom.copyBtn.addEventListener('click', copySelected);
        dom.handoffBtn.addEventListener('click', handoffSelected);

        document.addEventListener('visibilitychange', function () {
          if (document.hidden) {
            if (inflight) inflight.abort();
            return;
          }
          fetchSessions();
          fetchTrajectory(false);
        });

        if (window.matchMedia) {
          var media = window.matchMedia('(prefers-color-scheme: dark)');
          if (typeof media.addEventListener === 'function') {
            media.addEventListener('change', applyTheme);
          } else if (typeof media.addListener === 'function') {
            media.addListener(applyTheme);
          }
        }
      }

      function init() {
        applyTheme();
        cacheDom();
        wire();
        syncChipInputs();
        renderCollapseButton();
        render();
        fetchSessions();
        fetchTrajectory(false);
        startPolling();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
