<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活页场景工作台 · LivePage</title><link rel="stylesheet" href="/workbench.css"></head><body>
<header><div class="eyebrow">LIVEPAGE / 活页</div><h1>让成果，成为一页。</h1><p>日报、邀请函、经营报表，从资料走到手机可读的成果。</p><span class="badge">先预览 · 再交付 · 持续更新</span></header>
<main><nav id="scenes" aria-label="选择场景"></nav><section class="work"><div class="section-head"><div><h2 id="scene-title"></h2><p id="value"></p></div><span class="badge">虚构模板预览</span></div>
<div class="columns"><form id="brief-form"><label for="audience">给谁看</label><input id="audience" maxlength="200" placeholder="例如：采购团队、参会客户、门店负责人"><label for="material">你的资料</label><textarea id="material" maxlength="20000" rows="8"></textarea><p class="muted">资料仅留在本页内存，刷新或关闭会丢失。不会自动上传。</p><button type="submit" class="primary">生成任务草稿</button></form><div class="preview-wrap"><iframe id="preview" title="虚构场景模板预览" sandbox=""></iframe></div></div>
</section><section class="draft"><h2>交给 Agent 前，先看一遍</h2><p>草稿可以编辑。填入对话后，仍由你确认发送。</p><label for="output">任务草稿</label><textarea id="output" rows="10" maxlength="90000"></textarea><div class="actions"><button id="append" type="button" class="primary">填入当前对话</button><button id="copy" type="button">复制草稿</button></div><p id="status" role="status" aria-live="polite">尚未填入对话；未发布页面。</p></section>
<footer><strong>AI 做好的成果，一个链接交付，后续沿用原链接更新。</strong><p>本工作台不读取聊天记录、不自动运行 Agent、不调用 MCP。在线发布需另行连接活页账号。模板为虚构演示，生产前请替换资料并核验事实。</p><a href="https://getlivepage.com/" target="_blank" rel="noopener noreferrer">了解活页</a> · <a href="https://getlivepage.com/privacy" target="_blank" rel="noopener noreferrer">隐私政策</a></footer></main><script type="module" src="/workbench.mjs"></script></body></html>
