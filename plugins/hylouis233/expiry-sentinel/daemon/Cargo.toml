[package]
name = "reset-card-daemon"
version = "1.0.0"
edition = "2024"

[dependencies]
# HTTP 客户端：手写 TLS 容易出错且难维护，用成熟实现更可靠
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"     # 体积优先：后台常驻服务不需要极致速度
lto = true
codegen-units = 1
panic = "abort"
strip = true
