<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天气 · 新闻看板</title>
    <style>
      /* ---------- 语义变量：浅色 / 深色两套 ---------- */
      :root,
      [data-theme='light'] {
        --mcode-bg: #ffffff;
        --mcode-bg-secondary: #f5f5f5;
        --mcode-surface: #ffffff;
        --mcode-surface-muted: #fafafa;
        --mcode-text: #171717;
        --mcode-text-muted: #666666;
        --mcode-text-subtle: #adadad;
        --mcode-border: #0a0a0a14;
        --mcode-border-strong: #0a0a0af2;
        --mcode-accent: #0094fc;
        --mcode-success: #04b54b;
        --mcode-warning: #f56811;
        --mcode-danger: #f73646;
        --mcode-primary-action-bg: #171717;
        --mcode-primary-action-text: #ffffff;
        --mcode-shadow: 0 0 20px rgb(10 10 10 / 8%);
        /* A 股习惯：红涨绿跌 */
        --mcode-up: #f73646;
        --mcode-down: #04b54b;
        --mcode-flat: #949494;
      }

      [data-theme='dark'] {
        --mcode-bg: #171717;
        --mcode-bg-secondary: #1c1c1c;
        --mcode-surface: #262626;
        --mcode-surface-muted: #262626;
        --mcode-text: #ededed;
        --mcode-text-muted: #949494;
        --mcode-text-subtle: #666666;
        --mcode-border: #ffffff14;
        --mcode-border-strong: #fffffff2;
        --mcode-accent: #0077d9;
        --mcode-success: #009c3d;
        --mcode-warning: #e25507;
        --mcode-danger: #e31937;
        --mcode-primary-action-bg: #ffffff;
        --mcode-primary-action-text: #171717;
        --mcode-shadow: 0 0 20px rgb(0 0 0 / 34%);
        --mcode-up: #e31937;
        --mcode-down: #009c3d;
        --mcode-flat: #949494;
      }

      /* ---------- 基础 ---------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--mcode-bg);
        color: var(--mcode-text);
        font-family: ui-sans-serif, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }

      /* 布局按可用容器宽度自适应，而非视口宽度 */
      .app-shell {
        width: 100%;
      }
      .app {
        container-type: inline-size;
        container-name: app;
        max-width: var(--app-width, 1440px);
        margin: 0 auto 0 0;
        padding: 20px 24px 32px;
      }

      /* ---------- 顶栏 ---------- */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        position: relative;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }
      .brand-title {
        margin: 0;
        font-size: 18px;
        line-height: 28px;
        font-weight: 600;
      }
      .brand-sub {
        font-size: 12px;
        color: var(--mcode-text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* ---------- 控件 ---------- */
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
        font-size: 12.5px;
        color: var(--mcode-text-muted);
        white-space: nowrap;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch-track {
        position: relative;
        width: 30px;
        height: 17px;
        border-radius: 9px;
        background: var(--mcode-border-strong);
        transition: background 150ms ease-out;
        flex: none;
      }
      .switch-track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--mcode-surface);
        transition: transform 150ms ease-out;
      }
      .switch input:checked + .switch-track {
        background: var(--mcode-accent);
      }
      .switch input:checked + .switch-track::after {
        transform: translateX(13px);
      }
      .switch input:focus-visible + .switch-track {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 2px;
      }

      input[type='text'],
      select {
        height: 32px;
        padding: 0 8px;
        border-radius: 8px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
        font: inherit;
        font-size: 12.5px;
        min-width: 0;
      }
      input[type='text']::placeholder {
        color: var(--mcode-text-subtle);
      }
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 1px;
        border-color: var(--mcode-border-strong);
      }

      .btn {
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 150ms ease-out, opacity 150ms ease-out;
      }
      .btn:hover {
        background: var(--mcode-bg-secondary);
      }
      .btn-primary {
        background: var(--mcode-primary-action-bg);
        color: var(--mcode-primary-action-text);
        border-color: transparent;
      }
      .btn-primary:hover {
        opacity: 0.88;
        background: var(--mcode-primary-action-bg);
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
        color: var(--mcode-text-muted);
        cursor: pointer;
        transition: background 150ms ease-out, color 150ms ease-out;
      }
      .icon-btn:hover {
        color: var(--mcode-text);
        background: var(--mcode-bg-secondary);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
      }
      .icon-btn.is-spinning svg {
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- 卡片 ---------- */
      .board {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        max-height: var(--board-max-h, none);
        overflow-y: auto;
        overflow-x: hidden;
      }
      .top-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        align-items: stretch;
      }
      .card {
        background: var(--mcode-surface);
        border: 1px solid var(--mcode-border);
        border-radius: 12px;
        box-shadow: var(--mcode-shadow);
        padding: 14px;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card-title {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
      }
      .card-meta {
        font-size: 12px;
        color: var(--mcode-text-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* ---------- 天气卡 ---------- */
      .weather-card {
        container-type: inline-size;
        container-name: weather;
      }
      .city-form {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }
      .city-form-row {
        display: flex;
        gap: 6px;
      }
      .city-form-row .btn {
        flex: 1;
        padding: 0 6px;
      }
      .city-form input[type='text'] {
        width: 100%;
      }
      .weather-body {
        flex: 1;
        min-height: 0;
        display: flex;
      }
      .weather-inner {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        justify-content: space-between;
      }
      .weather-hourly {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .weather-hour {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 8px;
        background: var(--mcode-surface-muted);
        font-size: 12px;
      }
      .hour-time {
        width: 64px;
        flex: none;
        font-size: 11.5px;
        color: var(--mcode-text-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .hour-day {
        color: var(--mcode-text-subtle);
        margin-right: 2px;
      }
      .hour-icon {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--mcode-text-muted);
      }
      .hour-temp {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        min-width: 30px;
      }
      .hour-desc {
        flex: 1;
        min-width: 0;
        color: var(--mcode-text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hour-rain {
        flex: none;
        font-size: 11px;
        color: var(--mcode-text-subtle);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .weather-main {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .weather-icon {
        width: 44px;
        height: 44px;
        flex: none;
        color: var(--mcode-accent);
      }
      .weather-temp {
        font-size: 34px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.5px;
        font-variant-numeric: tabular-nums;
      }
      .weather-desc {
        margin-top: 6px;
        font-size: 12.5px;
        color: var(--mcode-text-muted);
      }
      .weather-metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .metric {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 7px;
        border-radius: 8px;
        background: var(--mcode-surface-muted);
        min-width: 0;
      }
      .metric-label {
        font-size: 10.5px;
        color: var(--mcode-text-subtle);
        white-space: nowrap;
      }
      .metric-value {
        font-size: 13px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .weather-forecast {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .forecast-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .forecast-line {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .forecast-day {
        font-size: 12px;
        color: var(--mcode-text-muted);
        width: 26px;
        flex: none;
      }
      .forecast-icon {
        width: 18px;
        height: 18px;
        flex: none;
        color: var(--mcode-text-muted);
      }
      .forecast-temp {
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .forecast-temp b {
        font-weight: 600;
      }
      .forecast-temp i {
        font-style: normal;
        color: var(--mcode-text-muted);
      }
      .forecast-bar {
        position: relative;
        height: 4px;
        border-radius: 2px;
        background: var(--mcode-bg-secondary);
        overflow: hidden;
      }
      .forecast-bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 2px;
        background: var(--mcode-accent);
      }
      .forecast-rain {
        font-size: 10.5px;
        color: var(--mcode-text-subtle);
        font-variant-numeric: tabular-nums;
      }

      @container weather (max-width: 272px) {
        .weather-icon {
          width: 38px;
          height: 38px;
        }
        .weather-temp {
          font-size: 30px;
        }
        .metric {
          padding: 5px 6px;
        }
        .metric-value {
          font-size: 12.5px;
        }
        .forecast-day {
          width: 24px;
        }
        .hour-desc,
        .hour-rain,
        .hour-day {
          display: none;
        }
        .hour-time {
          width: 44px;
        }
      }

      /* ---------- 自选股卡 ---------- */
      .stocks-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }
      .stocks-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .stocks-row input[type='text'] {
        flex: 1;
      }
      .stocks-options {
        justify-content: space-between;
      }
      .stock-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 196px), 1fr));
        gap: 4px 8px;
        align-content: start;
        flex: 0 0 auto;
      }
      .stock-row {
        position: relative;
        container-type: inline-size;
        container-name: tile;
        padding: 6px 8px;
        border-radius: 8px;
        min-width: 0;
        transition: background 150ms ease-out;
      }
      .stock-row:hover {
        background: var(--mcode-surface-muted);
      }
      .stock-top {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .stock-name {
        font-size: 13.5px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .stock-code {
        font-size: 11px;
        color: var(--mcode-text-subtle);
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
        flex: none;
      }
      .stock-remove {
        margin-left: auto;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--mcode-text-subtle);
        cursor: pointer;
        flex: none;
        transition: color 150ms ease-out, background 150ms ease-out;
      }
      .stock-remove:hover {
        color: var(--mcode-danger);
        background: var(--mcode-surface-muted);
      }
      .stock-remove svg {
        width: 13px;
        height: 13px;
      }
      .stock-bottom {
        display: flex;
        align-items: baseline;
        gap: 4px 8px;
        margin-top: 2px;
        flex-wrap: wrap;
      }
      .stock-quote {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
        min-width: 0;
      }
      .stock-deltas {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .stock-price {
        font-size: 18px;
        line-height: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stock-unit {
        font-size: 11px;
        color: var(--mcode-text-subtle);
        margin-left: 2px;
      }
      .stock-delta {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .stock-delta .tri {
        width: 8px;
        height: 8px;
        flex: none;
      }
      .up {
        color: var(--mcode-up);
      }
      .down {
        color: var(--mcode-down);
      }
      .flat {
        color: var(--mcode-flat);
      }
      .stock-error {
        font-size: 12.5px;
        color: var(--mcode-text-muted);
      }
      .stock-empty {
        grid-column: 1 / -1;
        padding: 10px 2px;
        font-size: 12.5px;
        color: var(--mcode-text-muted);
      }
      .stocks-summary {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--mcode-text-muted);
      }
      .summary-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-variant-numeric: tabular-nums;
      }
      .summary-item.is-up {
        color: var(--mcode-up);
      }
      .summary-item.is-down {
        color: var(--mcode-down);
      }
      .hint {
        margin: auto 0 0;
        padding-top: 8px;
        font-size: 11.5px;
        line-height: 17px;
        color: var(--mcode-text-subtle);
      }

      /* ---------- 新闻卡 ---------- */
      .news-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .news-tabs {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
        background: var(--mcode-surface-muted);
        flex-wrap: wrap;
      }
      .news-tab {
        height: 28px;
        padding: 0 11px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--mcode-text-muted);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        transition: background 150ms ease-out, color 150ms ease-out;
      }
      .news-tab:hover {
        color: var(--mcode-text);
      }
      .news-tab[aria-selected='true'] {
        background: var(--mcode-surface);
        color: var(--mcode-text);
        font-weight: 500;
        box-shadow: 0 1px 2px rgb(10 10 10 / 8%);
      }
      .news-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }
      .news-updated {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .status-badge {
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--mcode-surface-muted);
        color: var(--mcode-text-muted);
        font-size: 11.5px;
        white-space: nowrap;
      }
      .status-badge.is-ok {
        color: var(--mcode-success);
      }
      .status-badge.is-warn {
        color: var(--mcode-warning);
      }
      .status-badge.is-error {
        color: var(--mcode-danger);
      }
      .news-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .news-item {
        position: relative;
        padding: 9px 10px 9px 12px;
        border-radius: 8px;
        background: var(--mcode-surface-muted);
      }
      .news-item::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 2px;
        border-radius: 1px;
        background: var(--mcode-accent);
        opacity: 0;
        transition: opacity 150ms ease-out;
      }
      .news-item:hover::before {
        opacity: 1;
      }
      .news-title {
        display: block;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.45;
        color: var(--mcode-text);
        text-decoration: none;
      }
      .news-title:hover {
        color: var(--mcode-accent);
      }
      .news-desc {
        margin: 4px 0 0;
        font-size: 12.5px;
        line-height: 19px;
        color: var(--mcode-text-muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .news-meta {
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--mcode-text-subtle);
      }
      .news-source {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .source-dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .news-time {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
      .hot-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: 8px;
        transition: background 150ms ease-out;
      }
      .hot-item:hover {
        background: var(--mcode-surface-muted);
      }
      .hot-rank {
        width: 18px;
        flex: none;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--mcode-text-subtle);
        font-variant-numeric: tabular-nums;
      }
      .hot-item:nth-child(-n + 3) .hot-rank {
        color: var(--mcode-accent);
      }
      .hot-title {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        color: var(--mcode-text);
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hot-title:hover {
        color: var(--mcode-accent);
      }
      .hot-score {
        flex: none;
        font-size: 12px;
        color: var(--mcode-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .list-empty {
        padding: 14px 2px;
        font-size: 12.5px;
        color: var(--mcode-text-muted);
      }

      /* ---------- 提示条 ---------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--mcode-primary-action-bg);
        color: var(--mcode-primary-action-text);
        font-size: 12.5px;
        box-shadow: var(--mcode-shadow);
        z-index: 20;
        max-width: calc(100vw - 32px);
      }
      .toast.is-error {
        background: var(--mcode-danger);
        color: #ffffff;
      }

      /* ---------- 尺寸面板 ---------- */
      .size-panel {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        z-index: 25;
        width: 260px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface);
        box-shadow: var(--mcode-shadow);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .size-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .size-row label {
        font-size: 12px;
        color: var(--mcode-text-muted);
        width: 32px;
        flex: none;
      }
      .size-row input[type='range'] {
        flex: 1;
        min-width: 0;
        height: 20px;
        accent-color: var(--mcode-accent);
        cursor: pointer;
      }
      .size-value {
        width: 52px;
        flex: none;
        text-align: right;
        font-size: 11.5px;
        color: var(--mcode-text);
        font-variant-numeric: tabular-nums;
      }
      .size-reset {
        align-self: stretch;
      }

      /* ---------- 尺寸手柄 ---------- */
      .resize-grip {
        position: fixed;
        right: max(18px, calc(100% - var(--app-width, 100%)));
        bottom: 10px;
        width: 30px;
        height: 30px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 9px;
        border: 1px solid var(--mcode-border-strong);
        background: var(--mcode-surface);
        color: var(--mcode-text-muted);
        box-shadow: var(--mcode-shadow);
        cursor: nwse-resize;
        z-index: 30;
        user-select: none;
        touch-action: none;
        padding: 0;
        transition: color 150ms ease-out, border-color 150ms ease-out;
      }
      .resize-grip:hover {
        color: var(--mcode-accent);
        border-color: var(--mcode-accent);
      }
      .resize-grip.is-active {
        color: var(--mcode-accent);
        border-color: var(--mcode-accent);
      }
      .resize-grip svg {
        width: 16px;
        height: 16px;
        pointer-events: none;
      }
      .resize-badge {
        position: fixed;
        right: max(18px, calc(100% - var(--app-width, 100%)));
        bottom: 46px;
        padding: 4px 9px;
        border-radius: 8px;
        background: var(--mcode-primary-action-bg);
        color: var(--mcode-primary-action-text);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        box-shadow: var(--mcode-shadow);
        z-index: 30;
        pointer-events: none;
        white-space: nowrap;
      }

      /* ---------- 响应式（按容器宽度自适应，不依赖视口宽度） ---------- */
      @container app (min-width: 560px) {
        .top-grid {
          grid-template-columns: clamp(184px, 30%, 268px) minmax(0, 1fr);
        }
      }
      @container app (min-width: 900px) {
        .board {
          grid-template-columns: minmax(210px, 0.55fr) minmax(320px, 1.25fr) minmax(280px, 1.5fr);
        }
        .top-grid {
          display: contents;
        }
      }
      @container app (max-width: 559px) {
        .app {
          padding: 14px 14px 24px;
        }
      }
      @container tile (max-width: 190px) {
        .stock-name {
          font-size: 12.5px;
        }
        .stock-code {
          font-size: 10px;
        }
      }
      @container tile (max-width: 168px) {
        .stock-price {
          font-size: 16px;
          line-height: 22px;
        }
      }
      @container tile (max-width: 120px) {
        .stock-code {
          display: none;
        }
      }
      /* 不支持容器查询时退回视口断点 */
      @supports not (container-type: inline-size) {
        @media (min-width: 900px) {
          .board {
            grid-template-columns: minmax(210px, 0.55fr) minmax(320px, 1.25fr) minmax(280px, 1.5fr);
          }
          .top-grid {
            display: contents;
          }
        }
        @media (min-width: 560px) {
          .top-grid {
            grid-template-columns: clamp(184px, 30%, 268px) minmax(0, 1fr);
          }
        }
        @media (max-width: 559px) {
          .app {
            padding: 14px 14px 24px;
          }
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

          <article class="card stocks-card" aria-labelledby="stocks-title">

    <script>
      (function () {
        'use strict';

        /* ================= 图标（全部内联 SVG，无 emoji） ================= */
        var ICON_ATTR =
          'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"';

        var WEATHER_ICONS = {

          cloud: '<path d="M7.5 18.5h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 18.5Z"/>',
          overcast:
            '<path d="M6.2 15.2h7.6a3.3 3.3 0 0 0 .3-6.6 4.7 4.7 0 0 0-9 1.6 2.7 2.7 0 0 0 1.1 5Z"/>' +
            '<path d="M9.8 19.5h8.4a3.6 3.6 0 0 0 .3-7.2 5.1 5.1 0 0 0-9.8 1.8 3 3 0 0 0 1.1 5.4Z"/>',
          fog:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M4.8 18.2h14.4M7 21.2h10"/>',
          haze:
            '<circle cx="12" cy="8.6" r="3.4"/>' +
            '<path d="M12 2.9v1.7M5.9 8.6H4.2M6.8 3.4 5.5 2.1M18.1 3.4l1.3-1.3"/>' +
            '<path d="M4.6 15.4h14.8M6.6 18.8h10.8"/>',
          rain:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M9 18.4l-.9 2.6M13 18.4l-.9 2.6M17 18.4l-.9 2.6"/>',
          drizzle:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M9.4 19.2h1.6M13.4 19.2h1.6M17 19.2h1.2"/>',
          snow:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M8.4 19.2v2.8M7.2 19.9l2.4 1.4M9.6 19.9l-2.4 1.4M15.6 19.2v2.8M14.4 19.9l2.4 1.4M16.8 19.9l-2.4 1.4"/>',
          sleet:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M9.2 18.6l-.8 2.4"/>' +
            '<path d="M15.6 19.2v2.8M14.4 19.9l2.4 1.4M16.8 19.9l-2.4 1.4"/>',
          thunder:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M13.2 17.2 10 21h2.6l-1.1 2.6"/>',
          wind: '<path d="M3.4 8.4h9a2.8 2.8 0 1 0-2.8-2.8M3.4 12.4h13a2.8 2.8 0 1 1-2.8 2.8M3.4 16.4h6.6"/>',
        };

        var TRI_UP = '<svg class="tri" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M5 1.4 9.2 8.6H0.8Z"/></svg>';
        var TRI_DOWN = '<svg class="tri" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M5 8.6 0.8 1.4h8.4Z"/></svg>';
        var TRI_FLAT = '<svg class="tri" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><rect x="1" y="4.2" width="8" height="1.6" rx="0.8"/></svg>';

        function weatherSvg(key, className) {
          var body = WEATHER_ICONS[key] || WEATHER_ICONS.cloud;
          return '<svg class="' + className + '" ' + ICON_ATTR + '>' + body + '</svg>';
        }

        /* ================= 常量与状态 ================= */
        var TABS = [
          { key: 'headlines', label: '要闻' },

        var VIEW_KEY = 'weather-news-board:view:v1';
        var THEME_KEY = 'weather-news-board:theme';

        var state = {

        };

        /* ================= 工具 ================= */
        function esc(value) {
          return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function pad(value) {
          return String(value).padStart(2, '0');
        }

        function fmtNumber(value, decimals) {
          var number = Number(value);
          if (!Number.isFinite(number)) return '--';
          return number.toLocaleString('zh-CN', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals,
          });
        }

        function fmtSigned(value, decimals) {
          var number = Number(value);
          if (!Number.isFinite(number)) return '--';
          var sign = number > 0 ? '+' : number < 0 ? '-' : '';
          return sign + fmtNumber(Math.abs(number), decimals);
        }

        function fmtClock(iso) {
          if (!iso) return '--:--';
          var date = new Date(iso);
          if (Number.isNaN(date.getTime())) return '--:--';
          return pad(date.getHours()) + ':' + pad(date.getMinutes());
        }

        function fmtStamp(iso) {
          if (!iso) return '--/-- --:--';
          var date = new Date(iso);
          if (Number.isNaN(date.getTime())) return '--/-- --:--';
          return (
            pad(date.getMonth() + 1) + '/' + pad(date.getDate()) + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes())
          );
        }

        function fmtNewsTime(iso) {
          if (!iso) return '';
          var date = new Date(iso);
          if (Number.isNaN(date.getTime())) return '';
          var today = new Date();
          var sameDay =
            date.getFullYear() === today.getFullYear() &&
            date.getMonth() === today.getMonth() &&
            date.getDate() === today.getDate();
          if (sameDay) return pad(date.getHours()) + ':' + pad(date.getMinutes());
          return pad(date.getMonth() + 1) + '/' + pad(date.getDate());
        }

        function fmtHotScore(score) {
          var number = Number(score) || 0;
          if (number >= 100000000) return (number / 100000000).toFixed(1) + '亿';
          if (number >= 10000) return (number / 10000).toFixed(1) + '万';
          return String(number);
        }

        var toastTimer = null;
        function showToast(message, kind) {
          el.toast.textContent = message;
          el.toast.className = 'toast' + (kind === 'error' ? ' is-error' : '');
          el.toast.hidden = false;
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            el.toast.hidden = true;
          }, 2600);
        }

        /* ================= 主题 ================= */
        var media = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme() {
          var saved = null;
          try {
            saved = localStorage.getItem(THEME_KEY);
          } catch (error) {
            saved = null;
          }
          var theme = saved || (media.matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          el.themeIcon.innerHTML =
            theme === 'dark'
              ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.3M12 19.1v2.3M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.6 12h2.3M19.1 12h2.3M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>'
              : '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>';
          el.themeBtn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色主题' : '切换到深色主题');
        }

        el.themeBtn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          var next = current === 'dark' ? 'light' : 'dark';
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch (error) {
            /* 忽略存储失败 */
          }
          applyTheme();
        });

        if (media.addEventListener) {
          media.addEventListener('change', function () {
            var saved = null;
            try {
              saved = localStorage.getItem(THEME_KEY);
            } catch (error) {
              saved = null;
            }
            if (!saved) applyTheme();
          });
        }

        /* ================= 视图状态 ================= */
        function saveViewState() {
          try {
            localStorage.setItem(
              VIEW_KEY,
              JSON.stringify({
                tab: state.tab,
                autoRefresh: state.autoRefresh,
                interval: state.interval,
                quoteAuto: state.quoteAuto,
                quoteInterval: state.quoteInterval,
                city: state.city,
                pick: state.pick,
              }),
            );
          } catch (error) {
            /* 忽略存储失败 */
          }
        }

        function restoreViewState() {
          try {
            var raw = localStorage.getItem(VIEW_KEY);
            if (!raw) return;
            var saved = JSON.parse(raw);
            if (saved && typeof saved === 'object') {
              if (TABS.some(function (tab) { return tab.key === saved.tab; })) state.tab = saved.tab;
              if (typeof saved.autoRefresh === 'boolean') state.autoRefresh = saved.autoRefresh;
              if (typeof saved.interval === 'number') state.interval = saved.interval;
              if (typeof saved.quoteAuto === 'boolean') state.quoteAuto = saved.quoteAuto;
              if (typeof saved.quoteInterval === 'number') state.quoteInterval = saved.quoteInterval;
              if (typeof saved.city === 'string' && saved.city) state.city = saved.city;
              if (typeof saved.pick === 'number') state.pick = saved.pick;
            }
          } catch (error) {
            /* 忽略解析失败 */
          }
        }

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') saveViewState();
        });

        /* ================= 请求 ================= */
        function getJson(url) {
          return fetch(url, { headers: { accept: 'application/json' } }).then(function (response) {
            return response
              .json()
              .catch(function () {
                return null;
              })
              .then(function (payload) {
                if (!payload) throw new Error('bad_response');
                if (!response.ok || payload.ok === false) {
                  var error = new Error(payload.message || '请求失败');
                  error.code = payload.error || 'request_failed';
                  throw error;
                }
                return payload;
              });
          });
        }

        /* ================= 天气卡自适应 ================= */
        var weatherTuneSig = '';
        var weatherTuneRaf = 0;

        function setHourlyLevel(level) {
          var extra = el.weatherExtra;
          if (!extra) return;
          var blocks = extra.querySelectorAll('.weather-hour');
          for (var i = 0; i < blocks.length; i += 1) {
            blocks[i].hidden = i >= level;
          }
          extra.setAttribute('data-level', String(level));
        }

        /* 卡片内容自然高度（不受拉伸影响） */
        function naturalHeight(card) {
          if (!card) return 0;
          var cs = getComputedStyle(card);
          var total = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
          for (var i = 0; i < card.children.length; i += 1) {
            var child = card.children[i];
            var ccs = getComputedStyle(child);
            total +=
              child.offsetHeight +
              (parseFloat(ccs.marginTop) || 0) +
              (parseFloat(ccs.marginBottom) || 0);
          }
          return total;
        }

        /* 天气主体内容的自然高度 */
        function weatherContentHeight() {
          var inner = el.weatherInner;
          if (!inner) return 0;
          var gap = parseFloat(getComputedStyle(inner).rowGap) || 0;
          var total = 0;
          for (var i = 0; i < inner.children.length; i += 1) {
            var child = inner.children[i];
            var ccs = getComputedStyle(child);
            total +=
              child.offsetHeight +
              (parseFloat(ccs.marginTop) || 0) +
              (parseFloat(ccs.marginBottom) || 0);
            if (i > 0) total += gap;
          }
          return total;
        }

        /* 天气卡除主体以外占用的高度（标题、查询框、内边距） */
        function weatherChrome() {
          var card = el.weatherCard;
          if (!card) return 0;
          var cs = getComputedStyle(card);
          var total = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
          var head = card.querySelector('.card-head');
          var form = card.querySelector('.city-form');
          if (head) {
            var hs = getComputedStyle(head);
            total += head.offsetHeight + (parseFloat(hs.marginBottom) || 0);
          }
          if (form) {
            var fs = getComputedStyle(form);
            total += form.offsetHeight + (parseFloat(fs.marginBottom) || 0);
          }
          return total;
        }

        function scheduleWeatherTune() {
          if (weatherTuneRaf) return;
          weatherTuneRaf = window.requestAnimationFrame(function () {
            weatherTuneRaf = 0;
            tuneWeatherCard();
          });
        }

        /**
         * 天气卡与自选股卡并排时高度对齐：先按自选股卡的高度挑出
         * 能放下的逐时预报档位，再由两卡共同决定这一行的最终高度。
         */
        function tuneWeatherCard() {
          var card = el.weatherCard;
          var inner = el.weatherInner;
          var extra = el.weatherExtra;
          if (!card || !inner || !extra) return;
          var blocks = extra.querySelectorAll('.weather-hour');
          var max = blocks.length;
          if (!max) {
            extra.hidden = true;
            return;
          }
          extra.hidden = false;

          var parent = card.parentElement;
          var tracks = parent ? getComputedStyle(parent).gridTemplateColumns.split(' ').length : 1;
          if (tracks <= 1) {
            // 单栏堆叠：卡片高度由内容决定，逐时预报全部显示。
            setHourlyLevel(max);
            weatherTuneSig = card.clientWidth + 'x' + card.clientHeight + '#' + max;
            return;
          }

          var sig =
            card.clientWidth + 'x' + card.clientHeight + '#' + (extra.getAttribute('data-level') || '0');
          if (sig === weatherTuneSig) return;
          weatherTuneSig = sig;

          var chrome = weatherChrome();
          var target = naturalHeight(el.stocksCard);
          var level = 0;
          for (var k = max; k >= 0; k -= 1) {
            setHourlyLevel(k);
            if (!target || chrome + weatherContentHeight() <= target) {
              level = k;
              break;
            }
          }
          setHourlyLevel(level);
          weatherTuneSig = card.clientWidth + 'x' + card.clientHeight + '#' + level;
        }

        /* ================= 天气 ================= */
        function renderWeather() {
          var data = state.weather;
          var inner = el.weatherInner;
          if (!inner) return;
          if (!data) {
            inner.innerHTML = '<p class="list-empty">天气来源暂不可用，请稍后重试或更换城市。</p>';
            el.weatherExtra = null;
            weatherTuneSig = '';
            return;
          }
          var current = data.current || {};
          var html = '';
          html +=
            '<div class="weather-main">' +
            weatherSvg(current.icon, 'weather-icon') +
            '<div><div class="weather-temp">' +
            esc(Math.round(Number(current.temp) || 0)) +
            '°</div></div></div>';
          html +=
            '<div class="weather-desc">' +
            esc(current.desc || '') +
            ' · ' +
            esc(data.city || '') +
            (data.region ? ' · ' + esc(data.region) : '') +
            '</div>';

          html += '<div class="weather-metrics">';
          html +=
            '<div class="metric"><span class="metric-label">体感温度</span><span class="metric-value">' +
            esc(Math.round(Number(current.feels) || 0)) +
            '°</span></div>';
          html +=
            '<div class="metric"><span class="metric-label">湿度</span><span class="metric-value">' +
            esc(Math.round(Number(current.humidity) || 0)) +
            '%</span></div>';
          html +=
            '<div class="metric"><span class="metric-label">风速</span><span class="metric-value">' +
            esc(Math.round(Number(current.windSpeed) || 0)) +
            ' km/h</span></div>';
          html += '</div>';

          html += '<div class="weather-forecast">';
          (data.forecast || []).forEach(function (day) {
            var probability = Math.max(0, Math.min(100, Number(day.probability) || 0));
            html +=
              '<div class="forecast-item">' +
              '<div class="forecast-line">' +
              '<span class="forecast-day">' +
              esc(day.label || '') +
              '</span>' +
              weatherSvg(day.icon, 'forecast-icon') +
              '<span class="forecast-temp"><b>' +
              esc(Math.round(Number(day.high) || 0)) +
              '°</b> / <i>' +
              esc(Math.round(Number(day.low) || 0)) +
              '°</i></span>' +
              '</div>' +
              '<div class="forecast-bar"><span class="forecast-bar-fill" style="width:' +
              probability +
              '%"></span></div>' +
              '<div class="forecast-rain">降水概率 ' +
              probability +
              '%</div>' +
              '</div>';
          });
          html += '</div>';

          if (state.weatherStale) {
            html += '<p class="forecast-rain">来源异常，已保留上一次数据</p>';
          }

          var hourly = data.hourly || [];
          if (hourly.length) {
            html += '<div class="weather-hourly">';
            hourly.forEach(function (slot) {
              var dayLabel = slot.day && slot.day !== '今天' ? slot.day : '';
              html +=
                '<div class="weather-hour">' +
                '<span class="hour-time">' +
                (dayLabel ? '<span class="hour-day">' + esc(dayLabel) + '</span>' : '') +
                esc(slot.time || '') +
                '</span>' +
                weatherSvg(slot.icon, 'hour-icon') +
                '<span class="hour-temp">' +
                esc(Math.round(Number(slot.temp) || 0)) +
                '°</span>' +
                '<span class="hour-desc">' +
                esc(slot.desc || '') +
                '</span>' +
                '<span class="hour-rain">降水 ' +
                esc(Math.max(0, Math.min(100, Number(slot.probability) || 0))) +
                '%</span>' +
                '</div>';
            });
            html += '</div>';
          }

          inner.innerHTML = html;
          el.weatherExtra = inner.querySelector('.weather-hourly');
          weatherTuneSig = '';
          scheduleWeatherTune();
        }

        function loadWeather(options) {
          var refresh = options && options.refresh ? '1' : '0';
          var params = new URLSearchParams({
            source: 'weather',
            city: state.city,
            pick: String(state.pick),
            refresh: refresh,
          });
          return getJson('/api/board?' + params.toString())
            .then(function (payload) {
              if (payload.data) {
                state.weather = payload.data;
                state.candidates = payload.data.candidates || [];
                if (typeof payload.data.index === 'number') state.pick = payload.data.index;
                state.weatherStale = Boolean(payload.stale);
              } else {
                state.weather = null;
                state.weatherStale = true;
              }
              renderWeather();
            })
            .catch(function () {
              state.weather = null;
              state.weatherStale = true;
              renderWeather();
            });
        }

        /* ================= 新闻 ================= */
        function renderTabs() {
          el.newsTabs.innerHTML = TABS.map(function (tab) {
            var selected = tab.key === state.tab;
            return (
              '<button class="news-tab" type="button" role="tab" id="tab-' +
              tab.key +
              '" data-source="' +
              tab.key +
              '" aria-selected="' +
              (selected ? 'true' : 'false') +
              '" tabindex="' +
              (selected ? '0' : '-1') +
              '">' +
              esc(tab.label) +
              '</button>'
            );
          }).join('');
          el.newsList.setAttribute('aria-labelledby', 'tab-' + state.tab);
        }

        function renderNews() {
          var data = state.news;
          var badge = el.newsBadge;
          if (!data) {
            el.newsList.innerHTML = '<li class="list-empty">暂无内容，请稍后重试。</li>';
            el.newsUpdated.textContent = '更新于 --/-- --:--';
            badge.textContent = '暂无数据';
            badge.className = 'status-badge is-warn';
            return;
          }

          var items = data.items || [];
          if (state.tab === 'hot') {
            el.newsList.innerHTML = items
              .map(function (item) {
                return (
                  '<li class="hot-item">' +
                  '<span class="hot-rank">' +
                  esc(item.rank) +
                  '</span>' +
                  '<a class="hot-title" href="' +
                  esc(item.url || '#') +
                  '" target="_blank" rel="noopener noreferrer">' +
                  esc(item.title) +
                  '</a>' +
                  '<span class="hot-score">' +
                  esc(fmtHotScore(item.score)) +
                  '</span>' +
                  '</li>'
                );
              })
              .join('');
          } else {
            el.newsList.innerHTML = items
              .map(function (item) {
                var time = fmtNewsTime(item.publishedAt);
                return (
                  '<li class="news-item">' +
                  '<a class="news-title" href="' +
                  esc(item.url || '#') +
                  '" target="_blank" rel="noopener noreferrer">' +
                  esc(item.title) +
                  '</a>' +
                  (item.description
                    ? '<p class="news-desc">' + esc(item.description) + '</p>'
                    : '') +
                  '<div class="news-meta">' +
                  '<span class="news-source"><i class="source-dot"></i>' +
                  esc(item.source || '') +
                  '</span>' +
                  (time ? '<time class="news-time">' + esc(time) + '</time>' : '') +
                  '</div>' +
                  '</li>'
                );
              })
              .join('');
          }

          if (!items.length) {
            el.newsList.innerHTML = '<li class="list-empty">该栏目暂时没有内容。</li>';
          }

          el.newsUpdated.textContent = '更新于 ' + fmtStamp(state.newsUpdatedAt);
          if (state.newsStale) {
            badge.textContent = '来源异常';
            badge.className = 'status-badge is-warn';
          } else {
            badge.textContent = '全部来源正常';
            badge.className = 'status-badge is-ok';
          }
        }

        function loadNews(options) {
          var refresh = options && options.refresh ? '1' : '0';
          var params = new URLSearchParams({ source: state.tab, refresh: refresh });
          return getJson('/api/board?' + params.toString())
            .then(function (payload) {
              state.news = payload.data;
              state.newsStale = Boolean(payload.stale);
              state.newsUpdatedAt = payload.updatedAt || (payload.data && payload.data.updatedAt) || null;
              renderNews();
            })
            .catch(function () {
              state.news = null;
              state.newsStale = true;
              renderNews();
            });
        }

        /* ================= 自选股 ================= */
        var STOCK_MIN_COL = 150;
        var STOCK_COL_GAP = 8;

        /**
         * 按可用宽度与条目总数计算最优列数。
         * 先保证行数最少；行数相同时选择末行留白更少的方案，
         * 使全部条目在任意容器宽度下都能完整排布。
         */
        function layoutStockList() {
          var list = el.stockList;
          var count = list.children.length;
          var width = list.clientWidth;
          if (!count || !width) {
            list.style.gridTemplateColumns = '';
            return;
          }
          var maxCols = Math.max(
            1,
            Math.floor((width + STOCK_COL_GAP) / (STOCK_MIN_COL + STOCK_COL_GAP)),
          );
          var limit = Math.min(maxCols, count);
          var best = 1;
          var bestRows = Infinity;
          var bestEmpty = Infinity;
          for (var cols = limit; cols >= 1; cols -= 1) {
            var rows = Math.ceil(count / cols);
            var empty = cols * rows - count;
            if (rows < bestRows) {
              bestRows = rows;
              bestEmpty = empty;
              best = cols;
            } else if (rows === bestRows && empty < bestEmpty) {
              bestEmpty = empty;
              best = cols;
            }
          }
          var next = 'repeat(' + best + ', minmax(0, 1fr))';
          if (list.style.gridTemplateColumns !== next) list.style.gridTemplateColumns = next;
        }

        function renderStocksSummary() {
          var box = el.stocksSummary;
          if (!box) return;
          var up = 0;
          var down = 0;
          var flat = 0;
          (state.stocks || []).forEach(function (item) {
            if (item.error) return;
            var change = Number(item.change) || 0;
            if (change > 0) up += 1;
            else if (change < 0) down += 1;
            else flat += 1;
          });
          var total = up + down + flat;
          if (!total) {
            box.innerHTML = '';
            return;
          }
          var html = '<span class="summary-item">' + total + ' 项</span>';
          if (up) html += '<span class="summary-item is-up">涨 ' + up + '</span>';
          if (down) html += '<span class="summary-item is-down">跌 ' + down + '</span>';
          if (flat) html += '<span class="summary-item">平 ' + flat + '</span>';
          box.innerHTML = html;
        }

        function renderStocks() {
          var items = state.stocks.length
            ? state.stocks
            : state.watchlist.map(function (code) {
                return { code: code, error: 'quote_unavailable' };
              });

          if (!items.length) {
            el.stockList.innerHTML =
              '<li class="stock-empty">还没有自选股。输入 6 位 A 股代码，或输入「黄金」「原油」等品种名称后点击「添加」。</li>';
            layoutStockList();
            renderStocksSummary();
            scheduleWeatherTune();
            return;
          }

          el.stockList.innerHTML = items
            .map(function (item) {
              if (item.error) {
                return (
                  '<li class="stock-row">' +
                  '<div class="stock-top"><span class="stock-name">' +
                  esc(item.code) +
                  '</span>' +
                  '<button class="stock-remove" type="button" data-code="' +
                  esc(item.code) +
                  '" aria-label="移除 ' +
                  esc(item.code) +
                  '">' +
                  REMOVE_ICON +
                  '</button></div>' +
                  '<div class="stock-bottom"><span class="stock-error">行情暂不可用，稍后自动重试</span></div>' +
                  '</li>'
                );
              }
              var change = Number(item.change) || 0;
              var percent = Number(item.changePercent) || 0;
              var direction = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
              var arrow = direction === 'up' ? TRI_UP : direction === 'down' ? TRI_DOWN : TRI_FLAT;
              var decimals = typeof item.decimals === 'number' ? item.decimals : 2;
              var title = item.title ? ' title="' + esc(item.title) + '"' : '';
              return (
                '<li class="stock-row"' +
                title +
                '>' +
                '<div class="stock-top">' +
                '<span class="stock-name">' +
                esc(item.name || item.code) +
                '</span>' +
                '<span class="stock-code">' +
                esc(item.code) +
                '</span>' +
                '<button class="stock-remove" type="button" data-code="' +
                esc(item.code) +
                '" aria-label="移除 ' +
                esc(item.name || item.code) +
                '">' +
                REMOVE_ICON +
                '</button></div>' +
                '<div class="stock-bottom">' +
                '<span class="stock-quote"><span class="stock-price">' +
                esc(fmtNumber(item.price, decimals)) +
                '</span>' +
                (item.unit ? '<span class="stock-unit">' + esc(item.unit) + '</span>' : '') +
                '</span>' +
                '<span class="stock-deltas">' +
                '<span class="stock-delta ' +
                direction +
                '">' +
                arrow +
                esc(fmtSigned(change, decimals)) +
                '</span>' +
                '<span class="stock-delta ' +
                direction +
                '">' +
                arrow +
                esc(fmtSigned(percent, 2)) +
                '%</span>' +
                '</span>' +
                '</div>' +
                '</li>'
              );
            })
            .join('');

          el.stocksUpdated.textContent = '更新 ' + fmtClock(state.stocksUpdatedAt);
          layoutStockList();
          renderStocksSummary();
          scheduleWeatherTune();
        }

        var REMOVE_ICON =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>';

        function loadStocks(options) {
          var refresh = options && options.refresh ? '1' : '0';
          var params = new URLSearchParams({ refresh: refresh });
          return getJson('/api/stocks?' + params.toString())
            .then(function (payload) {
              state.watchlist = payload.watchlist || [];
              state.stocks = payload.stocks || [];
              state.stocksUpdatedAt = payload.updatedAt || null;
              renderStocks();
            })
            .catch(function () {
              renderStocks();
            });
        }

        function mutateWatchlist(action, code) {
          return fetch('/api/watchlist', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ action: action, code: code }),
          })
            .then(function (response) {
              return response
                .json()
                .catch(function () {
                  return null;
                })
                .then(function (payload) {
                  if (!payload || payload.ok === false) {
                    showToast((payload && payload.message) || '操作失败', 'error');
                    return false;
                  }
                  state.watchlist = payload.watchlist || [];
                  state.stocks = payload.stocks || [];
                  state.stocksUpdatedAt = new Date().toISOString();
                  renderStocks();
                  showToast(payload.message || '已更新');
                  return true;
                });
            })
            .catch(function () {
              showToast('网络异常，操作未生效', 'error');
              return false;
            });
        }

        /* ================= 看板尺寸 ================= */
        var SIZE_KEY = 'weather-news-board:size:v1';
        var sizeState = { width: null, height: null };
        var saveTimer = 0;

        function applySize() {
          var root = document.documentElement;
          if (sizeState.width) root.style.setProperty('--app-width', sizeState.width + 'px');
          else root.style.removeProperty('--app-width');
          if (sizeState.height) root.style.setProperty('--board-max-h', sizeState.height + 'px');
          else root.style.removeProperty('--board-max-h');
        }

        function saveSize() {
          try {
            localStorage.setItem(
              SIZE_KEY,
              JSON.stringify({ width: sizeState.width, height: sizeState.height }),
            );
          } catch (error) {
            /* 忽略存储失败 */
          }
        }

        function restoreSize() {
          try {
            var raw = localStorage.getItem(SIZE_KEY);
            if (raw) {
              var saved = JSON.parse(raw);
              if (saved && typeof saved === 'object') {
                sizeState.width = typeof saved.width === 'number' ? saved.width : null;
                sizeState.height = typeof saved.height === 'number' ? saved.height : null;
              }
            }
          } catch (error) {
            /* 忽略解析失败 */
          }
          applySize();
        }

        function syncSizePanel() {
          if (!el.sizePanel) return;
          var maxWidth = document.documentElement.clientWidth;
          var maxHeight = Math.max(320, window.innerHeight - 48);
          el.sizeWidth.max = String(maxWidth);
          el.sizeHeight.max = String(maxHeight);
          var width = sizeState.width || maxWidth;
          var height = sizeState.height || maxHeight;
          el.sizeWidth.value = String(Math.min(maxWidth, Math.max(340, width)));
          el.sizeHeight.value = String(Math.min(maxHeight, Math.max(240, height)));
          el.sizeWidthValue.textContent = sizeState.width ? sizeState.width + ' px' : '自动';
          el.sizeHeightValue.textContent = sizeState.height ? sizeState.height + ' px' : '自动';
        }

        function initSizePanel() {
          var btn = el.sizeBtn;
          var panel = el.sizePanel;
          if (!btn || !panel) return;
          btn.addEventListener('click', function (event) {
            event.stopPropagation();
            var willOpen = panel.hidden;
            if (willOpen) syncSizePanel();
            panel.hidden = !willOpen;
          });
          document.addEventListener('click', function (event) {
            if (panel.hidden) return;
            if (panel.contains(event.target) || btn.contains(event.target)) return;
            panel.hidden = true;
          });
          el.sizeWidth.addEventListener('input', function () {
            sizeState.width = Number(el.sizeWidth.value);
            applySize();
            el.sizeWidthValue.textContent = sizeState.width + ' px';
            scheduleWeatherTune();
          });
          el.sizeHeight.addEventListener('input', function () {
            sizeState.height = Number(el.sizeHeight.value);
            applySize();
            el.sizeHeightValue.textContent = sizeState.height + ' px';
            scheduleWeatherTune();
          });
          el.sizeWidth.addEventListener('change', saveSize);
          el.sizeHeight.addEventListener('change', saveSize);
          el.sizeReset.addEventListener('click', function () {
            sizeState.width = null;
            sizeState.height = null;
            applySize();
            saveSize();
            syncSizePanel();
            scheduleWeatherTune();
            showToast('看板尺寸已恢复自适应');
          });
        }

        function showSizeBadge(text) {
          var badge = el.resizeBadge;
          if (!badge) return;
          badge.textContent = text;
          badge.hidden = false;
        }

        function hideSizeBadge() {
          var badge = el.resizeBadge;
          if (badge) badge.hidden = true;
        }

        function initResizeGrip() {
          var grip = el.resizeGrip;
          if (!grip) return;
          var start = null;
          var moved = false;

          function baseWidth() {
            return sizeState.width || document.documentElement.clientWidth;
          }
          function baseHeight() {
            return sizeState.height || Math.round(window.innerHeight * 0.78);
          }

          function onMove(event) {
            if (!start) return;
            var dx = event.clientX - start.x;
            var dy = event.clientY - start.y;
            if (!moved) {
              if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
              moved = true;
            }
            if (event.cancelable) event.preventDefault();
            var maxWidth = document.documentElement.clientWidth;
            var maxHeight = Math.max(320, window.innerHeight - 48);
            sizeState.width = Math.round(Math.min(maxWidth, Math.max(340, start.width + dx)));
            sizeState.height = Math.round(Math.min(maxHeight, Math.max(240, start.height + dy)));
            applySize();
            showSizeBadge(sizeState.width + ' × ' + sizeState.height);
            if (!saveTimer) {
              saveTimer = setTimeout(function () {
                saveTimer = 0;
                saveSize();
              }, 200);
            }
          }

          function onUp() {
            if (!start) return;
            window.removeEventListener('pointermove', onMove, true);
            window.removeEventListener('mousemove', onMove, true);
            window.removeEventListener('pointerup', onUp, true);
            window.removeEventListener('mouseup', onUp, true);
            start = null;
            grip.classList.remove('is-active');
            hideSizeBadge();
            if (moved) {
              saveSize();
            } else {
              // 没有移动视为单击：恢复自适应尺寸。
              sizeState.width = null;
              sizeState.height = null;
              applySize();
              saveSize();
              showToast('看板尺寸已恢复自适应');
              scheduleWeatherTune();
            }
            moved = false;
          }

          function onDown(event) {
            if (typeof event.button === 'number' && event.button !== 0) return;
            event.preventDefault();
            start = { x: event.clientX, y: event.clientY, width: baseWidth(), height: baseHeight() };
            moved = false;
            // 监听挂在 window 上：即使指针捕获在嵌入式面板里失效，
            // 移动事件依然会冒泡到页面，手柄仍能跟手。
            window.addEventListener('pointermove', onMove, true);
            window.addEventListener('mousemove', onMove, true);
            window.addEventListener('pointerup', onUp, true);
            window.addEventListener('mouseup', onUp, true);
            grip.classList.add('is-active');
            showSizeBadge(start.width + ' × ' + start.height);
          }

          grip.addEventListener('pointerdown', onDown);
          grip.addEventListener('mousedown', onDown);
          grip.addEventListener('pointerenter', function () {
            if (!start) showSizeBadge('拖动调整 · 单击复位');
          });
          grip.addEventListener('pointerleave', function () {
            if (!start) hideSizeBadge();
          });
          grip.addEventListener('dblclick', function (event) {
            event.preventDefault();
            sizeState.width = null;
            sizeState.height = null;
            applySize();
            saveSize();
            scheduleWeatherTune();
          });
        }

        /* ================= 状态栏 ================= */
        function updateBrandStatus() {
          var parts = [];
          if (state.weather) parts.push('天气已更新');
          if (state.news) parts.push('新闻已更新');
          if (state.stocks.length) parts.push('行情已更新');
          if (state.weatherStale || state.newsStale) {
            el.brandSub.textContent = '部分来源异常，已保留上一次数据';
          } else if (parts.length) {
            el.brandSub.textContent = parts.join(' · ');
          } else {
            el.brandSub.textContent = '正在加载…';
          }
        }

        /* ================= 定时刷新 ================= */
        var contentTimer = null;
        var quoteTimer = null;

        function scheduleContent() {
          if (contentTimer) clearTimeout(contentTimer);
          if (!state.autoRefresh) return;
          contentTimer = setTimeout(function () {
            loadBoard({ refresh: true }).then(function () {
              updateBrandStatus();
              scheduleContent();
            });
          }, state.interval * 1000);
        }

        function scheduleQuotes() {
          if (quoteTimer) clearTimeout(quoteTimer);
          if (!state.quoteAuto) return;
          quoteTimer = setTimeout(function () {
            loadStocks({ refresh: true }).then(function () {
              updateBrandStatus();
              scheduleQuotes();
            });
          }, state.quoteInterval * 1000);
        }

        function loadBoard(options) {
          state.loading = true;
          el.refreshBtn.classList.add('is-spinning');
          return Promise.all([loadWeather(options), loadNews(options)]).then(function () {
            state.loading = false;
            el.refreshBtn.classList.remove('is-spinning');
            updateBrandStatus();
          });
        }

        /* ================= 事件绑定 ================= */
        el.newsTabs.addEventListener('click', function (event) {
          var button = event.target.closest('.news-tab');
          if (!button) return;
          var key = button.getAttribute('data-source');
          if (!key || key === state.tab) return;
          state.tab = key;
          renderTabs();
          saveViewState();
          loadNews({ refresh: true }).then(updateBrandStatus);
        });

        el.cityForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var value = el.cityInput.value.trim();
          if (!value) return;
          state.city = value;
          state.pick = 0;
          saveViewState();
          loadWeather({ refresh: true }).then(updateBrandStatus);
        });

        el.citySwitch.addEventListener('click', function () {
          if (!state.candidates.length) {
            showToast('没有更多同名城市', 'error');
            return;
          }
          state.pick = (state.pick + 1) % state.candidates.length;
          saveViewState();
          loadWeather({ refresh: true }).then(updateBrandStatus);
        });

        el.stockForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var value = el.stockInput.value.trim();
          if (!value) return;
          mutateWatchlist('add', value).then(function (ok) {
            if (ok) el.stockInput.value = '';
          });
        });

        el.stockList.addEventListener('click', function (event) {
          var button = event.target.closest('.stock-remove');
          if (!button) return;
          var code = button.getAttribute('data-code');
          if (code) mutateWatchlist('remove', code);
        });

        el.autoRefresh.addEventListener('change', function () {
          state.autoRefresh = el.autoRefresh.checked;
          saveViewState();
          scheduleContent();
        });

        el.refreshInterval.addEventListener('change', function () {
          state.interval = Number(el.refreshInterval.value) || 60;
          saveViewState();
          scheduleContent();
        });

        el.quoteAuto.addEventListener('change', function () {
          state.quoteAuto = el.quoteAuto.checked;
          saveViewState();
          scheduleQuotes();
        });

        el.quoteInterval.addEventListener('change', function () {
          state.quoteInterval = Number(el.quoteInterval.value) || 30;
          saveViewState();
          scheduleQuotes();
        });

        el.refreshBtn.addEventListener('click', function () {
          Promise.all([loadBoard({ refresh: true }), loadStocks({ refresh: true })]).then(updateBrandStatus);
        });

        /* ================= 启动 ================= */
        function syncControls() {
          el.autoRefresh.checked = state.autoRefresh;
          el.refreshInterval.value = String(state.interval);
          el.quoteAuto.checked = state.quoteAuto;
          el.quoteInterval.value = String(state.quoteInterval);
          el.cityInput.value = state.city;
        }

        /* 容器宽度变化时重新排布自选股 */
        if (window.ResizeObserver) {
          var stockObserver = new ResizeObserver(function () {
            layoutStockList();
          });
          stockObserver.observe(el.stockList);
          var weatherObserver = new ResizeObserver(function () {
            scheduleWeatherTune();
          });
          if (el.weatherCard) weatherObserver.observe(el.weatherCard);
        }
        window.addEventListener('resize', function () {
          layoutStockList();
          scheduleWeatherTune();
        });

        restoreViewState();
        restoreSize();
        initResizeGrip();
        initSizePanel();
        applyTheme();
        renderTabs();
        syncControls();
        renderWeather();
        renderNews();
        renderStocks();

        loadBoard().then(function () {
          updateBrandStatus();
          scheduleContent();
        });
        loadStocks().then(function () {
          updateBrandStatus();
          scheduleQuotes();
        });
      })();
    </script>
  </body>
</html>
