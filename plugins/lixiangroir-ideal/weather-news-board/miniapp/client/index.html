        };

        /* ================= 工具 ================= */
        function esc(value) {
          return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
        }

        function pad(value) {
          return String(value).padStart(2, '0');
        }

        function fmtNumber(value, decimals) {
          var number = Number(value);
          if (!Number.isFinite(number)) return '--';
          return number.toLocaleString('zh-CN', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals,
          });
        }

        function fmtSigned(value, decimals) {
          var number = Number(value);
          if (!Number.isFinite(number)) return '--';
          var sign = number > 0 ? '+' : number < 0 ? '-' : '';
          return sign + fmtNumber(Math.abs(number), decimals);
        }

        function fmtClock(iso) {
          if (!iso) return '--:--';
          var date = new Date(iso);
          if (Number.isNaN(date.getTime())) return '--:--';
          return pad(date.getHours()) + ':' + pad(date.getMinutes());
        }

        function fmtStamp(iso) {
          if (!iso) return '--/-- --:--';
          var date = new Date(iso);
          if (Number.isNaN(date.getTime())) return '--/-- --:--';
          return (
            pad(date.getMonth() + 1) + '/' + pad(date.getDate()) + ' ' + pad(date.getHours()) + ':' + pad(date.getMinutes())
          );
        }

        function fmtNewsTime(iso) {
          if (!iso) return '';
          var date = new Date(iso);
          if (Number.isNaN(date.getTime())) return '';
          var today = new Date();
          var sameDay =
            date.getFullYear() === today.getFullYear() &&
            date.getMonth() === today.getMonth() &&
            date.getDate() === today.getDate();
          if (sameDay) return pad(date.getHours()) + ':' + pad(date.getMinutes());
          return pad(date.getMonth() + 1) + '/' + pad(date.getDate());
        }

        function fmtHotScore(score) {
          var number = Number(score) || 0;
          if (number >= 100000000) return (number / 100000000).toFixed(1) + '亿';
          if (number >= 10000) return (number / 10000).toFixed(1) + '万';
          return String(number);
        }

        var toastTimer = null;
        function showToast(message, kind) {
          el.toast.textContent = message;
          el.toast.className = 'toast' + (kind === 'error' ? ' is-error' : '');
          el.toast.hidden = false;
          if (toastTimer) clearTimeout(toastTimer);
          toastTimer = setTimeout(function () {
            el.toast.hidden = true;
          }, 2600);
        }

        /* ================= 主题 ================= */
        var media = window.matchMedia('(prefers-color-scheme: dark)');

        function applyTheme() {
          var saved = null;
          try {
            saved = localStorage.getItem(THEME_KEY);
          } catch (error) {
            saved = null;
          }
          var theme = saved || (media.matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          el.themeIcon.innerHTML =
            theme === 'dark'
              ? '<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.3M12 19.1v2.3M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.6 12h2.3M19.1 12h2.3M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/>'
              : '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>';
          el.themeBtn.setAttribute('aria-label', theme === 'dark' ? '切换到浅色主题' : '切换到深色主题');
        }

        el.themeBtn.addEventListener('click', function () {
          var current = document.documentElement.getAttribute('data-theme');
          var next = current === 'dark' ? 'light' : 'dark';
          try {
            localStorage.setItem(THEME_KEY, next);
          } catch (error) {
            /* 忽略存储失败 */
          }
          applyTheme();
        });

        if (media.addEventListener) {
          media.addEventListener('change', function () {
            var saved = null;
            try {
              saved = localStorage.getItem(THEME_KEY);
            } catch (error) {
              saved = null;
            }
            if (!saved) applyTheme();
          });
        }

        /* ================= 视图状态 ================= */
        function saveViewState() {
          try {
            localStorage.setItem(
              VIEW_KEY,
              JSON.stringify({
                tab: state.tab,
                autoRefresh: state.autoRefresh,
                interval: state.interval,
                quoteAuto: state.quoteAuto,
                quoteInterval: state.quoteInterval,
                city: state.city,
                pick: state.pick,
              }),
            );
          } catch (error) {
            /* 忽略存储失败 */
          }
        }

        function restoreViewState() {
          try {
            var raw = localStorage.getItem(VIEW_KEY);
            if (!raw) return;
            var saved = JSON.parse(raw);
            if (saved && typeof saved === 'object') {
              if (TABS.some(function (tab) { return tab.key === saved.tab; })) state.tab = saved.tab;
              if (typeof saved.autoRefresh === 'boolean') state.autoRefresh = saved.autoRefresh;
              if (typeof saved.interval === 'number') state.interval = saved.interval;
              if (typeof saved.quoteAuto === 'boolean') state.quoteAuto = saved.quoteAuto;
              if (typeof saved.quoteInterval === 'number') state.quoteInterval = saved.quoteInterval;
              if (typeof saved.city === 'string' && saved.city) state.city = saved.city;
              if (typeof saved.pick === 'number') state.pick = saved.pick;
            }
          } catch (error) {
            /* 忽略解析失败 */
          }
        }

        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') saveViewState();
        });

        /* ================= 请求 ================= */
        function getJson(url) {
          return fetch(url, { headers: { accept: 'application/json' } }).then(function (response) {
            return response
              .json()
              .catch(function () {
                return null;
              })
              .then(function (payload) {
                if (!payload) throw new Error('bad_response');
                if (!response.ok || payload.ok === false) {
                  var error = new Error(payload.message || '请求失败');
                  error.code = payload.error || 'request_failed';
                  throw error;
                }
                return payload;
              });
          });
        }

        /* ================= 运行时启动 ================= */
        /* 宿主会在页面不可见时停掉运行时（docs/runtime.md 的 Lifecycle 一节），
           页面被重新加载时服务可能还没就绪。网络层的失败——连不上、
           返回的不是 JSON——说明服务没起来，这里做退避重试；
           服务已经就绪、只是某个上游源失败时，交给原来的错误处理。 */
        var STARTUP_RETRY_DELAYS = [400, 800, 1600, 3200, 6400, 10000];
        var startupGraceUntil = 0;
        var startupState = 'ok';
        var serviceEverOk = false;

        function isServiceDown(error) {
          return !(error && error.code);
        }

        function showStartupState(delay) {
          startupState = 'starting';
          if (!el.startupChip) return;
          el.startupChip.hidden = false;
          el.startupChip.textContent =
            '服务启动中… ' + Math.ceil(delay / 1000) + ' 秒后重试';
        }

        /* 重试到头仍然连不上：改成"服务未就绪"，别把提示停在"启动中"上。 */
        function showServiceDownState() {
          startupState = 'down';
          if (!el.startupChip) return;
          el.startupChip.hidden = false;
          el.startupChip.textContent = '服务未就绪，稍后会自动重试';
        }

        function hideStartupState() {
          startupState = 'ok';
          if (!el.startupChip) return;
          el.startupChip.hidden = true;
          el.startupChip.textContent = '服务启动中…';
        }

        /* 取数时若服务还没起来，按退避重试。
           冷启动（还没连上过服务）只在页面打开后的宽限期内重试；
           曾经连上过、后来服务被停掉（宿主会在页面不可见时停进程），
           则一直允许重试，直到重试次数用完或连上为止。 */
        function getJsonResilient(url) {
          var attempt = 0;
          function run() {
            return getJson(url)
              .then(function (payload) {
                serviceEverOk = true;
                if (startupState !== 'ok') hideStartupState();
                return payload;
              })
              .catch(function (error) {
                if (!isServiceDown(error)) throw error;
                var mayRetry =
                  serviceEverOk || Date.now() <= startupGraceUntil;
                if (!mayRetry || attempt >= STARTUP_RETRY_DELAYS.length) {
                  if (startupState !== 'ok') showServiceDownState();
                  throw error;
                }
                var delay = STARTUP_RETRY_DELAYS[attempt];
                attempt += 1;
                showStartupState(delay);
                return new Promise(function (resolve) {
                  setTimeout(resolve, delay);
                }).then(run);
              });
          }
          return run();
        }

        /* 写操作同样要抗住"服务还没起来"。自选股的 add / remove 在服务端
           是幂等的（重复添加只提示"已在自选股中"），所以重试不会重复写。 */
        function postJsonResilient(url, body) {
          var attempt = 0;
          function run() {
            return fetch(url, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body),
            })
              .then(function (response) {
                return response
                  .json()
                  .catch(function () {
                    return null;
                  })
                  .then(function (payload) {
                    if (!payload) throw new Error('bad_response');
                    if (!response.ok || payload.ok === false) {
                      var error = new Error(payload.message || '请求失败');
                      error.code = payload.error || 'request_failed';
                      throw error;
                    }
                    serviceEverOk = true;
                    if (startupState !== 'ok') hideStartupState();
                    return payload;
                  });
              })
              .catch(function (error) {
                if (!isServiceDown(error)) throw error;
                var mayRetry =
                  serviceEverOk || Date.now() <= startupGraceUntil;
                if (!mayRetry || attempt >= STARTUP_RETRY_DELAYS.length) {
                  if (startupState !== 'ok') showServiceDownState();
                  throw error;
                }
                var delay = STARTUP_RETRY_DELAYS[attempt];
                attempt += 1;
                showStartupState(delay);
                return new Promise(function (resolve) {
                  setTimeout(resolve, delay);
                }).then(run);
              });
          }
          return run();
        }

        /* ================= 天气卡自适应 ================= */
        var weatherTuneSig = '';
        var weatherTuneRaf = 0;

        function setHourlyLevel(level) {
          var extra = el.weatherExtra;
          if (!extra) return;
          var blocks = extra.querySelectorAll('.weather-hour');
          for (var i = 0; i < blocks.length; i += 1) {
            blocks[i].hidden = i >= level;
          }
          extra.setAttribute('data-level', String(level));
        }

        /**
         * 卡片内容自然高度（不受拉伸影响）。
         * 这里临时解除行内高度与对齐方式再量，而不是把子元素外边距加起来：
         * margin-top:auto（例如把提示文字贴底）在计算样式里会变成一个
         * 很大的已解析数值，累加进去会让高度越滚越大。
         */
        function naturalHeight(card) {
          if (!card) return 0;
          var prevHeight = card.style.height;
          var prevAlign = card.style.alignSelf;
          card.style.height = 'auto';
          card.style.alignSelf = 'start';
          var height = card.clientHeight;
          card.style.height = prevHeight;
          card.style.alignSelf = prevAlign;
          return height;
        }

        /* 天气主体内容的自然高度 */
        function weatherContentHeight() {
          var inner = el.weatherInner;
          if (!inner) return 0;
          var gap = parseFloat(getComputedStyle(inner).rowGap) || 0;
          var total = 0;
          for (var i = 0; i < inner.children.length; i += 1) {
            var child = inner.children[i];
            var ccs = getComputedStyle(child);
            total +=
              child.offsetHeight +
              (parseFloat(ccs.marginTop) || 0) +
              (parseFloat(ccs.marginBottom) || 0);
            if (i > 0) total += gap;
          }
          return total;
        }

        /* 天气卡除主体以外占用的高度（标题、查询框、内边距） */
        function weatherChrome() {
          var card = el.weatherCard;
          if (!card) return 0;
          var cs = getComputedStyle(card);
          var total = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
          var head = card.querySelector('.card-head');
          var form = card.querySelector('.city-form');
          if (head) {
            var hs = getComputedStyle(head);
            total += head.offsetHeight + (parseFloat(hs.marginBottom) || 0);
          }
          if (form) {
            var fs = getComputedStyle(form);
            total += form.offsetHeight + (parseFloat(fs.marginBottom) || 0);
          }
          return total;
        }

        function scheduleWeatherTune() {
          if (weatherTuneRaf) return;
          weatherTuneRaf = window.requestAnimationFrame(function () {
            weatherTuneRaf = 0;
            tuneWeatherCard();
          });
        }

        /**
         * 自选股卡的目标高度：手动指定时用指定值，否则用内容自然高度。
         */
        function stocksTargetHeight() {
          var card = el.stocksCard;
          if (!card) return 0;
          if (cardSizes.stocks.h) return cardSizes.stocks.h;
          return naturalHeight(card);
        }

        /**
         * 三栏排布时 grid 不会拉伸卡片，这里显式让天气卡与自选股卡保持等高：
         * 以两张卡自然高度的较大值为准，多出来的空间由逐时预报填满。
         * 两栏时由 grid 的 stretch 完成，用户手动指定过高度时以用户为准。
         */
        function alignWeatherHeight() {
          var card = el.weatherCard;
          var stocks = el.stocksCard;
          if (!card || !stocks) return;
          if (layoutColumns() < 3) {
            clearAlignedHeights();
            return;
          }
          var target = Math.max(naturalHeight(card), naturalHeight(stocks));
          if (target <= 0) {
            clearAlignedHeights();
            return;
          }
          card.style.height = target + 'px';
          stocks.style.height = target + 'px';
        }

        function clearAlignedHeights() {
          if (el.weatherCard) el.weatherCard.style.removeProperty('height');
          if (el.stocksCard) el.stocksCard.style.removeProperty('height');
        }

        /**
         * 天气卡与自选股卡并排时高度对齐：先按自选股卡的高度挑出
         * 能放下的逐时预报档位，再由两卡共同决定这一行的最终高度。
         * 手动指定了高度时以指定高度为准，逐时预报全部列出，卡片内部滚动。
         */
        function tuneWeatherCard() {
          var card = el.weatherCard;
          var inner = el.weatherInner;
          var extra = el.weatherExtra;
          if (!card || !inner || !extra) return;
          var blocks = extra.querySelectorAll('.weather-hour');
          var max = blocks.length;
          if (!max) {
            extra.hidden = true;
            return;
          }
          extra.hidden = false;

          var manualH = cardSizes.weather.h || 0;
          // 自选股卡的高度也要进签名：它加载完成后天气卡需要重新对齐。
          var stocksH = el.stocksCard
            ? Math.round(el.stocksCard.getBoundingClientRect().height)
            : 0;
          var cols = layoutColumns();
          var sig =
            card.clientWidth +
            'x' +
            card.clientHeight +
            '#' +
            (extra.getAttribute('data-level') || '0') +
            '#' +
            manualH +
            '#' +
            cols +
            '#' +
            stocksH;
          if (sig === weatherTuneSig) return;

          // 用户手动指定过任一张卡片的高度：以用户为准，逐时预报全部列出。
          if (manualH || cardSizes.stocks.h) {
            setHourlyLevel(max);
            clearAlignedHeights();
            weatherTuneSig =
              card.clientWidth + 'x' + card.clientHeight + '#' + max + '#' + manualH + '#' + cols + '#' + stocksH;
            return;
          }

          // 单栏堆叠：两张卡各占一行，高度由内容决定。
          if (cols < 2) {
            setHourlyLevel(max);
            clearAlignedHeights();
            weatherTuneSig =
              card.clientWidth + 'x' + card.clientHeight + '#' + max + '#0#' + cols + '#' + stocksH;
            return;
          }

          weatherTuneSig = sig;
          var level = max;
          if (cols === 2) {
            // 两栏：挑出放得下的逐时预报档位，多出来的空间由它填满。
            var chrome = weatherChrome();
            var target = stocksTargetHeight();
            level = 0;
            for (var k = max; k >= 0; k -= 1) {
              setHourlyLevel(k);
              if (!target || chrome + weatherContentHeight() <= target) {
                level = k;
                break;
              }
            }
            // 一行都放不下时也留一行，逐时预报不会整个消失；
            // 卡片会随之比自选股卡高一点，grid 会把两卡拉齐。
            if (level === 0 && max > 0) level = 1;
          }
          setHourlyLevel(level);
          alignWeatherHeight();
          weatherTuneSig =
            card.clientWidth + 'x' + card.clientHeight + '#' + level + '#0#' + cols + '#' + stocksH;
        }

        /* ================= 天气 ================= */
        function renderWeather() {
          var data = state.weather;
          var inner = el.weatherInner;
          if (!inner) return;
          if (!data) {
            inner.innerHTML = '<p class="list-empty">天气来源暂不可用，请稍后重试或更换城市。</p>';
            el.weatherExtra = null;
            weatherTuneSig = '';
            return;
          }
          var current = data.current || {};
          var html = '';
          html +=
            '<div class="weather-main">' +
            weatherSvg(current.icon, 'weather-icon') +
            '<div><div class="weather-temp">' +
            esc(Math.round(Number(current.temp) || 0)) +
            '°</div></div></div>';
          html +=
            '<div class="weather-desc">' +
            esc(current.desc || '') +
            ' · ' +
            esc(data.city || '') +
            (data.region ? ' · ' + esc(data.region) : '') +
            '</div>';

          html += '<div class="weather-metrics">';
          html +=
            '<div class="metric"><span class="metric-label">体感温度</span><span class="metric-value">' +
            esc(Math.round(Number(current.feels) || 0)) +
            '°</span></div>';
          html +=
            '<div class="metric"><span class="metric-label">湿度</span><span class="metric-value">' +
            esc(Math.round(Number(current.humidity) || 0)) +
            '%</span></div>';
          html +=
            '<div class="metric"><span class="metric-label">风速</span><span class="metric-value">' +
            esc(Math.round(Number(current.windSpeed) || 0)) +
            ' km/h</span></div>';
          html += '</div>';

          html += '<div class="weather-forecast">';
          (data.forecast || []).forEach(function (day) {
            var probability = Math.max(0, Math.min(100, Number(day.probability) || 0));
            html +=
              '<div class="forecast-item">' +
              '<div class="forecast-line">' +
              '<span class="forecast-day">' +
              esc(day.label || '') +
              '</span>' +
              weatherSvg(day.icon, 'forecast-icon') +
              '<span class="forecast-temp"><b>' +
              esc(Math.round(Number(day.high) || 0)) +
              '°</b> / <i>' +
              esc(Math.round(Number(day.low) || 0)) +
              '°</i></span>' +
              '</div>' +
              '<div class="forecast-bar"><span class="forecast-bar-fill" style="width:' +
              probability +
              '%"></span></div>' +
              '<div class="forecast-rain">降水概率 ' +
              probability +
              '%</div>' +
              '</div>';
          });
          html += '</div>';

          if (state.weatherStale) {
            html += '<p class="forecast-rain">来源异常，已保留上一次数据</p>';
          }

          var hourly = data.hourly || [];
          if (hourly.length) {
            html += '<div class="weather-hourly">';
            hourly.forEach(function (slot) {
              var dayLabel = slot.day && slot.day !== '今天' ? slot.day : '';
              html +=
                '<div class="weather-hour">' +
                '<span class="hour-time">' +
                (dayLabel ? '<span class="hour-day">' + esc(dayLabel) + '</span>' : '') +
                esc(slot.time || '') +
                '</span>' +
                weatherSvg(slot.icon, 'hour-icon') +
                '<span class="hour-temp">' +
                esc(Math.round(Number(slot.temp) || 0)) +
                '°</span>' +
                '<span class="hour-desc">' +
                esc(slot.desc || '') +
                '</span>' +
                '<span class="hour-rain">降水 ' +
                esc(Math.max(0, Math.min(100, Number(slot.probability) || 0))) +
                '%</span>' +
                '</div>';
            });
            html += '</div>';
          }

          inner.innerHTML = html;
          el.weatherExtra = inner.querySelector('.weather-hourly');
          weatherTuneSig = '';
          scheduleWeatherTune();
        }

        function loadWeather(options) {
          var refresh = options && options.refresh ? '1' : '0';
          var params = new URLSearchParams({
            source: 'weather',
            city: state.city,
            pick: String(state.pick),
            refresh: refresh,
          });
          return getJsonResilient('/api/board?' + params.toString())
            .then(function (payload) {
              if (payload.data) {
                state.weather = payload.data;
                state.candidates = payload.data.candidates || [];
                if (typeof payload.data.index === 'number') state.pick = payload.data.index;
                state.weatherStale = Boolean(payload.stale);
              } else {
                state.weather = null;
                state.weatherStale = true;
              }
              renderWeather();
            })
            .catch(function () {
              state.weather = null;
              state.weatherStale = true;
              renderWeather();
            });
        }

        /* ================= 新闻 ================= */
        function renderTabs() {
          el.newsTabs.innerHTML = TABS.map(function (tab) {
            var selected = tab.key === state.tab;
            return (
              '<button class="news-tab" type="button" role="tab" id="tab-' +
              tab.key +
              '" data-source="' +
              tab.key +
              '" aria-selected="' +
              (selected ? 'true' : 'false') +
              '" tabindex="' +
              (selected ? '0' : '-1') +
              '">' +
              esc(tab.label) +
              '</button>'
            );
          }).join('');
          el.newsList.setAttribute('aria-labelledby', 'tab-' + state.tab);
        }

        function renderNews() {
          var data = state.news;
          var badge = el.newsBadge;
          if (!data) {
            el.newsList.innerHTML = '<li class="list-empty">暂无内容，请稍后重试。</li>';
            el.newsUpdated.textContent = '更新于 --/-- --:--';
            badge.textContent = '暂无数据';
            badge.className = 'status-badge is-warn';
            return;
          }

          var items = data.items || [];
          if (state.tab === 'hot') {
            el.newsList.innerHTML = items
              .map(function (item) {
                return (
                  '<li class="hot-item">' +
                  '<span class="hot-rank">' +
                  esc(item.rank) +
                  '</span>' +
                  '<a class="hot-title" href="' +
                  esc(item.url || '#') +
                  '" target="_blank" rel="noopener noreferrer">' +
                  esc(item.title) +
                  '</a>' +
                  '<span class="hot-score">' +
                  esc(fmtHotScore(item.score)) +
                  '</span>' +
                  '</li>'
                );
              })
              .join('');
          } else {
            el.newsList.innerHTML = items
              .map(function (item) {
                var time = fmtNewsTime(item.publishedAt);
                return (
                  '<li class="news-item">' +
                  '<a class="news-title" href="' +
                  esc(item.url || '#') +
                  '" target="_blank" rel="noopener noreferrer">' +
                  esc(item.title) +
                  '</a>' +
                  (item.description
                    ? '<p class="news-desc">' + esc(item.description) + '</p>'
                    : '') +
                  '<div class="news-meta">' +
                  '<span class="news-source"><i class="source-dot"></i>' +
                  esc(item.source || '') +
                  '</span>' +
                  (time ? '<time class="news-time">' + esc(time) + '</time>' : '') +
                  '</div>' +
                  '</li>'
                );
              })
              .join('');
          }

          if (!items.length) {
            el.newsList.innerHTML = '<li class="list-empty">该栏目暂时没有内容。</li>';
          }

          el.newsUpdated.textContent = '更新于 ' + fmtStamp(state.newsUpdatedAt);
          if (state.newsStale) {
            badge.textContent = '来源异常';
            badge.className = 'status-badge is-warn';
          } else {
            badge.textContent = '全部来源正常';
            badge.className = 'status-badge is-ok';
          }
        }

        function loadNews(options) {
          var refresh = options && options.refresh ? '1' : '0';
          var params = new URLSearchParams({ source: state.tab, refresh: refresh });
          return getJsonResilient('/api/board?' + params.toString())
            .then(function (payload) {
              state.news = payload.data;
              state.newsStale = Boolean(payload.stale);
              state.newsUpdatedAt = payload.updatedAt || (payload.data && payload.data.updatedAt) || null;
              renderNews();
            })
            .catch(function () {
              state.news = null;
              state.newsStale = true;
              renderNews();
            });
        }

        /* ================= 自选股 ================= */
        var STOCK_MIN_COL = 150;
        var STOCK_COL_GAP = 8;

        /**
         * 按可用宽度与条目总数计算最优列数。
         * 先保证行数最少；行数相同时选择末行留白更少的方案，
         * 使全部条目在任意容器宽度下都能完整排布。
         */
        function layoutStockList() {
          var list = el.stockList;
          var count = list.children.length;
          var width = list.clientWidth;
          if (!count || !width) {
            list.style.gridTemplateColumns = '';
            return;
          }
          var maxCols = Math.max(
            1,
            Math.floor((width + STOCK_COL_GAP) / (STOCK_MIN_COL + STOCK_COL_GAP)),
          );
          var limit = Math.min(maxCols, count);
          var best = 1;
          var bestRows = Infinity;
          var bestEmpty = Infinity;
          for (var cols = limit; cols >= 1; cols -= 1) {
            var rows = Math.ceil(count / cols);
            var empty = cols * rows - count;
            if (rows < bestRows) {
              bestRows = rows;
              bestEmpty = empty;
              best = cols;
            } else if (rows === bestRows && empty < bestEmpty) {
              bestEmpty = empty;
              best = cols;
            }
          }
          var next = 'repeat(' + best + ', minmax(0, 1fr))';
          if (list.style.gridTemplateColumns !== next) list.style.gridTemplateColumns = next;
        }

        function renderStocksSummary() {
          var box = el.stocksSummary;
          if (!box) return;
          var up = 0;
          var down = 0;
          var flat = 0;
          (state.stocks || []).forEach(function (item) {
            if (item.error) return;
            var change = Number(item.change) || 0;
            if (change > 0) up += 1;
            else if (change < 0) down += 1;
            else flat += 1;
          });
          var total = up + down + flat;
          if (!total) {
            box.innerHTML = '';
            return;
          }
          var html = '<span class="summary-item">' + total + ' 项</span>';
          if (up) html += '<span class="summary-item is-up">涨 ' + up + '</span>';
          if (down) html += '<span class="summary-item is-down">跌 ' + down + '</span>';
          if (flat) html += '<span class="summary-item">平 ' + flat + '</span>';
          box.innerHTML = html;
        }

        function renderStocks() {
          var items = state.stocks.length
            ? state.stocks
            : state.watchlist.map(function (code) {
                return { code: code, error: 'quote_unavailable' };
              });

          if (!items.length) {
            el.stockList.innerHTML =
              '<li class="stock-empty">还没有自选股。输入 6 位 A 股代码，或输入「黄金」「原油」等品种名称后点击「添加」。</li>';
            layoutStockList();
            renderStocksSummary();
            scheduleWeatherTune();
            return;
          }

          el.stockList.innerHTML = items
            .map(function (item) {
              if (item.error) {
                return (
                  '<li class="stock-row">' +
                  '<div class="stock-top"><span class="stock-name">' +
                  esc(item.code) +
                  '</span>' +
                  '<button class="stock-remove" type="button" data-code="' +
                  esc(item.code) +
                  '" aria-label="移除 ' +
                  esc(item.code) +
                  '">' +
                  REMOVE_ICON +
                  '</button></div>' +
                  '<div class="stock-bottom"><span class="stock-error">行情暂不可用，稍后自动重试</span></div>' +
                  '</li>'
                );
              }
              var change = Number(item.change) || 0;
              var percent = Number(item.changePercent) || 0;
              var direction = change > 0 ? 'up' : change < 0 ? 'down' : 'flat';
              var arrow = direction === 'up' ? TRI_UP : direction === 'down' ? TRI_DOWN : TRI_FLAT;
              var decimals = typeof item.decimals === 'number' ? item.decimals : 2;
              var title = item.title ? ' title="' + esc(item.title) + '"' : '';
              return (
                '<li class="stock-row"' +
                title +
                '>' +
                '<div class="stock-top">' +
                '<span class="stock-name">' +
                esc(item.name || item.code) +
                '</span>' +
                '<span class="stock-code">' +
                esc(item.code) +
                '</span>' +
                '<button class="stock-remove" type="button" data-code="' +
                esc(item.code) +
                '" aria-label="移除 ' +
                esc(item.name || item.code) +
                '">' +
                REMOVE_ICON +
                '</button></div>' +
                '<div class="stock-bottom">' +
                '<span class="stock-quote"><span class="stock-price">' +
                esc(fmtNumber(item.price, decimals)) +
                '</span>' +
                (item.unit ? '<span class="stock-unit">' + esc(item.unit) + '</span>' : '') +
                '</span>' +
                '<span class="stock-deltas">' +
                '<span class="stock-delta ' +
                direction +
                '">' +
                arrow +
                esc(fmtSigned(change, decimals)) +
                '</span>' +
                '<span class="stock-delta ' +
                direction +
                '">' +
                arrow +
                esc(fmtSigned(percent, 2)) +
                '%</span>' +
                '</span>' +
                '</div>' +
                '</li>'
              );
            })
            .join('');

          el.stocksUpdated.textContent = '更新 ' + fmtClock(state.stocksUpdatedAt);
          layoutStockList();
          renderStocksSummary();
          scheduleWeatherTune();
        }

        var REMOVE_ICON =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>';

        function loadStocks(options) {
          var refresh = options && options.refresh ? '1' : '0';
          var params = new URLSearchParams({ refresh: refresh });
          return getJsonResilient('/api/stocks?' + params.toString())
            .then(function (payload) {
              state.watchlist = payload.watchlist || [];
              state.stocks = payload.stocks || [];
              state.stocksUpdatedAt = payload.updatedAt || null;
              renderStocks();
            })
            .catch(function () {
              renderStocks();
            });
        }

        function mutateWatchlist(action, code) {
          return postJsonResilient('/api/watchlist', { action: action, code: code })
            .then(function (payload) {
              state.watchlist = payload.watchlist || [];
              state.stocks = payload.stocks || [];
              state.stocksUpdatedAt = new Date().toISOString();
              renderStocks();
              showToast(payload.message || '已更新');
              return true;
            })
            .catch(function (error) {
              if (isServiceDown(error)) {
                showToast('服务未就绪，操作未生效，请稍后重试', 'error');
                return false;
              }
              showToast((error && error.message) || '操作失败', 'error');
              return false;
            });
        }

        /* ================= 卡片尺寸 ================= */
        var SIZES_KEY = 'weather-news-board:sizes:v1';
        var LEGACY_SIZE_KEY = 'weather-news-board:size:v1';
        var CARD_KEYS = ['weather', 'stocks', 'news'];
        /* 拖动尺寸时的边界 */
        var MIN_CARD_W = 260;
        var MIN_CARD_H = 220;
        var MAX_CARD_H = 1600;
        var BOARD_GAP = 16;

        var cardSizes = {
          weather: { w: null, h: null },
          stocks: { w: null, h: null },
          news: { w: null, h: null },
        };
        var sizeSaveTimer = 0;

        function cardElement(key) {
          return document.querySelector('.card[data-card="' + key + '"]');
        }

        function boardWidth() {
          return el.board ? el.board.clientWidth : 0;
        }

        /* 当前排布下的列数：1 栏堆叠 / 2 栏 / 3 栏 */
        function layoutColumns() {
          var w = boardWidth();
          if (w < 560) return 1;
          if (w < 900) return 2;
          return 3;
        }

        /* 当前排布下每一行放了哪些卡片：同一行的宽度加起来不能超过看板宽度 */
        function layoutRows() {
          var cols = layoutColumns();
          if (cols === 1) return [['weather'], ['stocks'], ['news']];
          if (cols === 2) return [['weather', 'stocks'], ['news']];
          return [['weather', 'stocks', 'news']];
        }

        /**
         * 某张卡片允许的最大宽度：同一行里其它卡片按各自当前的宽度让出空间。
         * 兄弟卡片如果也被手动指定过宽度，就按它实际占的宽度算，
         * 否则整行加起来会超出看板宽度，右侧会被裁掉且滚不到。
         */
        function maxCardWidth(key) {
          var w = boardWidth();
          if (!w) return MIN_CARD_W;
          var cols = layoutColumns();
          if (cols === 1) return w;
          var row = null;
          layoutRows().forEach(function (r) {
            if (r.indexOf(key) >= 0) row = r;
          });
          if (!row) return w;
          var others = 0;
          row.forEach(function (k) {
            if (k === key) return;
            /* 兄弟卡片各留出最小宽度：这样逐张算出来的上限与处理顺序无关，
               不会因为先处理哪一张就把另一张压到下限 */
            others += MIN_CARD_W;
          });
          var gaps = BOARD_GAP * (row.length - 1);
          return Math.max(MIN_CARD_W, w - gaps - others);
        }

        /**
         * 同一行的手动宽度加起来可能超出看板宽度，这里按比例收回。
         * 溢出量按渲染结果测量，和浏览器实际的轨道分配保持一致；
         * 多张卡一样宽时按各自宽度分摊，不偏向行里的第一张。
         * keepKey 是正在拖动的那张卡：先让兄弟卡片让出空间，兄弟都到底了才动它自己。
         */
        function fitCardWidths(keepKey) {
          var w = boardWidth();
          if (!w) return false;
          var changed = false;
          var floor = Math.min(MIN_CARD_W, w);
          layoutRows().forEach(function (row) {
            var guard = 0;
            while (guard < 12) {
              guard += 1;
              var total = 0;
              row.forEach(function (key) {
                var card = cardElement(key);
                if (card) total += card.getBoundingClientRect().width;
              });
              var over = total + BOARD_GAP * (row.length - 1) - w;
              if (over <= 0) break;
              var pool = row.filter(function (key) {
                var size = cardSizes[key];
                return size.w && size.w > floor && !(keepKey && key === keepKey);
              });
              if (!pool.length) {
                pool = row.filter(function (key) {
                  var size = cardSizes[key];
                  return size.w && size.w > floor;
                });
              }
              if (!pool.length) break;
              var sum = 0;
              pool.forEach(function (key) {
                sum += cardSizes[key].w;
              });
              var progressed = false;
              pool.forEach(function (key) {
                var size = cardSizes[key];
                var share = over * (size.w / sum);
                var next = Math.max(floor, Math.round(size.w - share));
                if (next < size.w) {
                  size.w = next;
                  changed = true;
                  progressed = true;
                }
              });
              if (!progressed) break;
              /* 收到新宽度后重新布局，下一轮才能量到真实溢出 */
              applyCardSizes();
            }
          });
          return changed;
        }

        function applyCardSizes() {
          var board = el.board;
          if (!board) return;
          var customized = false;
          CARD_KEYS.forEach(function (key) {
            var card = cardElement(key);
            var size = cardSizes[key];
            if (!card) return;
            if (size.w) {
              card.style.setProperty('--cw', size.w + 'px');
              card.classList.add('is-sized-w');
              board.style.setProperty('--col-' + key, size.w + 'px');
              customized = true;
            } else {
              card.style.removeProperty('--cw');
              card.classList.remove('is-sized-w');
              board.style.removeProperty('--col-' + key);
            }
            if (size.h) {
              card.style.setProperty('--ch', size.h + 'px');
              card.classList.add('is-sized-h');
              customized = true;
            } else {
              card.style.removeProperty('--ch');
              card.classList.remove('is-sized-h');
            }
            // 等高对齐用的行内高度由 alignWeatherHeight 统一管理，
            // 这里先清掉，免得盖住用户自己指定的高度。
            if (key === 'weather' || key === 'stocks') card.style.removeProperty('height');
          });
          if (el.resetSizes) el.resetSizes.hidden = !customized;
        }

        function saveCardSizes() {
          try {
            localStorage.setItem(SIZES_KEY, JSON.stringify(cardSizes));
            localStorage.removeItem(LEGACY_SIZE_KEY);
          } catch (error) {
            /* 忽略存储失败 */
          }
        }

        function restoreCardSizes() {
          try {
            var raw = localStorage.getItem(SIZES_KEY);
            if (raw) {
              var saved = JSON.parse(raw);
              if (saved && typeof saved === 'object') {
                CARD_KEYS.forEach(function (key) {
                  var item = saved[key];
                  if (item && typeof item === 'object') {
                    cardSizes[key].w = typeof item.w === 'number' ? item.w : null;
                    cardSizes[key].h = typeof item.h === 'number' ? item.h : null;
                  }
                });
              }
            }
            localStorage.removeItem(LEGACY_SIZE_KEY);
          } catch (error) {
            /* 忽略解析失败 */
          }
          applyCardSizes();
          /* 读取时的尺寸同样要夹紧，避免旧数据把卡片压扁或撑爆 */
          clampCardSizes();
        }

        /* 容器变窄后，之前记住的尺寸可能放不下，这里夹紧宽与高 */
        function clampCardSizes() {
          var changed = false;
          CARD_KEYS.forEach(function (key) {
            var size = cardSizes[key];
            if (size.w) {
              var maxW = maxCardWidth(key);
              var minW = Math.min(MIN_CARD_W, boardWidth());
              if (size.w > maxW) {
                size.w = Math.round(maxW);
                changed = true;
              }
              if (size.w < minW) {
                size.w = Math.round(minW);
                changed = true;
              }
            }
            if (size.h) {
              if (size.h > MAX_CARD_H) {
                size.h = MAX_CARD_H;
                changed = true;
              }
              if (size.h < MIN_CARD_H) {
                size.h = MIN_CARD_H;
                changed = true;
              }
            }
          });
          /* 先把逐张夹紧的结果落到布局上，再按实际渲染结果收敛整行 */
          if (changed) applyCardSizes();
          /* 同一行的手动宽度加起来不能超出看板宽度，超出时按比例收回来 */
          if (fitCardWidths()) changed = true;
          if (changed) {
            applyCardSizes();
            saveCardSizes();
          }
        }

        function resetCardSize(key) {
          cardSizes[key].w = null;
          cardSizes[key].h = null;
          applyCardSizes();
          saveCardSizes();
          scheduleWeatherTune();
        }

        function showSizeBadge(text, x, y) {
          var badge = el.resizeBadge;
          if (!badge) return;
          badge.textContent = text;
          badge.hidden = false;
          if (typeof x === 'number' && typeof y === 'number') {
            badge.style.left = Math.max(4, Math.min(window.innerWidth - 120, x + 14)) + 'px';
            badge.style.top = Math.max(4, Math.min(window.innerHeight - 32, y + 14)) + 'px';
          }
        }

        function hideSizeBadge() {
          var badge = el.resizeBadge;
          if (badge) badge.hidden = true;
        }

        function bindCardGrip(grip) {
          var card = grip.closest('.card');
          if (!card) return;
          var key = card.getAttribute('data-card');
          var title = card.getAttribute('data-title') || '';
          var start = null;
          var moved = false;

          function onMove(event) {
            if (!start) return;
            var dx = event.clientX - start.x;
            var dy = event.clientY - start.y;
            if (!moved) {
              if (Math.abs(dx) < 3 && Math.abs(dy) < 3) return;
              moved = true;
            }
            if (event.cancelable) event.preventDefault();
            var minW = Math.min(MIN_CARD_W, boardWidth());
            var w = Math.round(Math.max(minW, event.clientX - start.left));
            var h = Math.round(
              Math.min(MAX_CARD_H, Math.max(MIN_CARD_H, event.clientY - start.top)),
            );
            cardSizes[key].w = w;
            cardSizes[key].h = h;
            /* 先落到布局上，再按实际渲染结果收敛：同一行的总宽度不能超出看板，
               先让兄弟卡片让出空间，实在放不下才收这张 */
            applyCardSizes();
            fitCardWidths(key);
            applyCardSizes();
            /* 提示上的尺寸用实际生效的宽度，而不是夹紧之前的那个 */
            showSizeBadge(cardSizes[key].w + ' × ' + cardSizes[key].h, event.clientX, event.clientY);
            if (!sizeSaveTimer) {
              sizeSaveTimer = setTimeout(function () {
                sizeSaveTimer = 0;
                saveCardSizes();
              }, 200);
            }
          }

          function onUp() {
            if (!start) return;
            window.removeEventListener('pointermove', onMove, true);
            window.removeEventListener('mousemove', onMove, true);
            window.removeEventListener('pointerup', onUp, true);
            window.removeEventListener('mouseup', onUp, true);
            start = null;
            grip.classList.remove('is-active');
            hideSizeBadge();
            if (moved) {
              saveCardSizes();
            } else {
              // 没有移动视为单击：这张卡片恢复自适应。
              resetCardSize(key);
              showToast('「' + title + '」已恢复自适应');
            }
            moved = false;
          }

          function onDown(event) {
            if (typeof event.button === 'number' && event.button !== 0) return;
            event.preventDefault();
            var rect = card.getBoundingClientRect();
            start = { x: event.clientX, y: event.clientY, left: rect.left, top: rect.top };
            moved = false;
            // 监听挂在 window 上：即使指针捕获在嵌入式面板里失效，
            // 移动事件依然会冒泡到页面，手柄仍能跟手。
            window.addEventListener('pointermove', onMove, true);
            window.addEventListener('mousemove', onMove, true);
            window.addEventListener('pointerup', onUp, true);
            window.addEventListener('mouseup', onUp, true);
            grip.classList.add('is-active');
            showSizeBadge(
              Math.round(rect.width) + ' × ' + Math.round(rect.height),
              event.clientX,
              event.clientY,
            );
          }

          grip.addEventListener('pointerdown', onDown);
          grip.addEventListener('mousedown', onDown);
          grip.addEventListener('pointerenter', function () {
            if (start) return;
            var rect = card.getBoundingClientRect();
            showSizeBadge(
              title + ' ' + Math.round(rect.width) + ' × ' + Math.round(rect.height) + ' · 拖动调整',
              rect.right - 110,
              rect.bottom - 34,
            );
          });
          grip.addEventListener('pointerleave', function () {
            if (!start) hideSizeBadge();
          });
        }

        function initCardGrips() {
          var grips = document.querySelectorAll('.card-grip');
          for (var i = 0; i < grips.length; i += 1) {
            bindCardGrip(grips[i]);
          }
          if (el.resetSizes) {
            el.resetSizes.addEventListener('click', function () {
              CARD_KEYS.forEach(function (key) {
                cardSizes[key].w = null;
                cardSizes[key].h = null;
              });
              applyCardSizes();
              saveCardSizes();
              scheduleWeatherTune();
              showToast('所有子看板已恢复自适应');
            });
          }
        }

        /* ================= 状态栏 ================= */
        function updateBrandStatus() {
          var parts = [];
          if (state.weather) parts.push('天气已更新');
          if (state.news) parts.push('新闻已更新');
          if (state.stocks.length) parts.push('行情已更新');
          if (state.weatherStale || state.newsStale) {
            el.brandSub.textContent = '部分来源异常，已保留上一次数据';
          } else if (parts.length) {
            el.brandSub.textContent = parts.join(' · ');
          } else {
            el.brandSub.textContent = '正在加载…';
          }
        }

        /* ================= 定时刷新 ================= */
        var contentTimer = null;
        var quoteTimer = null;

        function scheduleContent() {
          if (contentTimer) clearTimeout(contentTimer);
          if (!state.autoRefresh) return;
          contentTimer = setTimeout(function () {
            loadBoard({ refresh: true }).then(function () {
              updateBrandStatus();
              scheduleContent();
            });
          }, state.interval * 1000);
        }

        function scheduleQuotes() {
          if (quoteTimer) clearTimeout(quoteTimer);
          if (!state.quoteAuto) return;
          quoteTimer = setTimeout(function () {
            loadStocks({ refresh: true }).then(function () {
              updateBrandStatus();
              scheduleQuotes();
            });
          }, state.quoteInterval * 1000);
        }

        function loadBoard(options) {
          state.loading = true;
          el.refreshBtn.classList.add('is-spinning');
          return Promise.all([loadWeather(options), loadNews(options)]).then(function () {
            state.loading = false;
            el.refreshBtn.classList.remove('is-spinning');
            updateBrandStatus();
          });
        }

        /* ================= 事件绑定 ================= */
        el.newsTabs.addEventListener('click', function (event) {
          var button = event.target.closest('.news-tab');
          if (!button) return;
          var key = button.getAttribute('data-source');
          if (!key || key === state.tab) return;
          state.tab = key;
          renderTabs();
          saveViewState();
          loadNews({ refresh: true }).then(updateBrandStatus);
        });

        el.cityForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var value = el.cityInput.value.trim();
          if (!value) return;
          state.city = value;
          state.pick = 0;
          saveViewState();
          loadWeather({ refresh: true }).then(updateBrandStatus);
        });

        el.citySwitch.addEventListener('click', function () {
          if (!state.candidates.length) {
            showToast('没有更多同名城市', 'error');
            return;
          }
          state.pick = (state.pick + 1) % state.candidates.length;
          saveViewState();
          loadWeather({ refresh: true }).then(updateBrandStatus);
        });

        el.stockForm.addEventListener('submit', function (event) {
          event.preventDefault();
          var value = el.stockInput.value.trim();
          if (!value) return;
          mutateWatchlist('add', value).then(function (ok) {
            if (ok) el.stockInput.value = '';
          });
        });

        el.stockList.addEventListener('click', function (event) {
          var button = event.target.closest('.stock-remove');
          if (!button) return;
          var code = button.getAttribute('data-code');
          if (code) mutateWatchlist('remove', code);
        });

        el.autoRefresh.addEventListener('change', function () {
          state.autoRefresh = el.autoRefresh.checked;
          saveViewState();
          scheduleContent();
        });

        el.refreshInterval.addEventListener('change', function () {
          state.interval = Number(el.refreshInterval.value) || 60;
          saveViewState();
          scheduleContent();
        });

        el.quoteAuto.addEventListener('change', function () {
          state.quoteAuto = el.quoteAuto.checked;
          saveViewState();
          scheduleQuotes();
        });

        el.quoteInterval.addEventListener('change', function () {
          state.quoteInterval = Number(el.quoteInterval.value) || 30;
          saveViewState();
          scheduleQuotes();
        });

        el.refreshBtn.addEventListener('click', function () {
          Promise.all([loadBoard({ refresh: true }), loadStocks({ refresh: true })]).then(updateBrandStatus);
        });

        /* ================= 启动 ================= */
        function syncControls() {
          el.autoRefresh.checked = state.autoRefresh;
          el.refreshInterval.value = String(state.interval);
          el.quoteAuto.checked = state.quoteAuto;
          el.quoteInterval.value = String(state.quoteInterval);
          el.cityInput.value = state.city;
        }

        /* 容器宽度变化时重新排布自选股 */
        if (window.ResizeObserver) {
          var stockObserver = new ResizeObserver(function () {
            layoutStockList();
          });
          stockObserver.observe(el.stockList);
          var weatherObserver = new ResizeObserver(function () {
            scheduleWeatherTune();
          });
          if (el.weatherCard) weatherObserver.observe(el.weatherCard);
          // 自选股卡高度变化时，天气卡的对齐要重新算一次。
          var stocksObserver = new ResizeObserver(function () {
            scheduleWeatherTune();
          });
          if (el.stocksCard) stocksObserver.observe(el.stocksCard);
          // 看板的可用宽度变了（面板变窄，或者内容变高后出现竖向滚动条、
          // 可用宽度少掉十几像素），手动指定的宽度要重新收敛一次。
          var lastBoardWidth = boardWidth();
          var boardObserver = new ResizeObserver(function () {
            var w = boardWidth();
            if (!w || w === lastBoardWidth) return;
            lastBoardWidth = w;
            clampCardSizes();
            scheduleWeatherTune();
          });
          if (el.board) boardObserver.observe(el.board);
        }
        window.addEventListener('resize', function () {
          clampCardSizes();
          layoutStockList();
          scheduleWeatherTune();
        });

        restoreViewState();
        restoreCardSizes();
        initCardGrips();
        applyTheme();
        renderTabs();
        syncControls();
        renderWeather();
        renderNews();
        renderStocks();

        /* 页面刚加载时给运行时留一段启动宽限期 */
        startupGraceUntil = Date.now() + 45000;

        loadBoard().then(function () {
          updateBrandStatus();
          scheduleContent();
        });
        loadStocks().then(function () {
          updateBrandStatus();
          scheduleQuotes();
        });
      })();
    </script>
  </body>
</html>
