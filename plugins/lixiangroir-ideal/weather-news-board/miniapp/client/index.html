<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>天气 · 新闻看板</title>
    <style>
      /* ---------- 语义变量：浅色 / 深色两套 ---------- */
      :root,
      [data-theme='light'] {
        --mcode-bg: #ffffff;
        --mcode-bg-secondary: #f5f5f5;
        --mcode-surface: #ffffff;
        --mcode-surface-muted: #fafafa;
        --mcode-text: #171717;
        --mcode-text-muted: #666666;
        --mcode-text-subtle: #adadad;
        --mcode-border: #0a0a0a14;
        --mcode-border-strong: #0a0a0af2;
        --mcode-accent: #0094fc;
        --mcode-success: #04b54b;
        --mcode-warning: #f56811;
        --mcode-danger: #f73646;
        --mcode-primary-action-bg: #171717;
        --mcode-primary-action-text: #ffffff;
        --mcode-shadow: 0 0 20px rgb(10 10 10 / 8%);
        /* A 股习惯：红涨绿跌 */
        --mcode-up: #f73646;
        --mcode-down: #04b54b;
        --mcode-flat: #949494;
      }

      [data-theme='dark'] {
        --mcode-bg: #171717;
        --mcode-bg-secondary: #1c1c1c;
        --mcode-surface: #262626;
        --mcode-surface-muted: #262626;
        --mcode-text: #ededed;
        --mcode-text-muted: #949494;
        --mcode-text-subtle: #666666;
        --mcode-border: #ffffff14;
        --mcode-border-strong: #fffffff2;
        --mcode-accent: #0077d9;
        --mcode-success: #009c3d;
        --mcode-warning: #e25507;
        --mcode-danger: #e31937;
        --mcode-primary-action-bg: #ffffff;
        --mcode-primary-action-text: #171717;
        --mcode-shadow: 0 0 20px rgb(0 0 0 / 34%);
        --mcode-up: #e31937;
        --mcode-down: #009c3d;
        --mcode-flat: #949494;
      }

      /* ---------- 基础 ---------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background: var(--mcode-bg);
        color: var(--mcode-text);
        font-family: ui-sans-serif, -apple-system, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif;
        font-size: 14px;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      a {
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 2px;
      }
      [hidden] {
        display: none !important;
      }

      /* 布局按可用容器宽度自适应，而非视口宽度 */
      .app-shell {
        width: 100%;
      }
      .app {
        container-type: inline-size;
        container-name: app;
        max-width: 1440px;
        margin: 0 auto 0 0;
        padding: 20px 24px 32px;
      }

      /* ---------- 顶栏 ---------- */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        position: relative;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 10px;
        min-width: 0;
      }
      .brand-title {
        margin: 0;
        font-size: 18px;
        line-height: 28px;
        font-weight: 600;
      }
      .brand-sub {
        font-size: 12px;
        color: var(--mcode-text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* 运行时还没就绪时的提示：宿主会在页面不可见时停掉进程 */
      .startup-chip {
        align-self: center;
        margin-left: 10px;
        padding: 2px 10px;
        border: 1px solid var(--mcode-border);
        border-radius: 12px;
        background: var(--mcode-surface-muted);
        color: var(--mcode-text-muted);
        font-size: 11.5px;
        white-space: nowrap;
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      /* ---------- 控件 ---------- */
      .switch {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        user-select: none;
        font-size: 12.5px;
        color: var(--mcode-text-muted);
        white-space: nowrap;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch-track {
        position: relative;
        width: 30px;
        height: 17px;
        border-radius: 9px;
        background: var(--mcode-border-strong);
        transition: background 150ms ease-out;
        flex: none;
      }
      .switch-track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--mcode-surface);
        transition: transform 150ms ease-out;
      }
      .switch input:checked + .switch-track {
        background: var(--mcode-accent);
      }
      .switch input:checked + .switch-track::after {
        transform: translateX(13px);
      }
      .switch input:focus-visible + .switch-track {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 2px;
      }

      input[type='text'],
      select {
        height: 32px;
        padding: 0 8px;
        border-radius: 8px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
        font: inherit;
        font-size: 12.5px;
        min-width: 0;
      }
      input[type='text']::placeholder {
        color: var(--mcode-text-subtle);
      }
      input[type='text']:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--mcode-accent);
        outline-offset: 1px;
        border-color: var(--mcode-border-strong);
      }

      .btn {
        height: 32px;
        padding: 0 12px;
        border-radius: 8px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
        color: var(--mcode-text);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        white-space: nowrap;
        transition: background 150ms ease-out, opacity 150ms ease-out;
      }
      .btn:hover {
        background: var(--mcode-bg-secondary);
      }
      .btn-primary {
        background: var(--mcode-primary-action-bg);
        color: var(--mcode-primary-action-text);
        border-color: transparent;
      }
      .btn-primary:hover {
        opacity: 0.88;
        background: var(--mcode-primary-action-bg);
      }
      .icon-btn {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface-muted);
        color: var(--mcode-text-muted);
        cursor: pointer;
        transition: background 150ms ease-out, color 150ms ease-out;
      }
      .icon-btn:hover {
        color: var(--mcode-text);
        background: var(--mcode-bg-secondary);
      }
      .icon-btn svg {
        width: 16px;
        height: 16px;
      }
      .icon-btn.is-spinning svg {
        animation: spin 900ms linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ---------- 卡片 ---------- */
      .board {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        align-items: start;
        overflow-x: hidden;
      }
      .card {
        background: var(--mcode-surface);
        border: 1px solid var(--mcode-border);
        border-radius: 12px;
        box-shadow: var(--mcode-shadow);
        padding: 14px;
        display: flex;
        flex-direction: column;
        min-width: 0;
        position: relative;
      }
      /* 手动指定尺寸的卡片：宽、高各自独立，其他卡片让出空间 */
      .card.is-sized-w {
        width: var(--cw);
        justify-self: start;
      }
      .card.is-sized-h {
        height: var(--ch);
        align-self: start;
      }
      .card.is-sized-h .stock-list,
      .card.is-sized-h .news-list {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }
      .card.is-sized-h .weather-body {
        overflow-y: auto;
      }
      .card-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .card-title {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
        font-weight: 500;
      }
      .card-meta {
        font-size: 12px;
        color: var(--mcode-text-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }

      /* ---------- 天气卡 ---------- */
      .weather-card {
        container-type: inline-size;
        container-name: weather;
      }
      .city-form {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }
      .city-form-row {
        display: flex;
        gap: 6px;
      }
      .city-form-row .btn {
        flex: 1;
        padding: 0 6px;
      }
      .city-form input[type='text'] {
        width: 100%;
      }
      .weather-body {
        flex: 1;
        min-height: 0;
        display: flex;
        overflow-y: auto;
      }
      .weather-inner {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        justify-content: space-between;
      }
      /* 内容不被压缩：放不下时由 weather-body 内部滚动 */
      .weather-inner > * {
        flex: 0 0 auto;
      }
      .weather-hourly {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .weather-hour {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        border-radius: 8px;
        background: var(--mcode-surface-muted);
        font-size: 12px;
      }
      .hour-time {
        width: 64px;
        flex: none;
        font-size: 11.5px;
        color: var(--mcode-text-muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .hour-day {
        color: var(--mcode-text-subtle);
        margin-right: 2px;
      }
      .hour-icon {
        width: 16px;
        height: 16px;
        flex: none;
        color: var(--mcode-text-muted);
      }
      .hour-temp {
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        min-width: 30px;
      }
      .hour-desc {
        flex: 1;
        min-width: 0;
        color: var(--mcode-text-muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hour-rain {
        flex: none;
        font-size: 11px;
        color: var(--mcode-text-subtle);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .weather-main {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .weather-icon {
        width: 44px;
        height: 44px;
        flex: none;
        color: var(--mcode-accent);
      }
      .weather-temp {
        font-size: 34px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.5px;
        font-variant-numeric: tabular-nums;
      }
      .weather-desc {
        margin-top: 6px;
        font-size: 12.5px;
        color: var(--mcode-text-muted);
      }
      .weather-metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .metric {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 7px;
        border-radius: 8px;
        background: var(--mcode-surface-muted);
        min-width: 0;
      }
      .metric-label {
        font-size: 10.5px;
        color: var(--mcode-text-subtle);
        white-space: nowrap;
      }
      .metric-value {
        font-size: 13px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .weather-forecast {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .forecast-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .forecast-line {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .forecast-day {
        font-size: 12px;
        color: var(--mcode-text-muted);
        width: 26px;
        flex: none;
      }
      .forecast-icon {
        width: 18px;
        height: 18px;
        flex: none;
        color: var(--mcode-text-muted);
      }
      .forecast-temp {
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .forecast-temp b {
        font-weight: 600;
      }
      .forecast-temp i {
        font-style: normal;
        color: var(--mcode-text-muted);
      }
      .forecast-bar {
        position: relative;
        height: 4px;
        border-radius: 2px;
        background: var(--mcode-bg-secondary);
        overflow: hidden;
      }
      .forecast-bar-fill {
        position: absolute;
        inset: 0 auto 0 0;
        border-radius: 2px;
        background: var(--mcode-accent);
      }
      .forecast-rain {
        font-size: 10.5px;
        color: var(--mcode-text-subtle);
        font-variant-numeric: tabular-nums;
      }

      @container weather (max-width: 272px) {
        .weather-icon {
          width: 38px;
          height: 38px;
        }
        .weather-temp {
          font-size: 30px;
        }
        .metric {
          padding: 5px 6px;
        }
        .metric-value {
          font-size: 12.5px;
        }
        .forecast-day {
          width: 24px;
        }
        .hour-desc,
        .hour-rain,
        .hour-day {
          display: none;
        }
        .hour-time {
          width: 44px;
        }
      }

      /* ---------- 自选股卡 ---------- */
      .stocks-form {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 8px;
      }
      .stocks-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .stocks-row input[type='text'] {
        flex: 1;
      }
      .stocks-options {
        justify-content: space-between;
      }
      .stock-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 196px), 1fr));
        gap: 4px 8px;
        align-content: start;
        flex: 0 0 auto;
      }
      .stock-row {
        position: relative;
        container-type: inline-size;
        container-name: tile;
        padding: 6px 8px;
        border-radius: 8px;
        min-width: 0;
        transition: background 150ms ease-out;
      }
      .stock-row:hover {
        background: var(--mcode-surface-muted);
      }
      .stock-top {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .stock-name {
        font-size: 13.5px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .stock-code {
        font-size: 11px;
        color: var(--mcode-text-subtle);
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
        flex: none;
      }
      .stock-remove {
        margin-left: auto;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: var(--mcode-text-subtle);
        cursor: pointer;
        flex: none;
        transition: color 150ms ease-out, background 150ms ease-out;
      }
      .stock-remove:hover {
        color: var(--mcode-danger);
        background: var(--mcode-surface-muted);
      }
      .stock-remove svg {
        width: 13px;
        height: 13px;
      }
      .stock-bottom {
        display: flex;
        align-items: baseline;
        gap: 4px 8px;
        margin-top: 2px;
        flex-wrap: wrap;
      }
      .stock-quote {
        display: inline-flex;
        align-items: baseline;
        gap: 3px;
        min-width: 0;
      }
      .stock-deltas {
        display: inline-flex;
        align-items: baseline;
        gap: 8px;
        flex-wrap: wrap;
      }
      .stock-price {
        font-size: 18px;
        line-height: 24px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stock-unit {
        font-size: 11px;
        color: var(--mcode-text-subtle);
        margin-left: 2px;
      }
      .stock-delta {
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .stock-delta .tri {
        width: 8px;
        height: 8px;
        flex: none;
      }
      .up {
        color: var(--mcode-up);
      }
      .down {
        color: var(--mcode-down);
      }
      .flat {
        color: var(--mcode-flat);
      }
      .stock-error {
        font-size: 12.5px;
        color: var(--mcode-text-muted);
      }
      .stock-empty {
        grid-column: 1 / -1;
        padding: 10px 2px;
        font-size: 12.5px;
        color: var(--mcode-text-muted);
      }
      .stocks-summary {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-size: 11.5px;
        color: var(--mcode-text-muted);
      }
      .summary-item {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-variant-numeric: tabular-nums;
      }
      .summary-item.is-up {
        color: var(--mcode-up);
      }
      .summary-item.is-down {
        color: var(--mcode-down);
      }
      .hint {
        margin: auto 0 0;
        padding-top: 8px;
        font-size: 11.5px;
        line-height: 17px;
        color: var(--mcode-text-subtle);
      }

      /* ---------- 新闻卡 ---------- */
      .news-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .news-tabs {
        display: flex;
        gap: 2px;
        padding: 3px;
        border-radius: 10px;
        background: var(--mcode-surface-muted);
        flex-wrap: wrap;
      }
      .news-tab {
        height: 28px;
        padding: 0 11px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--mcode-text-muted);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
        transition: background 150ms ease-out, color 150ms ease-out;
      }
      .news-tab:hover {
        color: var(--mcode-text);
      }
      .news-tab[aria-selected='true'] {
        background: var(--mcode-surface);
        color: var(--mcode-text);
        font-weight: 500;
        box-shadow: 0 1px 2px rgb(10 10 10 / 8%);
      }
      .news-status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--mcode-text-muted);
      }
      .news-updated {
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .status-badge {
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--mcode-surface-muted);
        color: var(--mcode-text-muted);
        font-size: 11.5px;
        white-space: nowrap;
      }
      .status-badge.is-ok {
        color: var(--mcode-success);
      }
      .status-badge.is-warn {
        color: var(--mcode-warning);
      }
      .status-badge.is-error {
        color: var(--mcode-danger);
      }
      .news-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .news-item {
        position: relative;
        padding: 9px 10px 9px 12px;
        border-radius: 8px;
        background: var(--mcode-surface-muted);
      }
      .news-item::before {
        content: '';
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 2px;
        border-radius: 1px;
        background: var(--mcode-accent);
        opacity: 0;
        transition: opacity 150ms ease-out;
      }
      .news-item:hover::before {
        opacity: 1;
      }
      .news-title {
        display: block;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.45;
        color: var(--mcode-text);
        text-decoration: none;
      }
      .news-title:hover {
        color: var(--mcode-accent);
      }
      .news-desc {
        margin: 4px 0 0;
        font-size: 12.5px;
        line-height: 19px;
        color: var(--mcode-text-muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .news-meta {
        margin-top: 5px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        color: var(--mcode-text-subtle);
      }
      .news-source {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .source-dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: currentColor;
        flex: none;
      }
      .news-time {
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11.5px;
      }
      .hot-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: 8px;
        transition: background 150ms ease-out;
      }
      .hot-item:hover {
        background: var(--mcode-surface-muted);
      }
      .hot-rank {
        width: 18px;
        flex: none;
        text-align: center;
        font-size: 12px;
        font-weight: 600;
        color: var(--mcode-text-subtle);
        font-variant-numeric: tabular-nums;
      }
      .hot-item:nth-child(-n + 3) .hot-rank {
        color: var(--mcode-accent);
      }
      .hot-title {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        color: var(--mcode-text);
        text-decoration: none;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hot-title:hover {
        color: var(--mcode-accent);
      }
      .hot-score {
        flex: none;
        font-size: 12px;
        color: var(--mcode-text-muted);
        font-variant-numeric: tabular-nums;
      }
      .list-empty {
        padding: 14px 2px;
        font-size: 12.5px;
        color: var(--mcode-text-muted);
      }

      /* ---------- 提示条 ---------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        padding: 8px 14px;
        border-radius: 8px;
        background: var(--mcode-primary-action-bg);
        color: var(--mcode-primary-action-text);
        font-size: 12.5px;
        box-shadow: var(--mcode-shadow);
        z-index: 20;
        max-width: calc(100vw - 32px);
      }
      .toast.is-error {
        background: var(--mcode-danger);
        color: #ffffff;
      }

      /* ---------- 卡片尺寸手柄 ---------- */
      .card-grip {
        position: absolute;
        right: 5px;
        bottom: 5px;
        width: 22px;
        height: 22px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        border: 1px solid var(--mcode-border);
        background: var(--mcode-surface);
        color: var(--mcode-text-subtle);
        cursor: nwse-resize;
        padding: 0;
        z-index: 3;
        opacity: 0.45;
        user-select: none;
        touch-action: none;
        transition: opacity 150ms ease-out, color 150ms ease-out, border-color 150ms ease-out;
      }
      .card:hover .card-grip,
      .card-grip:focus-visible,
      .card-grip.is-active {
        opacity: 1;
        color: var(--mcode-accent);
        border-color: var(--mcode-accent);
      }
      .card-grip svg {
        width: 13px;
        height: 13px;
        pointer-events: none;
      }
      .resize-badge {
        position: fixed;
        padding: 4px 9px;
        border-radius: 8px;
        background: var(--mcode-primary-action-bg);
        color: var(--mcode-primary-action-text);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        box-shadow: var(--mcode-shadow);
        z-index: 40;
        pointer-events: none;
        white-space: nowrap;
      }

      /* ---------- 响应式（按容器宽度自适应，不依赖视口宽度） ---------- */
      @container app (min-width: 560px) and (max-width: 899px) {
        .board {
          grid-template-columns: var(--col-weather, clamp(184px, 30%, 268px)) var(--col-stocks, minmax(0, 1fr));
          align-items: stretch;
        }
        .news-card {
          grid-column: 1 / -1;
        }
      }
      @container app (min-width: 900px) {
        .board {
          grid-template-columns: var(--col-weather, minmax(210px, 0.55fr)) var(--col-stocks, minmax(320px, 1.25fr)) var(--col-news, minmax(280px, 1.5fr));
          align-items: start;
        }
        .news-card {
          grid-column: auto;
        }
      }
      @container app (max-width: 559px) {
        .app {
          padding: 14px 14px 24px;
        }
      }
      @container tile (max-width: 190px) {
        .stock-name {
          font-size: 12.5px;
        }
        .stock-code {
          font-size: 10px;
        }
      }
      @container tile (max-width: 168px) {
        .stock-price {
          font-size: 16px;
          line-height: 22px;
        }
      }
      @container tile (max-width: 120px) {
        .stock-code {
          display: none;
        }
      }
      /* 不支持容器查询时退回视口断点 */
      @supports not (container-type: inline-size) {
        @media (min-width: 900px) {
          .board {
            grid-template-columns: var(--col-weather, minmax(210px, 0.55fr)) var(--col-stocks, minmax(320px, 1.25fr)) var(--col-news, minmax(280px, 1.5fr));
            align-items: start;
          }
          .news-card {
            grid-column: auto;
          }
        }
        @media (min-width: 560px) and (max-width: 899px) {
          .board {
            grid-template-columns: var(--col-weather, clamp(184px, 30%, 268px)) var(--col-stocks, minmax(0, 1fr));
            align-items: stretch;
          }
          .news-card {
            grid-column: 1 / -1;
          }
        }
        @media (max-width: 559px) {
          .app {
            padding: 14px 14px 24px;
          }
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>

          haze:
            '<circle cx="12" cy="8.6" r="3.4"/>' +
            '<path d="M12 2.9v1.7M5.9 8.6H4.2M6.8 3.4 5.5 2.1M18.1 3.4l1.3-1.3"/>' +
            '<path d="M4.6 15.4h14.8M6.6 18.8h10.8"/>',
          rain:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M9 18.4l-.9 2.6M13 18.4l-.9 2.6M17 18.4l-.9 2.6"/>',
          drizzle:

            '<path d="M8.4 19.2v2.8M7.2 19.9l2.4 1.4M9.6 19.9l-2.4 1.4M15.6 19.2v2.8M14.4 19.9l2.4 1.4M16.8 19.9l-2.4 1.4"/>',
          sleet:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M9.2 18.6l-.8 2.4"/>' +
            '<path d="M15.6 19.2v2.8M14.4 19.9l2.4 1.4M16.8 19.9l-2.4 1.4"/>',
          thunder:
            '<path d="M7.5 15.2h9a4 4 0 0 0 .3-8 5.5 5.5 0 0 0-10.6 1.8A3.2 3.2 0 0 0 7.5 15.2Z"/>' +
            '<path d="M13.2 17.2 10 21h2.6l-1.1 2.6"/>',
          wind: '<path d="M3.4 8.4h9a2.8 2.8 0 1 0-2.8-2.8M3.4 12.4h13a2.8 2.8 0 1 1-2.8 2.8M3.4 16.4h6.6"/>',
        };

        var TRI_UP = '<svg class="tri" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M5 1.4 9.2 8.6H0.8Z"/></svg>';
        var TRI_DOWN = '<svg class="tri" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><path d="M5 8.6 0.8 1.4h8.4Z"/></svg>';
        var TRI_FLAT = '<svg class="tri" viewBox="0 0 10 10" aria-hidden="true" focusable="false"><rect x="1" y="4.2" width="8" height="1.6" rx="0.8"/></svg>';

        function weatherSvg(key, className) {
          var body = WEATHER_ICONS[key] || WEATHER_ICONS.cloud;
          return '<svg class="' + className + '" ' + ICON_ATTR + '>' + body + '</svg>';
        }

        /* ================= 常量与状态 ================= */
        var TABS = [
          { key: 'headlines', label: '要闻' },

          { key: 'tech', label: '科技' },

        var VIEW_KEY = 'weather-news-board:view:v1';
        var THEME_KEY = 'weather-news-board:theme';

        var state = {
          tab: 'headlines',
          autoRefresh: true,
